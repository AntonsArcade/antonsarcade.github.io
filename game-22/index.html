 S.diff=t.d[t.r];S.stad=UM.stad;S.len=UM.len;S.career=0;MODE='ut';startMatch(me,opp,true,()=>utTour());G.utk='tour'}
function tourPay(won){const t=UT.tour;if(!t)return[['Tournament over',0]];let l;
 if(won){l=[[TOUR_NM[t.r]+' won',TOUR_PAY[t.r]]];t.r++;if(t.r>=3){l.push(['CHAMPIONS bonus + Gold Pack',TOUR_BONUS]);UT.inv.push({pack:'gold'});UT.tour=null;utEv('tourWin')}}
 else{l=[['Knocked out',0]];UT.tour=null}
 return l}

/* ================= LEAGUE SEASON ================= */
const SEA_PRIZE=[[15000,'elite'],[8000,'gold'],[4000,null],[2000,null],[1500,null],[1500,null],[1500,null],[1500,null]];
function seaFixtures(n){const a=[...Array(n).keys()],R=[];for(let r=0;r<n-1;r++){const f=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];f.push(r%2?[y,x]:[x,y])}R.push(f);a.splice(1,0,a.pop())}return[...R,...R.map(f=>f.map(([x,y])=>[y,x]))]}
function utSeaNew(){const o=utSquadInfo().ovr,used=[],tm=[{n:UT.club.name,ovr:o,me:1}];
 for(let i=0;i<7;i++){let k,n=0;do{k=utOpponent(o+[-6,-3,0,2,4,6,9][i],2)}while(used.includes(k)&&n++<30);used.push(k);tm.push({n:T[k][0],ovr:T[k][1],ti:k})}
 tm.forEach(t=>{t.p=t.w=t.d=t.l=t.gf=t.ga=t.pts=0});UT.season={r:0,tm,fx:seaFixtures(8)};utSave()}
function seaPoi(l){let k=0,p=1;const L=Math.exp(-l);let s=Math.random();let c=L;p=L;while(s>c&&k<9){k++;p*=l/k;c+=p}return k}
function seaPlay(t,u,gt,gu){t.p++;u.p++;t.gf+=gt;t.ga+=gu;u.gf+=gu;u.ga+=gt;if(gt>gu){t.w++;t.pts+=3;u.l++}else if(gt<gu){u.w++;u.pts+=3;t.l++}else{t.d++;u.d++;t.pts++;u.pts++}}
function seaSim(a,b){const d=(a.ovr-b.ovr)/22;return[seaPoi(Math.max(.4,1.35+d)),seaPoi(Math.max(.4,1.35-d))]}
function seaOrder(S2){return S2.tm.map((t,i)=>i).sort((a,b)=>{const x=S2.tm[a],y=S2.tm[b];return y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf})}
function seaRecord(res){const S2=UT.season;if(!S2||S2.r>=14)return;const r=S2.fx[S2.r],tm=S2.tm;
 for(const[x,y]of r){if(x==0||y==0){const o=x==0?y:x;seaPlay(tm[0],tm[o],res.h,res.a)}else{const[gx,gy]=seaSim(tm[x],tm[y]);seaPlay(tm[x],tm[y],gx,gy)}}
 S2.r++;utSave()}
function utSeason(){closeModal();if(!UT.season)utSeaNew();const S2=UT.season,tm=S2.tm,o=seaOrder(S2),done=S2.r>=14;
 const rows=o.map((i,k)=>{const t=tm[i];return `<tr style="${t.me?'background:#12351f;font-weight:800':''}"><td>${k+1}</td><td style="text-align:left">${t.n}</td><td>${t.ovr}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf-t.ga>0?'+':''}${t.gf-t.ga}</td><td><b>${t.pts}</b></td></tr>`}).join('');
 let body;
 if(done){const pos=o.indexOf(0),pz=SEA_PRIZE[pos];body=`<div class=frow style="border-color:#f5c842"><div><b>Season complete — you finished ${pos+1}${['st','nd','rd'][pos]||'th'}</b><br><small style="color:#ffe08a">Prize 🪙${pz[0].toLocaleString()}${pz[1]?' + '+PACKS.find(p=>p.id==pz[1]).n:''}</small></div><button class=go onclick="utSeaClaim()">Collect & start new season</button></div>`}
 else{const f=S2.fx[S2.r].find(x=>x[0]==0||x[1]==0),home=f[0]==0,opp=tm[home?f[1]:f[0]];body=`<div class=frow style="border-color:#3ddc84"><div><b>Matchday ${S2.r+1}/14</b><br><small style="color:#9fb3d9">${home?'Home':'Away'} vs ${opp.n} · ${opp.ovr} OVR · Hard</small></div><button class=go onclick="utSeaKick()">Play ▶</button></div>`}
 ui.innerHTML=utHead('LEAGUE SEASON')+`<div class=card style="width:100%;max-width:700px">${body}<table style="width:100%;border-collapse:collapse;font-size:13px;text-align:center;margin-top:10px"><tr style="color:#9fb3d9"><th>#</th><th style="text-align:left">Club</th><th>OVR</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>${rows}</table>
 <p class=hint style="margin:10px 0 0">14 matches, home and away. Normal match rewards apply every game. Final prizes: 1st 🪙15,000 + Elite Pack · 2nd 🪙8,000 + Gold Pack · 3rd 🪙4,000 · 4th 🪙2,000 · others 🪙1,500. Other results are simulated.</p>
 <div class=row style="margin-top:10px"><button onclick="utSquad()">Edit squad</button>${done?'':`<button onclick="if(confirm('Abandon this season?')){UT.season=null;utSave();utSeason()}">Abandon</button>`}</div></div>`}
function utSeaKick(){const S2=UT.season,f=S2.fx[S2.r].find(x=>x[0]==0||x[1]==0),opp=S2.tm[f[0]==0?f[1]:f[0]],me=utTeam(),t=T[opp.ti].slice();t.form=rndForm();
 S.diff=2;S.stad=UM.stad;S.len=UM.len;S.career=0;MODE='ut';startMatch(me,t,false,()=>utSeason());G.utk='season';G.seaHome=f[0]==0}
function utSeaClaim(){const S2=UT.season;if(!S2||S2.r<14)return;const pos=seaOrder(S2).indexOf(0),pz=SEA_PRIZE[pos];UT.coins+=pz[0];if(pz[1])UT.inv.push({pack:pz[1]});if(pos==0)utEv('tourWin');UT.season=null;utSave();toast('+🪙'+pz[0].toLocaleString());utSeason()}

setupGL();menu();requestAnimationFrame(loop);
</script></body></html>
