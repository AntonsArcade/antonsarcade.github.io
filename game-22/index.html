 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));const pt=new THREE.Points(geo,new THREE.PointsMaterial({size:.5,vertexColors:true}));world.add(pt);FXP.push({pt,v,pos,t:0})}
function fxTxt(){if(!G||!G.fx)return'';const f=(t,n)=>{const x=G.fx[t],a=[];if(x.sp>0)a.push('⚡'+Math.ceil(x.sp));if(x.pw>0)a.push('🔥'+Math.ceil(x.pw));if(x.fz>0)a.push('❄'+Math.ceil(x.fz));return a.length?n+': '+a.join(' '):''};return[f(0,'You'),f(1,'Them')].filter(Boolean).join('   ')}
function orbs(dt){const g=G;for(const t of[0,1])for(const k in g.fx[t])if(g.fx[t][k]>0)g.fx[t][k]-=dt;if(!S.arc)return;
 if(!g.orb){g.orbT-=dt;if(g.orbT<=0){const ty=['sp','pw','fz'][Math.random()*3|0],cs={sp:0xffd23f,pw:0xff5533,fz:0x55ddff},x=(Math.random()-.5)*(FX*2-30),z=(Math.random()-.5)*(FZ*2-14);
  const m=new THREE.Mesh(new THREE.OctahedronGeometry(.8),new THREE.MeshBasicMaterial({color:cs[ty]}));m.position.set(x,1.4,z);world.add(m);
  const r=new THREE.Mesh(new THREE.RingGeometry(1.1,1.5,24),new THREE.MeshBasicMaterial({color:cs[ty],side:2,transparent:true,opacity:.7}));r.rotation.x=-Math.PI/2;r.position.set(x,.06,z);world.add(r);g.orb={x,z,ty,m,r};msg('⚡ POWER-UP ON THE PITCH!',1.3)}}
 else{const o=g.orb;let hit=null,bd=1.7;for(const p of P){const x=dd(p,o);if(x<bd){bd=x;hit=p}}
  if(hit){world.remove(o.m);world.remove(o.r);g.orb=null;g.orbT=15+Math.random()*10;const t=hit.t;
   if(o.ty=='sp'){g.fx[t].sp=9;msg(t?'THEY GOT SPEED!':'SPEED BOOST!',1.4)}else if(o.ty=='pw'){g.fx[t].pw=9;msg(t?'THEY GOT POWER SHOTS!':'POWER SHOTS!',1.4)}else{g.fx[1-t].fz=4;msg(t?'YOU ARE FROZEN!':'OPPONENTS FROZEN!',1.4)}snd('orb')}}}
function shootout(done){SH={H:G.h[0],A:G.a[0],p:[],o:[],ps:0,os:0,turn:'p',last:'',fin:0,done};soDraw()}
function soDraw(){const s=SH,dots=l=>l.map(x=>x?'⚽':'❌').join(' ')||'–',zs=['↖ High left','↑ High centre','↗ High right','↙ Low left','↓ Low centre','↘ Low right'];
 let h=`<h2>Penalty shootout</h2><div class=big>${s.H} ${s.ps} – ${s.os} ${s.A}</div><p class=hint>You: ${dots(s.p)}<br>Them: ${dots(s.o)}</p>${s.last?`<p class=hint style="font-size:20px;color:#ffd23f">${s.last}</p>`:''}`;
 if(s.fin)h+=`<button class=go onclick="SH.done(SH.fin==1)">Continue</button>`;
 else if(s.turn=='p')h+=`<h3>Your penalty – pick a corner</h3><div style="display:grid;grid-template-columns:repeat(3,minmax(90px,150px));gap:8px">${zs.map((z,i)=>`<button onclick="soKick(${i})">${z}</button>`).join('')}</div>`;
 else h+=`<h3>Their penalty – pick a way to dive</h3><div class=row>${['Dive left','Stay centre','Dive right'].map((z,i)=>`<button onclick="soKick(${i})">${z}</button>`).join('')}</div>`;
 ui.style.display='flex';ui.innerHTML=h}
function soKick(i){const s=SH;if(!s||s.fin)return;let r;
 if(s.turn=='p'){const row=i/3|0,col=i%3,dive=Math.random()*3|0;
  if(Math.random()<(row?.05:.14))r=[0,'You skied it over the bar!'];else if(dive==col&&Math.random()<(row?.8:.5)*(.8+G.diff*.1))r=[0,'Saved by the keeper!'];else r=[1,'GOAL!'];
  s.p.push(r[0]);s.ps+=r[0];s.turn='o'}
 else{const row=Math.random()<.4?0:1,col=Math.random()*3|0;
  if(Math.random()<(row?.05:.14))r=[0,'They blazed it over!'];else if(i==col&&Math.random()<(row?.75:.45))r=[0,'What a save!'];else r=[1,'They score.'];
  s.o.push(r[0]);s.os+=r[0];s.turn='p'}
 s.last=r[1];snd(r[0]?'goal':'save');
 const pk=s.p.length,ok=s.o.length,rp=Math.max(0,5-pk),ro=Math.max(0,5-ok);let d=0;
 if(pk<=5&&ok<=5){if(s.ps>s.os+ro)d=1;else if(s.os>s.ps+rp)d=2}
 if(!d&&pk==ok&&pk>=5&&s.ps!=s.os)d=s.ps>s.os?1:2;
 s.fin=d;soDraw()}
