<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ride Empire</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#141a28;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;cursor:pointer}
#menu{position:fixed;left:0;top:0;bottom:0;width:min(440px,100vw);background:rgba(12,16,26,.94);padding:14px 14px 90px;overflow-y:auto;border-right:1px solid #2a3350}
#menu .top{display:flex;justify-content:space-between;align-items:center}
#menu .logo{font-weight:900;letter-spacing:.5px;font-size:18px}
#menu .money{font-weight:800;color:#6dff9a;font-size:20px}
#menu .sub{color:#9fb0d8;font-size:13px;margin:2px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px 4px;border:0;border-radius:8px;background:#1d2540;color:#b9c6ee;font-weight:700}
.tabs button.on{background:#ff5a1f;color:#fff}
.card{background:#182036;border:1px solid #27325a;border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:15px}
.card p{margin:4px 0 8px;font-size:12.5px;color:#a9b7e0;line-height:1.35}
label.f{display:block;font-size:12px;color:#9fb0d8;margin:8px 0 3px}
input[type=text]{width:100%;padding:9px;border-radius:8px;border:1px solid #33427a;background:#0e1424;color:#fff;font-size:15px;font-weight:700}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.colors div{font-size:11px;color:#9fb0d8;text-align:center}
input[type=color]{width:100%;height:36px;border:0;border-radius:8px;background:none;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 11px;border-radius:9px;border:2px solid transparent;background:#222c4c;color:#fff;font-weight:700;font-size:14px}
.chip.on{border-color:#ff5a1f;background:#33210f}
.btn{padding:10px 14px;border:0;border-radius:9px;background:#ff5a1f;color:#fff;font-weight:800}
.btn.alt{background:#2e3a66}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.pips{display:flex;gap:4px;margin:4px 0}
.pips i{width:22px;height:8px;border-radius:4px;background:#2a3358}
.pips i.on{background:#6dff9a}
.bar{display:flex;align-items:center;gap:6px;font-size:11px;color:#9fb0d8;margin:2px 0}
.bar span{width:64px}
.bar b{flex:1;height:6px;border-radius:3px;background:#27325a;overflow:hidden}
.bar b i{display:block;height:100%;background:linear-gradient(90deg,#ff5a1f,#ffd23f)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
#ridebar{position:fixed;left:0;bottom:0;width:min(440px,100vw);padding:10px 14px;background:linear-gradient(0deg,#0c101a 70%,transparent);display:flex;gap:8px}
#ridebar .btn{flex:1;font-size:16px;padding:13px}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#000c;padding:9px 16px;border-radius:20px;font-weight:700;display:none;z-index:9}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hl{position:absolute;left:14px;top:12px;text-shadow:0 2px 6px #000}
#hBrand{font-weight:900;font-size:18px}
#hFame{width:170px;height:7px;background:#0007;border-radius:4px;margin:5px 0 2px;overflow:hidden}
#hFameBar{display:block;height:100%;background:#ffd23f;width:0}
#hFameTxt{font-size:12px}
#hr{position:absolute;right:14px;top:12px;text-align:right;text-shadow:0 2px 6px #000}
#hMoney{font-weight:900;font-size:22px;color:#6dff9a}
#hScore{font-size:13px}
#hGarage{pointer-events:auto;margin-top:6px;padding:7px 11px;border:0;border-radius:8px;background:#000a;color:#fff;font-weight:700}
#pops{position:absolute;left:0;right:0;top:20%;display:flex;flex-direction:column;align-items:center;gap:6px}
.pop{padding:7px 16px;border-radius:20px;font-weight:900;font-size:20px;background:#000a;animation:pp 2s forwards;text-shadow:0 2px 4px #000}
.pop.good{color:#6dff9a}.pop.bad{color:#ff6b6b}.pop.gold{color:#ffd23f}
@keyframes pp{0%{transform:scale(.6);opacity:0}10%{transform:scale(1.1);opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
#hbot{position:absolute;left:14px;bottom:14px;text-shadow:0 2px 6px #000}
#spd{font-size:40px;font-weight:900}
#hBattWrap{width:140px;height:10px;background:#0008;border-radius:5px;margin-top:4px;overflow:hidden;display:none}
#hBatt{display:block;height:100%;background:#35e0ff;width:100%}
#hLive{position:absolute;left:0;right:0;bottom:90px;text-align:center;font-size:20px;font-weight:900;text-shadow:0 2px 6px #000}
#hHint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:13px;color:#ffeeb0;text-shadow:0 2px 4px #000;padding:0 150px}
#touch{position:fixed;inset:0;pointer-events:none;display:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#touch *{touch-action:none}
#joy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;border:2px solid #fff4;background:#0003;pointer-events:auto}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fff5;border:2px solid #fff8;transition:transform .06s}
#joy b{position:absolute;color:#fff7;font-size:11px;font-weight:800;line-height:1}
#joy b:nth-of-type(1){left:50%;top:5px;transform:translateX(-50%)}#joy b:nth-of-type(2){left:50%;bottom:5px;transform:translateX(-50%)}
#joy b:nth-of-type(3){left:6px;top:50%;transform:translateY(-50%)}#joy b:nth-of-type(4){right:6px;top:50%;transform:translateY(-50%)}
#touch button{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid #fff5;background:#0004;color:#fffd;font-size:10px;font-weight:800;padding:0;line-height:1.1}
#touch button.on{background:#ffd23f99;color:#000}
#touch .big{width:64px;height:64px;font-size:11px}#touch .sm{width:46px;height:46px}#touch .xs{width:40px;height:40px;font-size:9px}
body.touchui #hbot{left:50%;transform:translateX(-50%);text-align:center;bottom:8px}
body.touchui #hHint{bottom:56px;padding:0 200px;font-size:11px;opacity:.85}
body.touchui #hLive{bottom:80px}
#hWanted{position:absolute;left:0;right:0;top:12px;text-align:center;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 6px #000;letter-spacing:1px}
#hBustWrap{position:absolute;left:50%;top:48px;transform:translateX(-50%);width:220px;height:12px;border-radius:6px;background:#0009;overflow:hidden;display:none;border:1px solid #fff4}
#hBust{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff3b3b)}
#hFx{position:absolute;inset:0;pointer-events:none}
#hBusted{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#000b;font-size:60px;font-weight:900;color:#ff6b6b;text-align:center;text-shadow:0 4px 12px #000}
#hNet{margin-top:3px;font-size:12px;font-weight:700;color:#bfe3ff}
#hCopy{pointer-events:auto;margin-top:4px;padding:5px 10px;border:0;border-radius:7px;background:#000a;color:#fff;font-weight:700;font-size:12px}
#tags{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-weight:800;white-space:nowrap;padding:2px 8px;border-radius:10px;background:#000a;text-shadow:0 1px 2px #000}
.bar em{font-style:normal;width:68px;text-align:right;color:#fff;font-size:11px}
ol.steps{margin:6px 0 8px 18px;padding:0;font-size:13px;line-height:1.5;color:#c9d6f5}
@media(max-aspect-ratio:1/1){#menu{top:auto;left:0;right:0;width:100%;height:58vh;border-right:0;border-top:1px solid #2a3350}#ridebar{width:100%}#hHint{padding:0 10px;bottom:150px}}
</style>
</head>

const UP=new THREE.Vector3(0,1,0);
function place(mesh,a,b){const d=b.clone().sub(a);const len=d.length();mesh.position.copy(a).addScaledVector(d,.5);mesh.scale.set(1,Math.max(len,.001),1);mesh.quaternion.setFromUnitVectors(UP,d.normalize())}
function tube(a,b,r,m){const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,8),m);place(mesh,a,b);mesh.castShadow=true;return mesh}
function decalTex(b,w=512,h=128){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  const txt=String(b.name).toUpperCase();let fs=70;x.textBaseline='middle';
  do{x.font='900 '+fs+'px Arial,sans-serif';fs-=4}while(x.measureText(txt).width>w-120&&fs>16);
  x.shadowColor='rgba(0,0,0,.7)';x.shadowBlur=6;x.fillStyle=b.color;
  x.font='64px Arial,sans-serif';x.fillText(b.logo,8,h/2+3);
  x.font='900 '+(fs+4)+'px Arial,sans-serif';x.fillText(txt,92,h/2+3);
  return new THREE.CanvasTexture(c);
}
/* a wheel: 'spoke' (bicycle), 'knob' (off-road, knobbly tyre) or 'solid' (scooter) */
function wheelMesh(wr,tw,M,style){
  const g=new THREE.Group();
  if(style==='solid'){
    const t=new THREE.Mesh(new THREE.CylinderGeometry(wr,wr,tw*1.8,18),M.tire);t.rotation.z=Math.PI/2;t.castShadow=true;g.add(t);
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(wr*.58,wr*.58,tw*2,12),M.rim);hub.rotation.z=Math.PI/2;g.add(hub);
    const mk=new THREE.Mesh(new THREE.BoxGeometry(tw*2.2,wr*.4,.02),M.dark);mk.position.set(0,wr*.3,0);g.add(mk);
    return g;
  }
  const t=new THREE.Mesh(new THREE.TorusGeometry(wr,tw,8,28),M.tire);t.rotation.y=Math.PI/2;t.castShadow=true;g.add(t);
  const rm=new THREE.Mesh(new THREE.TorusGeometry(wr-tw*.85,.012,6,28),M.rim);rm.rotation.y=Math.PI/2;g.add(rm);
  for(let k=0;k<4;k++){const s=new THREE.Mesh(new THREE.BoxGeometry(.008,(wr-tw)*1.9,.01),M.dark);s.rotation.x=k*Math.PI/4;g.add(s)}
  if(style==='knob'){
    const kg=new THREE.BoxGeometry(tw*1.5,.035,.06);
    for(let k=0;k<18;k++){const a=k/18*TAU,r=wr+tw*.75,kn=new THREE.Mesh(kg,M.tire);kn.position.set(0,Math.cos(a)*r,Math.sin(a)*r);kn.rotation.x=a;g.add(kn)}
  }
  return g;
}

/* ---- pedal bike / e-bike frame ---- */
function partsPedal(d,model,M){
  const wr=d.wr,wb=d.wb,tw=d.tw||.05,th=.022;
  const R=V(0,wr,-wb/2),BB=V(0,wr*.8,-.08),ST=V(0,wr+.52,-.22),HT=V(0,wr+.5,wb/2-.2),HB=V(0,wr+.2,wb/2-.14);
  [[R,BB],[R,ST],[BB,ST],[ST,HT],[BB,HB],[HT,HB]].forEach(p=>model.add(tube(p[0],p[1],th,M.frame)));
  const rw=wheelMesh(wr,tw,M,'spoke');rw.position.copy(R);model.add(rw);
  const steer=new THREE.Group();steer.position.copy(HT);model.add(steer);
  const FP=V(0,-.5,.2);
  steer.add(tube(V(0,0,0),FP,.022,M.fork));
  if(d.susp>=1)steer.add(tube(V(0,-.25,.1),FP,.032,M.yellow));
  const fw=wheelMesh(wr,tw,M,'spoke');fw.position.copy(FP);steer.add(fw);
  steer.add(tube(V(0,0,0),V(0,.12,-.05),.02,M.dark));
  steer.add(tube(V(-.34,.12,-.05),V(.34,.12,-.05),.017,M.dark));
  const seat=new THREE.Mesh(new THREE.BoxGeometry(.12,.05,.27),M.seat);seat.position.set(0,wr+.56,-.24);seat.castShadow=true;model.add(seat);
  const crank=new THREE.Group();crank.position.copy(BB);model.add(crank);
  crank.add(tube(V(-.08,0,0),V(-.08,.17,0),.014,M.dark));crank.add(tube(V(.08,0,0),V(.08,-.17,0),.014,M.dark));
  const p1=new THREE.Mesh(new THREE.BoxGeometry(.1,.02,.08),M.dark);p1.position.set(-.12,.17,0);crank.add(p1);
  const p2=p1.clone();p2.position.set(.12,-.17,0);crank.add(p2);
  if(d.motor){
    const mo=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.17,14),mat('#2b2f3a',.7,.35));mo.rotation.z=Math.PI/2;mo.position.copy(BB);mo.castShadow=true;model.add(mo);
    const gl=new THREE.Mesh(new THREE.TorusGeometry(.1,.012,6,18),new THREE.MeshStandardMaterial({color:'#35e0ff',emissive:'#35e0ff',emissiveIntensity:1.2}));gl.rotation.y=Math.PI/2;gl.position.set(.09,BB.y,BB.z);model.add(gl);
    const mid=BB.clone().add(HB).multiplyScalar(.5),dir=HB.clone().sub(BB);
    const bat=new THREE.Mesh(new THREE.BoxGeometry(.12,.1,.46),mat('#1b2433',.5,.4));bat.position.copy(mid).add(V(0,.08,0));bat.quaternion.setFromUnitVectors(V(0,0,1),dir.clone().normalize());bat.castShadow=true;model.add(bat);
  }
  if(d.susp>=2)model.add(tube(V(0,wr+.4,-.2),V(0,wr+.08,-wb/2+.04),.028,M.yellow));
  if(d.brand){
    const dm=new THREE.MeshBasicMaterial({map:decalTex(d.brand),transparent:true,side:THREE.DoubleSide,depthWrite:false});
    const mid=BB.clone().add(HB).multiplyScalar(.5),dir=HB.clone().sub(BB),ang=-Math.atan2(dir.y,dir.z);
    [-1,1].forEach(sd=>{const g=new THREE.Group();g.position.set(sd*(th+.008),mid.y,mid.z);g.rotation.x=ang;
      const p=new THREE.Mesh(new THREE.PlaneGeometry(.5,.125),dm);p.rotation.y=sd*Math.PI/2;g.add(p);model.add(g)});
  }
  const BBy=wr*.8,BBz=-.08;
  return{steer,fw,rw,crank,rider:{hip:V(0,wr+.64,-.3),sh:V(0,wr+1.08,0),head:V(0,wr+1.27,.06),t0:V(0,wr+.68,-.3),t1:V(0,wr+1.1,0),
    hand:V(.3,wr+.62,wb/2-.25),hup:V(.45,wr+1.5,.12),
    feet:cr=>{const c=Math.cos(cr),s=Math.sin(cr);return[V(-.11,BBy+c*.17,BBz+s*.17),V(.11,BBy-c*.17,BBz-s*.17)]}}};
}

function partsMoto(d,model,M){

  /* battery body, side panels, long tail seat, nose */

  [-1,1].forEach(s=>add(new THREE.BoxGeometry(.035,.32,.46),red,s*.13,wr+.36,.1));
  const tail=add(new THREE.BoxGeometry(.28,.1,1.02),red,0,wr+.68,-.4);tail.rotation.x=.1;
  add(new THREE.BoxGeometry(.2,.1,.6),blk,0,wr+.54,-.5);

  /* front end */

    steer.add(tube(V(s*.08,0,0),V(s*.08,FP.y+.22,FP.z-.03),.03,M.fork));
    steer.add(tube(V(s*.08,FP.y+.22,FP.z-.03),V(s*.075,FP.y,FP.z),.036,blk));

  const fd=new THREE.Mesh(new THREE.CylinderGeometry(wr*.5,wr*.5,.012,16),M.dark);fd.rotation.z=Math.PI/2;fd.position.set(.07,0,0);fw.add(fd);
  const fend=new THREE.Mesh(new THREE.BoxGeometry(.16,.04,.6),red);fend.position.set(0,FP.y+wr+.1,FP.z+.06);fend.rotation.x=-.1;fend.castShadow=true;steer.add(fend);
  steer.add(tube(V(0,0,0),V(0,.12,-.04),.025,blk));
  steer.add(tube(V(-.38,.12,-.04),V(.38,.12,-.04),.016,blk));
  const hl=new THREE.Mesh(new THREE.SphereGeometry(.06,10,8),new THREE.MeshStandardMaterial({color:'#ffffff',emissive:'#ffffaa',emissiveIntensity:1}));hl.position.set(0,.04,.13);steer.add(hl);
  const plate=new THREE.Mesh(new THREE.BoxGeometry(.2,.16,.02),blk);plate.position.set(0,.0,.16);steer.add(plate);
  /* motor + glow ring, foot pegs */
  const mo=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.24,14),mat('#23262e',.7,.35));mo.rotation.z=Math.PI/2;mo.position.set(0,wr*.62,-.1);mo.castShadow=true;model.add(mo);
  const gl=new THREE.Mesh(new THREE.TorusGeometry(.09,.012,6,18),new THREE.MeshStandardMaterial({color:'#35e0ff',emissive:'#35e0ff',emissiveIntensity:1.2}));gl.rotation.y=Math.PI/2;gl.position.set(.125,wr*.62,-.1);model.add(gl);
  [-1,1].forEach(s=>add(new THREE.BoxGeometry(.1,.025,.07),M.dark,s*.17,wr*.95,-.12));
  /* brand decal on the side panels */
  if(d.brand){

  }

    hand:V(.37,wr+.9,wb/2-.26),hup:V(.5,wr+1.5,.1),feet:()=>[V(-.17,pegY,-.12),V(.17,pegY,-.12)]}};

/* ---- the rider (shared by every vehicle) ---- */
function addRider(model,sp,M,d){
  function limb(r,m){const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,8),m);mesh.castShadow=true;model.add(mesh);return mesh}
  const legs=[[limb(.055,M.jer),limb(.045,M.skin)],[limb(.055,M.jer),limb(.045,M.skin)]];
  const arms=[[limb(.04,M.jer),limb(.035,M.skin)],[limb(.04,M.jer),limb(.035,M.skin)]];
  const torso=limb(.11,M.jer);place(torso,sp.t0,sp.t1);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.1,12,10),M.skin);head.position.copy(sp.head);model.add(head);
  const hel=new THREE.Mesh(new THREE.SphereGeometry(.125,12,8,0,TAU,0,Math.PI*.58),mat(d.frame,.3,.4));hel.position.set(sp.head.x,sp.head.y+.02,sp.head.z-.01);hel.castShadow=true;model.add(hel);
  return function updateRider(cr,noh){
    const feet=sp.feet(cr);
    [-1,1].forEach((sd,i)=>{
      const hip=V(sd*.1,sp.hip.y,sp.hip.z),foot=feet[i],knee=hip.clone().add(foot).multiplyScalar(.5);knee.z+=.13;knee.x+=sd*.04;
      place(legs[i][0],hip,knee);place(legs[i][1],knee,foot);
      const sh=V(sd*.17,sp.sh.y,sp.sh.z),h0=V(sd*sp.hand.x,sp.hand.y,sp.hand.z),h1=V(sd*sp.hup.x,sp.hup.y,sp.hup.z),hand=h0.clone().lerp(h1,noh);
      const el=sh.clone().add(hand).multiplyScalar(.5);el.y-=.06;el.x+=sd*.08;
      place(arms[i][0],sh,el);place(arms[i][1],el,hand);
    });
  };
}
function buildBike(d){
  const kind=d.kind||'bike';
  const root=new THREE.Group(),roll=new THREE.Group(),flip=new THREE.Group(),model=new THREE.Group();
  root.add(roll);roll.add(flip);flip.add(model);
  const M={frame:mat(d.frame,.5,.35),fork:mat(d.fork,.8,.3),seat:mat(d.seat,.1,.8),tire:mat('#141414',0,.95),rim:mat(d.rim,.8,.25),dark:mat('#2c2f38',.6,.4),
    jer:mat(d.jersey||'#222a3a',0,.8),skin:mat('#e0b48c',0,.9),yellow:mat('#ffc400',.6,.3)};
  const P=kind==='moto'?partsMoto(d,model,M):kind==='scooter'?partsScooter(d,model,M):partsPedal(d,model,M);
  const updateRider=addRider(model,P.rider,M,d);
  updateRider(0,0);
  return{root,roll,flip,model,steer:P.steer,fw:P.fw,rw:P.rw,crank:P.crank,wr:d.wr,wb:d.wb,updateRider};
}

/* ================= world building ================= */
function newWorld(mode,sky){
  const W={mode,sky,group:new THREE.Group(),ramps:[],circles:[],rects:[],coins:[],flats:[],size:470,terrain:()=>0,spawn:{x:0,z:0,yaw:0}};
  W.groundY=function(x,z){let g=W.terrain(x,z);
    for(const r of W.ramps){const dx=x-r.x,dz=z-r.z;if(dx*dx+dz*dz>r.rad2)continue;
      const u=dx*r.s+dz*r.c;if(u<0||u>r.len)continue;
      const v=dx*r.c-dz*r.s;if(Math.abs(v)>r.wid/2)continue;
      const hy=r.base+r.h*Math.pow(u/r.len,1.7);if(hy>g)g=hy}
    return g};
  return W;
}
function addRamp(W,x,z,theta,size,base,col){
  const len=size.len,wid=size.wid,h=size.h;
  const sh=new THREE.Shape();sh.moveTo(0,-3);sh.lineTo(len,-3);sh.lineTo(len,h);
  for(let i=10;i>=0;i--){const t=i/10;sh.lineTo(t*len,h*Math.pow(t,1.7))}
  sh.lineTo(0,-3);
  const geo=new THREE.ExtrudeGeometry(sh,{depth:wid,bevelEnabled:false});
  geo.rotateY(-Math.PI/2);geo.translate(wid/2,0,0);
  const m=new THREE.Mesh(geo,mat(col,0,.85));m.position.set(x,base,z);m.rotation.y=theta;m.castShadow=true;m.receiveShadow=true;
  const lip=new THREE.Mesh(new THREE.BoxGeometry(wid,.12,.4),mat('#ffd23f',0,.6));lip.position.set(0,h+.02,len-.2);lip.rotation.x=-Math.atan(1.7*h/len*.9);m.add(lip);
  W.group.add(m);
  W.ramps.push({x,z,len,wid,h,base,s:Math.sin(theta),c:Math.cos(theta),rad2:(len+wid)*(len+wid)});
  /* coin arc beyond the lip */
  const fx=Math.sin(theta),fz=Math.cos(theta),lx=x+fx*len,lz=z+fz*len,k=h/3.2;
  [[5,h+1.6*k+1],[9.5,h+3.4*k+1],[14,h+2.2*k+1]].forEach(a=>addCoin(W,lx+fx*a[0]*(.6+.4*k),base+a[1],lz+fz*a[0]*(.6+.4*k)));

function buildTrail(race){
  const W=newWorld(race?'race':'trail','#b9defa');const r=rng(race?9:5),R=(a,b)=>a+(b-a)*r();
  const raw=(x,z)=>{const h=6*Math.sin(x*.011+1.3)*Math.cos(z*.013)+4*Math.sin((x+z)*.021)+2.2*Math.sin(x*.043)*Math.sin(z*.037)+3*Math.cos(x*.019-z*.007);return h*smooth(12,70,Math.hypot(x,z))};

  for(let i=0;i<N;i++){const t=i/N*TAU;path.push(race?{x:330*Math.sin(t)+70*Math.sin(3*t),z:260*Math.sin(2*t)+55*Math.cos(3*t)-55}:{x:300*Math.sin(t)+40*Math.sin(3*t),z:180*Math.sin(2*t)+30*Math.sin(3*t)})}
  const tan=i=>{const a=path[(i+1)%N],b=path[(i+N-1)%N];return Math.atan2(a.x-b.x,a.z-b.z)};

  W.terrain=(x,z)=>{let h=raw(x,z);for(const f of W.flats){const dx=x-f.x,dz=z-f.z,d2=dx*dx+dz*dz;if(d2<f.r2){const m=smooth(0,1,(1-Math.sqrt(d2)/f.r)*1.7);h=lerp(h,f.base,m)}}return h};

    const yaw=tan(i),sz=SIZES(r),cx=path[i].x+Math.sin(yaw)*sz.len/2,cz=path[i].z+Math.cos(yaw)*sz.len/2,base=raw(cx,cz);

    const x=pos.getX(i),z=pos.getZ(i),h=W.terrain(x,z);pos.setY(i,h);

  /* trees & rocks */
  const trees=[];
  for(let n=0;n<700&&trees.length<280;n++){
    const x=R(-460,460),z=R(-460,460);
    if(Math.hypot(x-W.spawn.x,z-W.spawn.z)<25||pathDist(x,z)<9)continue;
    if(W.flats.some(f=>(x-f.x)*(x-f.x)+(z-f.z)*(z-f.z)<(f.r+4)*(f.r+4)))continue;
    trees.push({x,y:W.terrain(x,z),z,s:R(.8,1.5)});
  }
  addTrees(W,trees);
  const rocks=[];
  for(let n=0;n<400&&rocks.length<70;n++){const x=R(-460,460),z=R(-460,460);if(pathDist(x,z)<6||Math.hypot(x,z)<30)continue;
    if(W.flats.some(f=>(x-f.x)*(x-f.x)+(z-f.z)*(z-f.z)<f.r2))continue;rocks.push({x,y:W.terrain(x,z),z,s:R(.8,1.8)})}

      W.group.add(ring,beam);W.gates.push({x:p.x,z:p.z,y:gy+3.6,yaw,ring,beam,mt});W.gA.push(A[i]);
    }
    gateVisuals(W);
  }

/* ================= physics ================= */
function crash(reason){
  if(B.crashT>0)return;
  B.crashT=1.4;B.air=false;B.speed*=.3;B.combo=0;B.comboT=0;B.crashDir=Math.random()<.5?1:-1;B.w=0;B.wheelT=0;B.wheelDist=0;B.charge=0;
  B.y=world.groundY(B.x,B.z);pop(reason,'bad');B.shake=.5;
}
function bump(){if(B.speed>9)crash('Crashed!');else B.speed*=.4;B.shake=Math.max(B.shake,.25)}
function collide(){
  const W=world;
  for(const c of W.circles){const dx=B.x-c.x,dz=B.z-c.z,rr=c.r+.55;
    if(dx*dx+dz*dz<rr*rr&&B.y<(c.h||3)+W.groundY(c.x,c.z)){const d=Math.sqrt(dx*dx+dz*dz)||.01;B.x=c.x+dx/d*rr;B.z=c.z+dz/d*rr;bump();if(B.crashT>0)return}}
  for(const r of W.rects){
    if(B.x>r.x0-.55&&B.x<r.x1+.55&&B.z>r.z0-.55&&B.z<r.z1+.55&&B.y<r.h){
      const a=B.x-(r.x0-.55),b=(r.x1+.55)-B.x,c=B.z-(r.z0-.55),d=(r.z1+.55)-B.z,m=Math.min(a,b,c,d);
      if(m===a)B.x=r.x0-.55;else if(m===b)B.x=r.x1+.55;else if(m===c)B.z=r.z0-.55;else B.z=r.z1+.55;
      bump();if(B.crashT>0)return}}
  const s=W.size;if(Math.abs(B.x)>s){B.x=clamp(B.x,-s,s);B.speed*=.9}if(Math.abs(B.z)>s){B.z=clamp(B.z,-s,s);B.speed*=.9}
}
function addPoints(label,pts){
  B.combo=Math.min(5,B.combo+1);B.comboT=6;const mult=B.combo,tot=Math.round(pts*mult),fi=fameInfo();
  SAVE.money+=tot*.1*fi.mult;B.score+=tot;if(B.score>SAVE.best)SAVE.best=B.score;addFame(tot);
  pop(label+'  +'+tot.toLocaleString()+(mult>1?'  x'+mult:''),'good');
  saveSoon();
}
function landTricks(){
  const flips=Math.round(Math.abs(B.flip)/TAU),dirF=B.flip>0?'Back':'Front',spins=Math.round(Math.abs(B.spin)/TAU),parts=[];let pts=0;
  if(flips>0){pts+=[0,600,1700,3600,6000][Math.min(4,flips)]+(flips>4?(flips-4)*3000:0);parts.push((['','','Double ','Triple ','Quad '][flips]||flips+'x ')+dirF+'flip')}
  if(spins>0){pts+=[0,400,1000,1900,3000][Math.min(4,spins)];parts.push(spins*360+' Spin')}
  if(B.tabT>.3){pts+=Math.round(B.tabT*250);parts.push('Tabletop')}
  if(B.nohT>.3){pts+=Math.round(B.nohT*180);parts.push('No Hander')}
  if(B.airT>.9){pts+=Math.round((B.airT-.6)*120);if(!parts.length)parts.push('Big Air')}
  if(pts>0)addPoints(parts.join(' + '),pts);
}
function land(gy){
  const S=B.S,fe=Math.abs(wrapA(B.flip)),se=Math.abs(wrapA(B.spin)),tol=1.5,vl=-B.vy;
  B.y=gy;B.air=false;B.dust=Math.max(B.dust||0,clamp(vl/10,0,1.5));
  const ok=fe<tol&&se<tol+.25&&B.tab<.4&&B.noh<.45;
  if(!ok){crash(B.tab>=.4?'Landed sideways!':B.noh>=.45?'Hands off the bars!':'Bad landing!');B.flip=B.spin=0;B.tab=B.noh=0;return}
  landTricks();B.speed*=.98;B.shake=Math.min(.35,vl*.02);
  B.flip=B.spin=0;B.tab=B.noh=0;B.tabT=B.nohT=0;B.airT=0;B.pitch=0;
}
function sim(dt){
  const S=B.S,W=world;B.t+=dt;B.comboT-=dt;if(B.comboT<=0)B.combo=0;
  B.shake=Math.max(0,B.shake-dt*1.5);
  if(W.race&&(W.race.state==='lobby'||W.race.state==='count'||W.race.state==='wait')){B.speed=0;B.vy=0;B.air=false;B.y=W.groundY(B.x,B.z);B.w=0;B.crashT=0;return}
  if(B.crashT>0){
    B.crashT-=dt;B.speed=Math.max(0,B.speed-B.speed*3*dt);
    B.x+=Math.sin(B.yaw)*B.speed*dt;B.z+=Math.cos(B.yaw)*B.speed*dt;collide();B.y=W.groundY(B.x,B.z);
    if(B.crashT<=0){B.speed=0;B.w=0;B.flip=B.spin=0;B.tab=B.noh=0}return}
  const up=K.up,down=K.down,steer=(K.left?1:0)-(K.right?1:0);
  let fx=Math.sin(B.yaw),fz=Math.cos(B.yaw);
  if(!B.air){
    const boosting=K.boost&&S.motor&&B.batt>0&&up,top=S.top+(boosting?S.boost:0);
    if(boosting)B.batt=Math.max(0,B.batt-dt);else B.batt=Math.min(S.batt,B.batt+dt*.4);
    if(up){if(B.speed<top)B.speed=Math.min(top,B.speed+S.accel*(boosting?1.7:1)*dt);else B.speed=Math.max(top,B.speed-5*dt)}
    else B.speed=Math.max(0,B.speed-2.4*dt);
    if(down)B.speed=Math.max(0,B.speed-(14+4*S.grip)*dt);
    const gA=W.groundY(B.x+fx*1.3,B.z+fz*1.3),gB=W.groundY(B.x-fx*1.3,B.z-fz*1.3),slope=(gA-gB)/2.6;
    B.speed=clamp(B.speed-slope*9.8*.55*dt,0,top*1.6+4);
    B.pitch=lerp(B.pitch,Math.atan(slope),Math.min(1,10*dt));
    /* wheelie */
    if(K.wheelie&&B.speed>2.5){
      /* holding Q keeps lifting the front wheel; hold too long and you flip backwards */
      B.w+=(.95+(up?.25:0)-(down?1.4:0))*dt;B.w=Math.max(0,B.w);
    }else B.w=Math.max(0,B.w-1.1*dt);
    if(B.w>1.18){crash('Looped out!');return}
    if(B.w>.35){B.wheelT+=dt;B.wheelDist+=B.speed*dt}
    else if(B.wheelT>0){if(B.wheelT>.6)addPoints('Wheelie '+Math.round(B.wheelDist)+'m',Math.round(B.wheelDist*14));B.wheelT=0;B.wheelDist=0}
    /* hop (hold to charge, release to jump) */
    if(K.jump)B.charge=Math.min(.6,B.charge+dt);
    else if(B.charge>0){B.vy=(4.5+5.5*B.charge/.6)*S.hop;B.air=true;B.flip=B.pitch+B.w;B.spin=0;B.airT=0;B.tabT=B.nohT=0;B.charge=0;B.gvy=0;B.w=0;return}
    /* steering & move */
    B.yaw+=steer*2.4*S.turn/(1+B.speed*.075)*Math.min(1,B.speed/2.5)*dt;
    fx=Math.sin(B.yaw);fz=Math.cos(B.yaw);
    const px=B.x,pz=B.z,py=B.y;
    B.x+=fx*B.speed*dt;B.z+=fz*B.speed*dt;collide();if(B.crashT>0)return;
    let gy=W.groundY(B.x,B.z);
    /* only a real wall counts: a ramp climbs at most ~1m per metre travelled, a wall face is vertical */
    if(gy>py+.75&&gy-py>Math.max(.06,B.speed*dt)*1.25){B.x=px;B.z=pz;if(B.speed>8){crash('Hit a wall!');return}B.speed*=.2;gy=W.groundY(B.x,B.z)}
    if(py-gy>.22){
      B.air=true;B.vy=B.gvy;B.flip=B.pitch+B.w;B.spin=0;B.airT=0;B.tabT=B.nohT=0;B.y=py;
      if(B.w>.3&&B.wheelT>.6)addPoints('Wheelie '+Math.round(B.wheelDist)+'m',Math.round(B.wheelDist*14));
      B.wheelT=0;B.wheelDist=0;B.w=0;
    }else{B.y=gy;B.gvy=lerp(B.gvy,(gy-py)/dt,.5)}
    B.steer=steer;
  }else{
    B.airT+=dt;const fr=S.spin*6.2,fi=(K.up?1:0)-(K.down?1:0),si=(K.left?1:0)-(K.right?1:0);
    B.flip+=fi*fr*dt;B.spin+=si*fr*dt*.9;
    if(!fi)B.flip+=(Math.round(B.flip/TAU)*TAU-B.flip)*Math.min(1,1.6*dt);
    if(!si)B.spin+=(Math.round(B.spin/TAU)*TAU-B.spin)*Math.min(1,1.6*dt);
    B.tab=lerp(B.tab,K.tab?1:0,Math.min(1,7*dt));B.noh=lerp(B.noh,K.noh?1:0,Math.min(1,7*dt));
    if(K.tab&&B.tab>.6)B.tabT+=dt;if(K.noh&&B.noh>.6)B.nohT+=dt;
    B.vy-=14*dt;B.y+=B.vy*dt;B.x+=fx*B.speed*dt;B.z+=fz*B.speed*dt;collide();if(B.crashT>0)return;
    const gy=W.groundY(B.x,B.z);
    if(B.y<=gy){if(gy-B.y>1.1){crash('Smashed into a ramp!');return}land(gy)}

  }
  /* coins */
  for(const c of W.coins){if(!c.on)continue;const dx=B.x-c.x,dz=B.z-c.z,dy=B.y+.8-c.y;
    if(dx*dx+dz*dz+dy*dy<5){c.on=false;c.m.visible=false;B.coins++;SAVE.money+=30;saveSoon();if(B.coins%10===0)pop('🪙 '+B.coins+' coins','gold')}}
}

function camSnap(){const d=7;cam.position.set(B.x-Math.sin(B.yaw)*d,B.y+3.2,B.z-Math.cos(B.yaw)*d);cam.lookAt(B.x,B.y+1.3,B.z)}
function poseRig(rig,B,dt){
  rig.root.position.set(B.x,B.y,B.z);rig.root.rotation.y=B.yaw;
  const pivY=B.air?.65:0,pivZ=B.air?0:-rig.wb/2;
  const bob=(!B.air&&!(B.crashT>0))?Math.sin(B.ws*1.7)*.012*clamp(B.speed/12,0,1.5):0;
  rig.flip.position.set(0,pivY,pivZ);rig.model.position.set(0,-pivY+bob,-pivZ);
  B.lean=lerp(B.lean,B.steer*clamp(B.speed/12,0,1)*.4,Math.min(1,8*dt));
  if(B.crashT>0){
    rig.flip.rotation.x=0;rig.roll.rotation.y=0;rig.roll.rotation.z=B.crashDir*clamp((1.4-B.crashT)*4,0,1.45);
  }else if(B.air){
    rig.flip.rotation.x=-B.flip;rig.roll.rotation.y=B.spin;rig.roll.rotation.z=B.tab*1.25;
  }else{
    rig.flip.rotation.x=-(B.pitch+B.w)+(B.charge>0?.0:0);rig.roll.rotation.y=0;rig.roll.rotation.z=-B.lean;
  }
  B.ws+=B.speed/rig.wr*dt;rig.rw.rotation.x=B.ws;rig.fw.rotation.x=B.ws;

let wx=WEATHER.clear;
function makeSky(w){
  w=w||WEATHER.clear;
  const R=700,geo=new THREE.SphereGeometry(R,24,14),pos=geo.attributes.position,cols=new Float32Array(pos.count*3);
  const top=new THREE.Color(w.top),mid=new THREE.Color(w.mid),hor=new THREE.Color(w.hor),c=new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const y=clamp(pos.getY(i)/R,-.2,1);
    if(y<.25)c.copy(hor).lerp(mid,clamp(y/.25,0,1));else c.copy(mid).lerp(top,clamp((y-.25)/.75,0,1));
    cols[i*3]=c.r;cols[i*3+1]=c.g;cols[i*3+2]=c.b;
  }
  geo.setAttribute('color',new THREE.BufferAttribute(cols,3));
  const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false}));
  m.frustumCulled=false;m.renderOrder=-10;
  if(w.disc){
    const sd=new THREE.Mesh(new THREE.SphereGeometry(w.stars?18:26,12,8),new THREE.MeshBasicMaterial({color:w.disc,fog:false}));
    sd.position.set(w.sunDir[0],w.sunDir[1],w.sunDir[2]).normalize().multiplyScalar(620);m.add(sd);
  }
  if(w.stars){
    const n=380,sp=new Float32Array(n*3);
    for(let i=0;i<n;i++){const u=Math.random()*TAU,v=.12+Math.random()*.88,r=Math.sqrt(1-v*v)*640;sp[i*3]=Math.cos(u)*r;sp[i*3+1]=v*640;sp[i*3+2]=Math.sin(u)*r}
    const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
    const st=new THREE.Points(sg,new THREE.PointsMaterial({color:'#ffffff',size:2.2,sizeAttenuation:false,fog:false,depthWrite:false}));st.frustumCulled=false;m.add(st);
  }
  return m;
}

const dust={list:[],i:0,acc:0,geo:null};
function dustClear(){dust.list.forEach(p=>{scene.remove(p.m);p.m.material.dispose()});dust.list=[];if(dust.geo){dust.geo.dispose();dust.geo=null}}
function dustInit(){

function dustEmit(x,y,z,vx,vy,vz,life,s,col){
  if(!dust.list.length)return;
  const p=dust.list[dust.i++%dust.list.length];
  p.m.position.set(x,y,z);p.vx=vx;p.vy=vy;p.vz=vz;p.life=p.max=life;p.s=s;p.m.material.color.set(col);p.m.visible=true;
}
function dustTick(dt){
  if(!B||!dust.list.length)return;
  const trail=world.mode==='trail'||world.mode==='race',col=trail?'#a88c66':'#c9c9c9',fx=Math.sin(B.yaw),fz=Math.cos(B.yaw),h=B.rig.wb/2;
  if(B.crashT<=0&&!B.air){
    const skid=K.down&&B.speed>8,kick=trail&&B.speed>5,burn=B.w>.3&&B.speed>4;
    if(skid||kick||burn){
      dust.acc+=dt*(skid?60:burn?30:clamp(B.speed*1.5,0,30));
      while(dust.acc>=1){dust.acc--;dustEmit(B.x-fx*h+(Math.random()-.5)*.3,B.y+.1,B.z-fz*h+(Math.random()-.5)*.3,(Math.random()-.5)*1.2-fx,Math.random()*1.2+.4,(Math.random()-.5)*1.2-fz,.7+Math.random()*.4,.6,col)}
    }
  }
  if(B.dust>0){
    for(let k=0;k<Math.round(B.dust*10);k++){const a=Math.random()*TAU,s=2+Math.random()*3*B.dust;dustEmit(B.x,B.y+.1,B.z,Math.cos(a)*s,Math.random()*2.2,Math.sin(a)*s,.8,.9,col)}
    B.dust=0;
  }
  for(const p of dust.list){
    if(p.life<=0){if(p.m.visible)p.m.visible=false;continue}
    p.life-=dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;p.vy-=.5*dt;
    const k=1-p.life/p.max;p.m.scale.setScalar(p.s*(.6+k*2));p.m.material.opacity=Math.max(0,1-k)*.45;
  }
}
let engA=null,muted=false;
function engStart(){
  try{
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    engStop();
    const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
    o.type='sawtooth';g.gain.value=0;f.type='lowpass';f.frequency.value=900;
    o.connect(f);f.connect(g);g.connect(AC.destination);o.start();
    const len=AC.sampleRate,buf=AC.createBuffer(1,len,AC.sampleRate),da=buf.getChannelData(0);
    for(let i=0;i<len;i++)da[i]=Math.random()*2-1;

    const nf=AC.createBiquadFilter(),ng=AC.createGain();nf.type='lowpass';nf.frequency.value=500;ng.gain.value=0;
    n.connect(nf);nf.connect(ng);ng.connect(AC.destination);n.start();
    engA={o,g,n,nf,ng};
  }catch(e){engA=null}
}

function engTick(){

function buildCop(){

  const blue=new THREE.MeshStandardMaterial({color:'#2050ff',emissive:'#0040ff',emissiveIntensity:1});
  add(new THREE.BoxGeometry(.7,.16,.32),red,-.4,1.68,-.2);

function copHeading(c){return c.axis==='x'?(c.dir>0?Math.PI/2:-Math.PI/2):(c.dir>0?0:Math.PI)}
function copPos(c){if(c.axis==='x'){c.x=c.u;c.z=c.line+c.off}else{c.z=c.u;c.x=c.line+c.off}}
function spawnCop(){
  for(let k=0;k<14;k++){
    const ax=Math.random()<.5,pa=ax?B.x:B.z,pl=ax?B.z:B.x;
    const li=clamp(Math.round(pl/100)+(Math.random()<.5?0:(Math.random()<.5?-1:1)),-4,4),line=li*100;
    const u=clamp(pa+(Math.random()<.5?-1:1)*(60+Math.random()*90),-470,470);
    const x=ax?u:line,z=ax?line:u,d=Math.hypot(x-B.x,z-B.z);
    if(d<65||d>170)continue;
    if(cops.some(c=>Math.hypot(c.x-x,c.z-z)<25))continue;
    const cc=buildCop();scene.add(cc.g);
    const c={g:cc.g,red:cc.red,blue:cc.blue,axis:ax?'x':'z',line,u,off:0,dir:(pa-u)>=0?1:-1,spd:10,x,z,y:world.groundY(x,z),yaw:0,d,skip:null};
    c.yaw=copHeading(c);cops.push(c);return;
  }
}
function segDist(ax,az,bx,bz,px,pz){
  const dx=bx-ax,dz=bz-az,l2=dx*dx+dz*dz;
  let t=l2?((px-ax)*dx+(pz-az)*dz)/l2:0;t=clamp(t,0,1);
  return Math.hypot(px-(ax+dx*t),pz-(az+dz*t));
}
/* at an intersection: pick the road that passes closest to the rider */
function copTurn(c,m){
  copPos(c);
  const ax=c.axis==='x',I=m*100,sx=ax?I:c.line,sz=ax?c.line:I,si=Math.round(sx/100),sj=Math.round(sz/100);
  const back=ax?[-c.dir,0]:[0,-c.dir];
  let best=null,bs=1e18;
  for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){
    if(d[0]===back[0]&&d[1]===back[1])continue;
    const ei=si+d[0],ej=sj+d[1];
    const okEdge=d[0]!==0?(Math.abs(sj)<=4&&Math.abs(ei)<=5):(Math.abs(si)<=4&&Math.abs(ej)<=5);
    if(!okEdge)continue;
    const ex=ei*100,ez=ej*100;
    const sc=(segDist(sx,sz,ex,ez,B.x,B.z)+.25*Math.hypot(ex-B.x,ez-B.z))*(1+Math.random()*.2);
    if(sc<bs){bs=sc;best=d}
  }
  if(!best){c.dir=-c.dir;return}
  const nax=best[0]!==0,ndir=nax?best[0]:best[1];
  if(nax===ax){c.dir=ndir;return}
  if(nax){c.line=sz;c.off=clamp(c.z-sz,-6,6);c.u=c.x;c.skip=sx}
  else{c.line=sx;c.off=clamp(c.x-sx,-6,6);c.u=c.z;c.skip=sz}
  c.axis=nax?'x':'z';c.dir=ndir;
}
function updateCop(c,dt,tgt){
  const ax=c.axis==='x',pA=ax?B.x:B.z,pL=ax?B.z:B.x;
  const far=Math.hypot(c.x-B.x,c.z-B.z);
  const want=tgt*(far>90?1.18:1)*(far>200?1.15:1);
  c.spd+=(want-c.spd)*Math.min(1,1.6*dt);
  const dLat=pL-c.line,near=Math.abs(pA-c.u)<45&&Math.abs(dLat)<16;
  c.off+=clamp((near?clamp(dLat,-6,6):0)-c.off,-7*dt,7*dt);
  const pu=c.u;c.u+=c.dir*c.spd*dt;
  if(c.skip!==null&&Math.abs(c.u-c.skip)>12)c.skip=null;
  const fp=Math.floor(pu/100),fn=Math.floor(c.u/100);
  if(fp!==fn){const m=c.dir>0?fn:fp;if(c.skip!==null&&m*100===c.skip)c.skip=null;else copTurn(c,m)}
  copPos(c);
  c.y+=(world.groundY(c.x,c.z)-c.y)*Math.min(1,12*dt);
}
function policeClear(){

function policeTick(dt){
  const W=wanted;
  if(W.bustedT>0){
    W.bustedT-=dt;
    if(W.bustedT<=0){$('hBusted').style.display='none';policeClear();respawn()}
    return;
  }
  if(W.grace>0)W.grace-=dt;
  const kph=B.speed*3.6;
  if(!W.on){
    if(W.grace<=0&&kph>=POLICE_KPH){W.fast+=dt;if(W.fast>=.8)policeStart()}else W.fast=Math.max(0,W.fast-dt);
    return;
  }
  W.t+=dt;
  const heat=Math.min(5,1+Math.floor(W.t/25));
  if(heat>W.heat){W.heat=heat;pop('🚨 More police!','bad')}
  W.spawnT-=dt;
  if(cops.length<Math.min(6,1+W.heat)&&W.spawnT<=0){W.spawnT=3;spawnCop()}
  const tgt=Math.max(14+W.heat*1.6,Math.min(B.S.top*.72,14+W.heat*7)),ph=Math.floor(performance.now()/130)%2;
  let dn=1e9,touching=false,onFoot=false;

    c.g.position.set(c.x,c.y,c.z);c.g.rotation.y=c.yaw;

    c.d=Math.hypot(c.x-B.x,c.z-B.z);if(c.d<dn)dn=c.d;

}

function cleanDesc(d){

function presenceList(ch){

  r.pitch=clamp(n(p.p),-1.5,1.5);r.steer=clamp(n(p.st),-1,1);r.tab=clamp(n(p.tb),0,1);r.noh=clamp(n(p.nh),0,1);

function netCloseCh(){

/* resolves 'ok' | 'full' | 'error' */
function netConnect(name,cap){
  return new Promise(res=>{
    const ch=NET.sb.channel(name,{config:{broadcast:{self:false},presence:{key:NET.id}}});
    NET.ch=ch;
    let done=false,to=null;
    const fin=v=>{if(!done){done=true;clearTimeout(to);res(v)}};
    to=setTimeout(()=>fin('error'),9000);
    ch.on('broadcast',{event:'s'},p=>onState(p&&p.payload));
    ch.on('broadcast',{event:'r'},p=>onRace(p&&p.payload));
    ch.on('presence',{event:'sync'},()=>{
      if(NET.ch!==ch)return;
      if(!done){
        const rank=presenceList(ch).findIndex(m=>m.id===NET.id);
        if(rank<0)return;
        if(cap&&rank>=cap){fin('full');return}
        fin('ok');
      }
      netSync(ch);
    });
    ch.subscribe(async st=>{
      if(st==='SUBSCRIBED'){
        try{await ch.track(myMeta())}catch(e){}
        if(done&&NET.ch===ch){NET.status='on';updateNetHud()}
      }else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){
        if(!done)fin('error');
        else if(NET.ch===ch){NET.status='lost';updateNetHud()}
      }
    });
  });
}
async function goOnline(kind,mode,code,create){
  if(NET.busy)return;
  if(!netReady()){netMsg=netWhyNot();renderMenu();return}
  if(kind==='priv'&&create&&!code)code=(mode==='street'?'S':mode==='suburbs'?'U':mode==='race'?'R':'T')+Array.from(crypto.getRandomValues(new Uint8Array(5)),b=>CODE_ALPHA[b%32]).join('');
  NET.busy=true;netMsg='Connecting…';renderMenu();
  netLeave();
  let ok='error',room='';
  try{
    await NET.closing;
    NET.sb=NET.sb||window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:10}}});
    if(kind==='pub'){
      for(let n=1;n<=10;n++){
        room='pub-'+mode+'-'+n;ok=await netConnect(room,MAX_PLAYERS);
        if(ok==='ok'){
          await sleep(300);
          const rank=NET.ch?presenceList(NET.ch).findIndex(m=>m.id===NET.id):0;
          if(rank>=MAX_PLAYERS)ok='full';else break;
        }
        await netCloseCh();
        if(ok==='error')break;
      }
    }else{
      room='priv-'+code;ok=await netConnect(room,MAX_PLAYERS);
      if(ok==='ok'&&!create){for(let i=0;i<8&&NET.count<2;i++)await sleep(200);if(NET.count<2)ok='none'}
    }
  }catch(e){ok='error'}
  NET.busy=false;
  if(ok!=='ok'){
    netLeave();
    netMsg=ok==='full'?'That server is full.':ok==='none'?'No server found with that code.':'Could not connect. Check the Supabase URL and anon key.';
    renderMenu();return;
  }
  NET.room=room;NET.kind=kind;NET.mode=mode;NET.code=kind==='priv'?code:'';NET.status='on';
  lastOnline={kind,mode,code:NET.code,create:!!create};
  netMsg='';startRide(mode,true);updateNetHud();
}

function netTick(dt){
  if(!NET.ch||NET.status!=='on')return;
  NET.sendT-=dt*1000;if(NET.sendT>0)return;
  const r=v=>Math.round(v*100)/100;
  const pl={id:NET.id,x:r(B.x),y:r(B.y),z:r(B.z),yaw:r(B.yaw),sp:r(B.speed),a:B.air?1:0,f:r(B.flip),s:r(B.spin),w:r(B.w),p:r(B.pitch),st:r(B.steer),tb:r(B.tab),nh:r(B.noh),c:B.crashT>0?1:0,rp:r(B.rp||0),fn:(world.race&&world.race.finished)?1:0};
  const sig=pl.x+','+pl.z+','+pl.yaw+','+pl.a+','+pl.c;
  NET.sendT=(sig===NET.lastSent&&!B.air)?1000:SEND_MS;   // idle riders send once a second
  NET.lastSent=sig;
  const pr=NET.ch.send({type:'broadcast',event:'s',payload:pl});
  if(pr&&pr.catch)pr.catch(()=>{});
}
const _tv=new THREE.Vector3();
function remotesView(dt){
  cam.updateMatrixWorld();
  const now=performance.now();
  NET.remotes.forEach(r=>{
    const live=r.got&&now-r.at<8000;
    r.rig.root.visible=live;
    if(!live){r.tag.style.display='none';return}
    const age=Math.min(.3,(now-r.at)/1000);
    const ex=r.tx+(r.c?0:Math.sin(r.tyaw)*r.speed*age),ez=r.tz+(r.c?0:Math.cos(r.tyaw)*r.speed*age),k=Math.min(1,10*dt);
    if(Math.hypot(ex-r.x,ez-r.z)>25){r.x=ex;r.z=ez;r.y=r.ty}else{r.x+=(ex-r.x)*k;r.z+=(ez-r.z)*k;r.y+=(r.ty-r.y)*k}
    r.yaw+=wrapA(r.tyaw-r.yaw)*k;
    poseRig(r.rig,r,dt);
    _tv.set(r.x,r.y+2.4,r.z).project(cam);
    const dist=Math.hypot(r.x-B.x,r.z-B.z);
    if(_tv.z<1&&dist<160&&Math.abs(_tv.x)<1.1&&Math.abs(_tv.y)<1.1){
      r.tag.style.display='block';r.tag.style.left=((_tv.x*.5+.5)*innerWidth)+'px';r.tag.style.top=((-_tv.y*.5+.5)*innerHeight)+'px';
    }else r.tag.style.display='none';
  });
}

async function lbLoad(){
  const sb=getSb();if(!sb||LB.busy)return;
  LB.busy=true;LB.msg='Loading…';if(tab==='race'&&state==='menu')renderMenu();

    const res=await sb.from('race_times').select('player_id,name,bike,time_ms').order('time_ms',{ascending:true}).limit(200);

    const seen=new Set(),rows=[];
    for(const r of res.data||[]){
      if(!r||typeof r.player_id!=='string'||seen.has(r.player_id))continue;seen.add(r.player_id);

function gridPos(slot){

  return{x:sp.x-fx*row*3.8+rx*col,z:sp.z-fz*row*3.8+rz*col};
}
function placeOnGrid(slot){
  const g=gridPos(slot);B.x=g.x;B.z=g.z;B.yaw=world.spawn.yaw;B.speed=0;B.vy=0;B.air=false;B.crashT=0;B.w=0;B.flip=B.spin=0;B.y=world.groundY(B.x,B.z);camSnap();

function raceStartOnline(ids,ms,seq){

function netRaceSend(payload){
  if(!NET.ch)return;
  const pr=NET.ch.send({type:'broadcast',event:'r',payload:Object.assign({id:NET.id},payload)});if(pr&&pr.catch)pr.catch(()=>{});

function onRace(p){
  const R=world&&world.race;if(!p||typeof p!=='object'||!R||R.kind!=='online'||typeof p.id!=='string')return;
  if(p.k==='go'){
    const lead=NET.ch&&presenceList(NET.ch)[0];if(!lead||lead.id!==p.id)return;
    if(R.state==='go'||R.state==='count')return;
    const ids=Array.isArray(p.ids)?p.ids.filter(x=>typeof x==='string'&&x.length<20).slice(0,MAX_PLAYERS):[];if(!ids.length)return;
    raceStartOnline(ids,clamp(+p.in||5000,2000,9000),typeof p.n==='string'?p.n.slice(0,8):null);
  }else if(p.k==='rs'){
    if(R.state==='lobby'||(R.seq&&p.n===R.seq))raceResetOnline();

function fmtTime(ms){const m=Math.floor(ms/60000),sec=(ms%60000)/1000;return m+':'+sec.toFixed(2).padStart(5,'0')}
function raceFinish(R){
  R.timeMs=Math.max(0,performance.now()-R.startedAt);lbSubmit(R.timeMs);
  R.finished=true;R.fin.push(R.me);R.place=R.fin.length;R.state='done';R.msgT=8;
  const rm=fameInfo().mult,prize=Math.round((R.kind==='cpu'?Math.round((CPU_PRIZE[R.place-1]||1000)*CPU_MULT[R.lvl]):(ONLINE_PRIZE[R.place-1]||ONLINE_MIN))*rm);
  R.prize=prize;SAVE.money+=prize;addFame(Math.max(800,4000-(R.place-1)*900));B.score+=prize/10;if(B.score>SAVE.best)SAVE.best=B.score;save();
  pop('🏁 '+(ORD[R.place]||R.place+'th')+' place!  +'+fmt(prize)+'  ·  '+fmtTime(R.timeMs),'gold');

function raceProg(W,R){
  const G=W.gates.length,L=W.L,A=W.gA;
  if(R.finished)return(R.laps-1)*L+A[G-1];
  const lapsDone=Math.floor(R.passed/G),gi=R.passed%G,g=W.gates[gi],Ap=gi>0?A[gi-1]:(lapsDone>0?A[G-1]-L:0),An=A[gi],seg=Math.max(1,An-Ap);
  return lapsDone*L+Ap+seg*clamp(1-Math.hypot(B.x-g.x,B.z-g.z)/seg,0,.99);
}
function raceRanking(R){
  const arr=[{id:R.me,prog:B.rp||0}];
  if(R.kind==='cpu')R.cpus.forEach(c=>arr.push({id:c.id,prog:c.d}));
  else R.ids.forEach(id=>{if(id===NET.id)return;const r=NET.remotes.get(id);if(r)arr.push({id,prog:r.rp||0})});
  arr.sort((a,b)=>{const fa=R.fin.indexOf(a.id),fb=R.fin.indexOf(b.id);if(fa>=0&&fb>=0)return fa-fb;if(fa>=0)return-1;if(fb>=0)return 1;return b.prog-a.prog});
  return arr;
}
function cpuStep(c,R,W,dt,running){
  const L=W.L,G=W.gA.length,RT=(R.laps-1)*L+W.gA[G-1];
  if(running&&!c.fin){
    let tv=c.base*c.k;const gap=c.d-(B.rp||0);if(gap>60)tv*=.86;else if(gap<-45)tv*=1.1;
    c.v+=(tv-c.v)*Math.min(1,dt*.9);c.d+=c.v*dt;
    if(c.d>=RT){c.fin=true;R.fin.push(c.id)}
  }else if(c.fin){c.v*=Math.max(0,1-dt*.7);c.d+=c.v*dt}
  const dd=((c.d%L)+L)%L,A=W.arc;let i=c.si||0;if(A[i]>dd||A[i+1]<=dd)i=0;while(i<A.length-2&&A[i+1]<=dd)i++;c.si=i;
  const P=W.pathPts,a=P[i],b=P[(i+1)%P.length],t=(dd-A[i])/Math.max(.001,A[i+1]-A[i]);
  const yaw=Math.atan2(b.x-a.x,b.z-a.z),tx=a.x+(b.x-a.x)*t+Math.cos(yaw)*c.lane,tz=a.z+(b.z-a.z)*t-Math.sin(yaw)*c.lane,k=Math.min(1,8*dt);
  c.x+=(tx-c.x)*k;c.z+=(tz-c.z)*k;c.y=W.groundY(c.x,c.z);
  const da=wrapA(yaw-c.yaw);c.yaw+=da*k;c.steer=clamp(da*3,-1,1);c.speed=c.v;
}
function raceTick(dt){
  const W=world,R=W&&W.race;if(!R||!B||!W.gates)return;
  const now=performance.now(),hr=$('hRace'),G=W.gates.length;let msg='';
  const online=R.kind==='online',list=(online&&NET.ch)?presenceList(NET.ch):[],leader=list.length&&list[0].id===NET.id;
  const moving=online&&[...NET.remotes.values()].some(r=>r.got&&r.speed>3&&now-r.at<3000);
  if(online&&NET.ch){
    if(R.state==='lobby'){
      if(list.length>=2&&!moving)R.lobbyT+=dt;else R.lobbyT=0;
      if(leader&&R.lobbyT>=10){const ids=list.slice(0,MAX_PLAYERS).map(m=>m.id),n=Math.random().toString(36).slice(2,8);netRaceSend({k:'go',ids,in:5000,n});raceStartOnline(ids,5000,n)}
    }else if(R.state==='wait'){
      R.waitT=(R.waitT||0)+dt;if(!moving&&R.waitT>6)raceResetOnline();
    }else if(R.state==='go'||R.state==='done'){
      const alive=R.ids.filter(id=>id===NET.id||NET.remotes.has(id));
      if(R.fin.length&&!R.firstFin)R.firstFin=now;
      if((alive.length&&alive.every(id=>R.fin.includes(id)))||(R.firstFin&&now-R.firstFin>60000)||now-R.startedAt>240000){const n=R.seq;netRaceSend({k:'rs',n});raceResetOnline()}
    }
  }
  if(R.state==='count'){const rem=R.goAt-now;if(rem<=0){R.state='go';R.startedAt=now;R.goFlash=1.2}else msg=String(Math.ceil(rem/1000))}
  if(R.state==='go'||R.state==='done'){
    if(!R.finished){
      const g=W.gates[W.gi],dx=B.x-g.x,dz=B.z-g.z;
      if(dx*dx+dz*dz<42&&Math.abs(B.y+.8-g.y)<8){
        R.passed++;W.gi=R.passed%G;gateVisuals(W);
        if(R.passed>=R.laps*G)raceFinish(R);else if(W.gi===0)pop('🏁 Lap '+(Math.floor(R.passed/G)+1)+' of '+R.laps,'gold');
      }
    }
    B.rp=raceProg(W,R);
    if(R.goFlash>0){R.goFlash-=dt;if(!R.finished)msg='GO!'}
    const rk=raceRanking(R),pos=rk.findIndex(e=>e.id===R.me)+1;
    R.hud=R.finished?'Finished '+(ORD[R.place]||R.place)+' · +'+fmt(R.prize):'Position '+pos+'/'+rk.length+' · Lap '+Math.min(R.laps,Math.floor(R.passed/G)+1)+'/'+R.laps+' · Gate '+(W.gi+1)+'/'+G;
  }else R.hud='';
  if(R.finished){
    if(R.msgT>0){R.msgT-=dt;msg=(ORD[R.place]||R.place+'th')+' place!  +'+fmt(R.prize)+'  ·  '+fmtTime(R.timeMs)}
    else msg=R.kind==='cpu'?'Tap here or press Enter to race again':'Waiting for the race to finish…';
  }
  if(R.state==='lobby'&&online){
    msg=moving?'Race in progress. You join the next one.':list.length<2?'Waiting for another rider…':(R.lobbyT>0?'Race starts in '+Math.max(1,Math.ceil(10-R.lobbyT))+'s':'Race starting soon…');
  }else if(R.state==='wait')msg='Race in progress. You join the next one.';
  hr.textContent=msg;hr.style.pointerEvents=(R.kind==='cpu'&&R.finished&&R.msgT<=0)?'auto':'none';
  if(R.kind==='cpu'){
    const running=R.state==='go'||R.state==='done';cam.updateMatrixWorld();
    R.cpus.forEach(c=>{
      cpuStep(c,R,W,dt,running);c.rig.root.visible=true;poseRig(c.rig,c,dt);
      _tv.set(c.x,c.y+2.4,c.z).project(cam);
      if(_tv.z<1&&Math.hypot(c.x-B.x,c.z-B.z)<160&&Math.abs(_tv.x)<1.1&&Math.abs(_tv.y)<1.1){c.tag.style.display='block';c.tag.style.left=((_tv.x*.5+.5)*innerWidth)+'px';c.tag.style.top=((-_tv.y*.5+.5)*innerHeight)+'px'}else c.tag.style.display='none';
    });
  }
}
$('hRace').addEventListener('click',()=>{const R=world&&world.race;if(R&&R.kind==='cpu'&&R.finished)startRide('race')});
addEventListener('keydown',e=>{if(e.code==='Enter'&&state==='ride'){const R=world&&world.race;if(R&&R.kind==='cpu'&&R.finished)startRide('race')}});

/* ================= loop ================= */
function resize(){
  const W=innerWidth,H=innerHeight;renderer.setSize(W,H,false);
  cam.aspect=W/H;cam.updateProjectionMatrix();prevCam.aspect=W/H;
  if(H>W)prevCam.setViewOffset(W,H,0,H*.29,W,H);else prevCam.setViewOffset(W,H,-Math.min(440,W)/2,0,W,H);
  prevCam.updateProjectionMatrix();
}
addEventListener('resize',resize);
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='menu'){
    if(prev){prev.root.rotation.y+=dt*.5;prev.rw.rotation.x+=dt*3;prev.fw.rotation.x+=dt*3;prev.crank.rotation.x+=dt*2;prev.updateRider(prev.crank.rotation.x,0)}
    renderer.render(prevScene,prevCam);
  }else if(B){
    const n=Math.max(1,Math.ceil(dt/.017));if(!(wanted.bustedT>0))for(let i=0;i<n;i++)sim(dt/n);
    if(world.mode==='street'||world.mode==='suburbs')policeTick(dt);
    raceTick(dt);
    view(dt);engTick();dustTick(dt);netTick(dt);renderer.render(scene,cam);
  }
}
setPreview(SAVE.bike);renderMenu();resize();requestAnimationFrame(frame);
</script>
