<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Marble Masters</title>
<style>
:root{--gold:#ffd24a;--bg:#0b1020;--card:#151c33;--card2:#1d2646;--txt:#eef2ff;--mut:#98a2c7;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;background:radial-gradient(ellipse at 50% 0%,#24306a 0%,#0b1020 62%);z-index:10;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#ui.hal{background:radial-gradient(ellipse at 50% 0%,#5a1d7a 0%,#12051c 65%)}
#modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(5,8,20,.78);padding:14px;overflow-y:auto;touch-action:pan-y}
#quit{position:fixed;left:10px;bottom:calc(10px + var(--sab));z-index:20;display:none;padding:12px 18px;border-radius:99px;background:#000a;border:1px solid #fff4;font-weight:800;font-size:15px;color:#fff}
#toast{position:fixed;left:50%;top:calc(14px + var(--sat));transform:translateX(-50%);z-index:50;background:#000d;border:1px solid #fff4;padding:10px 16px;border-radius:99px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + var(--sat)) 14px calc(40px + var(--sab))}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.coins{background:#0008;border:1px solid #fff2;padding:8px 14px;border-radius:99px;font-weight:800}
.logo{font-size:clamp(34px,11vw,48px);line-height:.95;text-align:center;margin:8px 0;font-weight:900;letter-spacing:2px;background:linear-gradient(#fff,#ffd24a);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{display:block;font-size:clamp(20px,6.5vw,28px);letter-spacing:10px}
.hero{display:flex;flex-direction:column;align-items:center;margin:4px 0 12px}
.hero canvas{width:min(34vw,140px);height:min(34vw,140px)}
.hero b{font-size:18px}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:disabled,.dis{opacity:.45;pointer-events:none}
.btns{display:grid;gap:10px}
.big{padding:16px 18px;min-height:58px;border-radius:16px;background:linear-gradient(180deg,#2b3a78,#1d2850);border:1px solid #fff2;font-size:19px;font-weight:800;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}
.big small{font-weight:600;color:var(--mut);font-size:12px;text-align:right}
.big:active,.sm:active,.mb button:active{transform:scale(.97)}
.halloween{background:linear-gradient(180deg,#ff8a1f,#8a2a05);animation:glow 2s infinite}
.halloween small{color:#ffe2b8}
@keyframes glow{50%{box-shadow:0 0 22px #ff7a1a}}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sm{padding:13px;min-height:50px;border-radius:14px;background:var(--card2);border:1px solid #fff2;font-weight:800;font-size:15px}
.sm.on{border-color:var(--gold);background:#3a3410}
.h2{font-size:24px;font-weight:900;margin:12px 0 6px}
.mut{color:var(--mut);font-size:13px}
.back{padding:11px 16px;border-radius:99px;background:#0006;border:1px solid #fff3;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{aspect-ratio:1;border-radius:14px;background:var(--card2);border:2px solid #fff2;font-weight:900;font-size:20px;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff}
.lv.done{border-color:var(--gold);background:#3a3410}
.lv.cur{border-color:#6cf;animation:glow2 1.4s infinite}
@keyframes glow2{50%{box-shadow:0 0 14px #6cf}}
.lv.lock{opacity:.4;pointer-events:none}
.lv.boss::after{content:'\2620';position:absolute;top:2px;right:5px;font-size:12px}
.lv small{font-size:10px;font-weight:700;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:420px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:2px solid var(--c,#fff3);border-radius:14px;padding:6px 2px 8px;text-align:center;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;color:#fff}
.tile canvas{width:70px;height:70px}
.rh{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 6px;font-weight:900;color:var(--c)}
.card{background:var(--card);border:1px solid #fff2;border-radius:18px;padding:14px;margin:10px 0}
.card.cur{border-color:#6cf}
.card.hal{background:linear-gradient(180deg,#3a1650,#1c0a2c);border-color:#ff7a1a66}
.cardrow{display:flex;gap:12px;align-items:center}
.cardrow>div{flex:1}
.mcard{background:linear-gradient(180deg,#1b2347,#0f1530);border:2px solid var(--c,#fff3);border-radius:22px;padding:18px;max-width:420px;width:100%;text-align:center;box-shadow:0 0 40px -10px var(--c,#000);max-height:92vh;overflow-y:auto}
.mcard h2{margin:6px 0}
.mcard canvas{max-width:100%}
.bar{height:8px;background:#fff2;border-radius:9px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--c,#6cf)}
.st{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px;font-weight:700}
.st span{width:56px;text-align:left}
.mb{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.mb button{flex:1;min-width:120px;padding:14px;border-radius:14px;background:#2b3a78;font-weight:800;border:1px solid #fff3;font-size:15px}
.mb button.pri{background:linear-gradient(#ffd24a,#e09b00);color:#2a1a00}
.gain{margin:10px 0;padding:8px;border-radius:16px;background:#0004;border:2px solid var(--c)}
.gain .gn{font-weight:900;font-size:18px}
.gain .gr{font-weight:900;letter-spacing:2px;font-size:12px}
.new{color:#7dff9a;font-weight:900}
.dup{color:var(--mut);font-size:13px}
.rt{font-size:46px}
.cn{font-size:22px;font-weight:900;color:var(--gold);margin:4px 0}
.orb{width:120px;height:120px;border-radius:50%;margin:20px auto;background:radial-gradient(circle at 35% 30%,#fff,var(--c) 45%,#111);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;animation:shake .35s infinite}
@keyframes shake{25%{transform:translateX(-6px) rotate(-6deg)}75%{transform:translateX(6px) rotate(6deg)}}
.pl{display:flex;justify-content:space-between;padding:6px 2px;font-size:14px;border-bottom:1px solid #fff1}
.pl .w{font-weight:900;color:#7dff9a}.pl .l{opacity:.45;text-decoration:line-through}
.odds{font-size:11px;color:var(--mut);margin-top:4px;line-height:1.5}
.pips{display:flex;gap:6px;justify-content:center;margin:8px 0}
.pip{width:14px;height:14px;border-radius:50%;background:#fff2;border:2px solid #fff4}
.pip.on{background:#ff7a1a;border-color:#ffd9a8}
.pip.done{background:#7dff9a;border-color:#fff}
.evr{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:14px;background:#0005;border:2px solid #ff7a1a55;text-align:left;margin:8px 0;color:#fff}
.evr b{font-size:16px}
.evr.cur{border-color:#ff7a1a;animation:glow 1.6s infinite}
.evr .n{width:34px;height:34px;border-radius:50%;background:#ff7a1a;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.evr.done .n{background:#7dff9a;color:#052}
</style>
</head>

<script>
'use strict';
(()=>{
const TAU=Math.PI*2;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function seeded(seed){let s=(seed>>>0)||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function strSeed(s){let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function hexA(h,a){const n=parseInt(h.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'}
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v)}
function angDiff(a,b){return ((b-a+3*Math.PI)%TAU+TAU)%TAU-Math.PI}

/* ---------------- rarities & marbles ---------------- */
const ORDER=['common','uncommon','rare','epic','legend','god','halloween','goat'];
const RAR={
 common:{n:'Common',col:'#c3cad6',pow:1,mass:1,glide:1,sell:10,rank:0},
 uncommon:{n:'Uncommon',col:'#5ee07a',pow:1.06,mass:1.05,glide:1.03,sell:25,rank:1},

 legend:{n:'Legend',col:'#ffb020',pow:1.28,mass:1.28,glide:1.17,sell:400,rank:4},
 god:{n:'God',col:'#ff4d6d',pow:1.36,mass:1.36,glide:1.22,sell:1000,rank:5},
 halloween:{n:'Halloween',col:'#ff7a1a',pow:1.46,mass:1.46,glide:1.28,sell:1500,rank:6},
 goat:{n:'GOAT',col:'#ffd700',pow:1.58,mass:1.56,glide:1.35,sell:2500,rank:7}
};
const LIST=[
 // id, name, rarity, c1, c2, pattern, fx, exclusive-how, packable

 ['lemon','Lemon Drop','common','#fff7a8','#e0a800','stripe',''],
 ['slate','Slate Roller','common','#c4cbd6','#3f4856','hex',''],
 ['bubblegum','Bubblegum','common','#ffc4ec','#ff4fb0','bubbles',''],
 ['cola','Fizzy Cola','common','#a0522d','#23100a','dots',''],
 ['snow','Snowflake','common','#ffffff','#8fb7e0','ice',''],
 ['pebble','River Pebble','common','#b4ab9c','#524a3f','camo',''],
 ['orange','Orange Fizz','common','#ffc36b','#e8590c','candy',''],
 ['berry','Blueberry','common','#9aa8ff','#2c3aa0','dots',''],
 ['jade','Jade Chip','common','#9af0bd','#1d6b4a','marbled',''],
 ['ocean','Ocean Stripe','uncommon','#7aeaff','#0b5fa8','tide',''],
 ['forest','Forest Camo','uncommon','#9ae07a','#1f5b2b','camo',''],
 ['sunset','Sunset Swirl','uncommon','#ffc07a','#d6336c','swirl',''],
 ['grape','Grape Twist','uncommon','#d0aaff','#5b2aa8','candy',''],
 ['tiger','Tiger Eye','uncommon','#f6cb62','#5a2f08','stripe',''],
 ['coral','Coral Reef','uncommon','#ffa797','#0a6e8a','bubbles',''],
 ['neon','Neon Pulse','uncommon','#7dffd0','#0a3a5a','circuit',''],
 ['copper','Copper Coil','uncommon','#ffb98a','#8a3a10','rings',''],
 ['lime','Lime Zest','uncommon','#dcff7a','#3a8a0a','hex',''],
 ['rose','Rose Quartz','uncommon','#ffd6e6','#d6608a','crystal',''],
 ['smoke','Smoke Signal','uncommon','#dde1ee','#3a3f55','plasma',''],
 ['ruby','Ruby Glass','rare','#ff6b86','#8a0f2e','crystal','sparks','Clear Level 5'],
 ['sapphire','Sapphire Veil','rare','#8fbcff','#12338f','swirl','sparks'],
 ['emerald','Emerald Prism','rare','#6dffb3','#0a7a47','crystal','sparks'],
 ['cobra','Cobra Scale','rare','#d7ff6b','#2d5a0a','scales',''],
 ['frost','Frostbite','rare','#eafcff','#6bb7e6','ice','sparks'],
 ['amber','Amber Fossil','rare','#ffd070','#a35a00','marbled',''],

 ['onyx','Onyx Flame','rare','#8a8aa0','#0a0a14','flame',''],
 ['pearl','Mermaid Pearl','rare','#fff2fa','#8ac0ff','holo','sparks'],
 ['storm','Thunderstorm','epic','#9fb0ff','#1a1f5e','storm','lightning','Clear Level 10'],
 ['magma','Magma Core','epic','#ffb347','#7a1010','lava','flames','Clear Level 15'],
 ['nebula','Nebula','epic','#c08bff','#1b0b4a','galaxy','sparks'],
 ['aurora','Aurora','epic','#7bffd9','#1c2a6b','plasma','sparks'],
 ['plasmacore','Plasma Core','epic','#ff6bd6','#3a0a6a','plasma','sparks'],
 ['matrix','Digital Rain','epic','#4dff7d','#02150a','matrix',''],
 ['venom','Venom Fang','epic','#b8ff4a','#1a3a00','scales','sparks'],
 ['glacier','Glacier Heart','epic','#c8f2ff','#0a4a8a','ice','ring'],
 ['sunstone','Sunstone','epic','#ffd36b','#b3380a','sun','sparks'],
 ['cyber','Cyber Rune','epic','#6bfff0','#1a0a5a','rune','ring'],
 ['dragon','Dragon Eye','legend','#ffd36b','#a1250c','eye','flames','Clear Level 20'],
 ['solar','Solar Flare','legend','#fff0a0','#ff6a00','sun','flames'],
 ['opal','Phantom Opal','legend','#f6eeff','#7a6bd6','opal','orbit'],
 ['king','Gilded King','legend','#fff2a8','#b8860b','gold','crown','Win the Gold Cup tournament'],
 ['phoenix','Phoenix Ember','legend','#ffe08a','#d92a0a','flame','flames'],
 ['tsunami','Tsunami Crest','legend','#9ffcff','#05306b','tide','ring'],
 ['galaxycore','Galaxy Core','legend','#ffb0ff','#120a3a','galaxy','orbit'],
 ['walker','Void Walker','legend','#b06bff','#050010','abyss','sparks'],
 ['zeus','Zeus Bolt','god','#fffbd0','#3a5bff','storm','lightning,halo','Clear Level 25'],
 ['poseidon','Poseidon Tide','god','#9ffcff','#0a3d91','tide','ring,halo'],
 ['hades','Hades Shade','god','#7dffb0','#2a0a4a','shadow','flames,halo'],
 ['odin',"Odin's Eye",'god','#fff2c0','#1a2a6a','eye','halo,wings'],
 ['ra','Sun God Ra','god','#fff3a0','#e06a00','sun','halo,wings'],
 ['anubis','Anubis Judgement','god','#6bffe0','#0a1a1a','rune','halo,orbit'],
 ['jack',"Jack-o'-Lantern",'halloween','#ffa43a','#d2540a','pumpkin','flames,bats','Win the Haunted Harvest event'],
 ['goat','The GOAT','goat','#fff6b0','#a67800','goat','crown,flames,orbit,sparks','Clear Level 30 — or a super rare Gold/Mythic pack pull',1]
].map(a=>({id:a[0],name:a[1],r:a[2],c1:a[3],c2:a[4],pat:a[5],fx:a[6]||'',ex:a[7]||'',pack:!!a[8]}));
const DEFS={};LIST.forEach(m=>DEFS[m.id]=m);
[['e_bone','Bone Roller','epic','#f4f0e0','#9a947f','hex',''],['e_witch','Witch Brew','legend','#9dff6b','#2b5a14','swirl','sparks'],['e_ghost','Poltergeist','legend','#f0f4ff','#8fa0d6','opal','orbit'],['e_vamp','Blood Moon','god','#ff5a6a','#4a0614','lava','flames'],['e_king','Pumpkin Crown','halloween','#ffb04a','#a8300a','pumpkin','flames,bats']].forEach(a=>{DEFS[a[0]]={id:a[0],name:a[1],r:a[2],c1:a[3],c2:a[4],pat:a[5],fx:a[6],ex:'',pack:false}});
const stats=d=>{const r=RAR[d.r];return{pow:r.pow,mass:r.mass,glide:r.glide}};

/* ---------------- marble drawing ---------------- */
function star(c,x,y,s){c.beginPath();c.moveTo(x,y-s*2);c.quadraticCurveTo(x,y,x+s*2,y);c.quadraticCurveTo(x,y,x,y+s*2);c.quadraticCurveTo(x,y,x-s*2,y);c.quadraticCurveTo(x,y,x,y-s*2);c.fill()}
function goatHead(c,s,col){c.save();c.fillStyle=col;c.strokeStyle=col;c.lineWidth=s*.14;c.lineCap='round';
 c.beginPath();c.moveTo(-s*.35,-s*.3);c.quadraticCurveTo(-s*.9,-s*.4,-s*.7,-s*1);c.stroke();
 c.beginPath();c.moveTo(s*.35,-s*.3);c.quadraticCurveTo(s*.9,-s*.4,s*.7,-s*1);c.stroke();
 c.beginPath();c.moveTo(-s*.4,-s*.35);c.lineTo(s*.4,-s*.35);c.lineTo(s*.2,s*.55);c.lineTo(-s*.2,s*.55);c.closePath();c.fill();
 c.beginPath();c.moveTo(-s*.1,s*.5);c.lineTo(0,s*.95);c.lineTo(s*.1,s*.5);c.fill();c.restore()}
function pumpkinFace(c,r,t){c.save();c.fillStyle='#3a7d1e';c.fillRect(-r*.08,-r*.98,r*.16,r*.22);c.fillStyle='#ffe066';c.shadowColor='#ffcc00';c.shadowBlur=r*(.4+.15*Math.sin(t*5));
 c.beginPath();c.moveTo(-r*.5,-r*.1);c.lineTo(-r*.15,-r*.1);c.lineTo(-r*.32,-r*.42);c.closePath();c.fill();
 c.beginPath();c.moveTo(r*.5,-r*.1);c.lineTo(r*.15,-r*.1);c.lineTo(r*.32,-r*.42);c.closePath();c.fill();
 c.beginPath();c.moveTo(-r*.5,r*.2);c.lineTo(-r*.3,r*.1);c.lineTo(-r*.15,r*.28);c.lineTo(0,r*.12);c.lineTo(r*.15,r*.28);c.lineTo(r*.3,r*.1);c.lineTo(r*.5,r*.2);c.lineTo(r*.3,r*.5);c.lineTo(0,r*.38);c.lineTo(-r*.3,r*.5);c.closePath();c.fill();c.restore()}
const PAT={
 solid(){},
 marbled(c,r,d){const R=seeded(strSeed(d.id||'m'));c.strokeStyle=hexA(d.c2,.7);c.lineWidth=r*.1;c.lineCap='round';for(let i=0;i<5;i++){c.beginPath();let x=-r,y=(R()-.5)*r*1.8;c.moveTo(x,y);for(let k=1;k<=4;k++){x+=r*.5;y+=(R()-.5)*r*1.1;c.quadraticCurveTo(x-r*.25,y+(R()-.5)*r*.6,x,y)}c.stroke()}c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=r*.04;for(let i=0;i<3;i++){c.beginPath();c.moveTo(-r,(R()-.5)*r*1.8);c.bezierCurveTo(-r*.3,(R()-.5)*r,r*.3,(R()-.5)*r,r,(R()-.5)*r*1.8);c.stroke()}},
 swirl(c,r,d){c.strokeStyle=hexA(d.c2,.85);c.lineWidth=r*.3;c.lineCap='round';for(let i=0;i<3;i++){c.beginPath();c.arc(i%2?r*.1:-r*.1,0,r*(.3+.3*i),i*1.9,i*1.9+3.3);c.stroke()}c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=r*.07;c.beginPath();c.arc(0,0,r*.55,.5,3.2);c.stroke()},
 candy(c,r,d){c.rotate(.6);for(let i=-5;i<=5;i++){c.fillStyle=i%2?hexA(d.c2,.95):'rgba(255,255,255,.8)';c.fillRect(-r*1.5,i*r*.3-r*.15,r*3,r*.3)}},
 bubbles(c,r,d){const R=seeded(strSeed(d.id||'b'));for(let i=0;i<9;i++){const x=(R()-.5)*r*1.7,y=(R()-.5)*r*1.7,q=r*(.1+R()*.2);c.strokeStyle=hexA(d.c2,.85);c.fillStyle='rgba(255,255,255,.2)';c.lineWidth=r*.05;c.beginPath();c.arc(x,y,q,0,TAU);c.fill();c.stroke();c.fillStyle='rgba(255,255,255,.8)';c.beginPath();c.arc(x-q*.35,y-q*.35,q*.2,0,TAU);c.fill()}},

function fxDraw(c,r,d,t,front){
 if(!d.fx)return;
 const col=RAR[d.r].col;
 for(const f of d.fx.split(',')){
  if(f==='ring'){c.save();c.rotate(-.45);c.scale(1,.32);c.strokeStyle=hexA(col,.95);c.lineWidth=r*.14;c.shadowColor=col;c.shadowBlur=r*.5;c.beginPath();if(front)c.arc(0,0,r*1.6,0,Math.PI);else c.arc(0,0,r*1.6,Math.PI,TAU);c.stroke();c.restore()}
  else if(!front&&f==='wings'){for(const sd of[-1,1])for(let i=0;i<4;i++){c.save();c.translate(sd*r*.85,-r*.1+i*r*.05);c.rotate(sd*(-.55+i*.32)+Math.sin(t*3+i)*.05*sd);c.fillStyle=i%2?'rgba(255,255,255,.92)':hexA(d.c1,.95);c.shadowColor=d.c1;c.shadowBlur=r*.3;c.beginPath();c.ellipse(sd*r*.8,0,r*.85,r*.17,0,0,TAU);c.fill();c.restore()}}
  else if(!front&&f==='flames'){for(let i=0;i<9;i++){const a=i*TAU/9+t*.9,l=r*(.5+.25*Math.sin(t*8+i*2.3)),bx=Math.cos(a)*r*.92,by=Math.sin(a)*r*.92,tx=Math.cos(a+.15)*(r+l),ty=Math.sin(a+.15)*(r+l);const g=c.createLinearGradient(bx,by,tx,ty);g.addColorStop(0,hexA(d.c2,.95));g.addColorStop(1,hexA(d.c1,0));c.fillStyle=g;c.beginPath();c.moveTo(Math.cos(a-.28)*r*.9,Math.sin(a-.28)*r*.9);c.quadraticCurveTo(Math.cos(a-.05)*(r+l*.6),Math.sin(a-.05)*(r+l*.6),tx,ty);c.quadraticCurveTo(Math.cos(a+.3)*(r+l*.5),Math.sin(a+.3)*(r+l*.5),Math.cos(a+.28)*r*.9,Math.sin(a+.28)*r*.9);c.fill()}}
  else if(front&&f==='halo'){c.save();c.strokeStyle='#fff3a0';c.lineWidth=r*.12;c.shadowColor='#ffd24a';c.shadowBlur=r*.6;c.beginPath();c.ellipse(0,-r*1.35,r*.55,r*.16,0,0,TAU);c.stroke();c.restore()}
  else if(front&&f==='lightning'){const R=seeded(Math.floor(t*6)*977+3);if(R()<.6){c.save();c.strokeStyle='#ffffff';c.shadowColor='#9fb0ff';c.shadowBlur=r*.6;c.lineWidth=r*.08;for(let k=0;k<2;k++){let a=R()*TAU,x=Math.cos(a)*r,y=Math.sin(a)*r;c.beginPath();c.moveTo(x,y);for(let q=0;q<4;q++){a+=(R()-.5)*.8;x+=Math.cos(a)*r*.28;y+=Math.sin(a)*r*.28;c.lineTo(x,y)}c.stroke()}c.restore()}}
  else if(front&&f==='orbit'){c.save();for(let i=0;i<3;i++){const a=t*1.6+i*TAU/3;c.fillStyle=d.c1;c.shadowColor=d.c1;c.shadowBlur=r*.4;c.beginPath();c.arc(Math.cos(a)*r*1.5,Math.sin(a)*r*.55,r*.14,0,TAU);c.fill()}c.restore()}
  else if(front&&f==='sparks'){c.fillStyle='#fff';for(let i=0;i<4;i++){const a=i*1.7+t*.3,rr=r*(1.05+.35*Math.abs(Math.sin(t*2+i))),sz=r*.1*Math.abs(Math.sin(t*3+i*2));star(c,Math.cos(a)*rr,Math.sin(a)*rr,sz)}}
  else if(front&&f==='crown'){c.save();c.translate(0,-r*1.18);c.fillStyle='#ffd700';c.strokeStyle='#8a5a00';c.lineWidth=r*.05;c.shadowColor='#ffd700';c.shadowBlur=r*.5;c.beginPath();c.moveTo(-r*.55,r*.25);c.lineTo(-r*.55,-r*.2);c.lineTo(-r*.28,r*.02);c.lineTo(0,-r*.35);c.lineTo(r*.28,r*.02);c.lineTo(r*.55,-r*.2);c.lineTo(r*.55,r*.25);c.closePath();c.fill();c.stroke();c.shadowBlur=0;[['#ff3355',-.3],['#33ccff',0],['#33ff88',.3]].forEach(g=>{c.fillStyle=g[0];c.beginPath();c.arc(g[1]*r,r*.08,r*.07,0,TAU);c.fill()});c.restore()}
  else if(front&&f==='bats'){for(let i=0;i<3;i++){const a=t*1.8+i*TAU/3;bat(c,Math.cos(a)*r*1.5,Math.sin(a)*r*.9-r*.2,r*.16,Math.sin(t*14+i))}}
 }}
function drawAura(c,r,d,t,maxRad){
 const rk=RAR[d.r].rank;if(rk<3)return;const col=RAR[d.r].col,pul=.8+.2*Math.sin(t*3);
 const rad=Math.min(r*(1.5+rk*.1),maxRad||1e9);
 const g=c.createRadialGradient(0,0,r*.8,0,0,rad*pul);g.addColorStop(0,hexA(col,.55));g.addColorStop(1,hexA(col,0));
 c.fillStyle=g;c.beginPath();c.arc(0,0,rad*pul,0,TAU);c.fill();
 if(rk>=5){const n=rk>=7?6:4;c.fillStyle=hexA(col,.95);for(let i=0;i<n;i++){const a=t*1.4+i*TAU/n,rr=r*(1.4+.08*Math.sin(t*4+i));star(c,Math.cos(a)*rr,Math.sin(a)*rr,r*.12*(rk>=7?1.4:1))}}
}
function drawMarble(c,x,y,r,d,rot,t,aura,maxRad){
 c.save();c.translate(x,y);
 const R_=RAR[d.r],rk=R_.rank;
 if(aura){drawAura(c,r,d,t,maxRad);fxDraw(c,r,d,t,false)}
 c.save();c.beginPath();c.arc(0,0,r,0,TAU);c.clip();
 const g=c.createRadialGradient(-r*.35,-r*.35,r*.1,0,0,r*1.05);g.addColorStop(0,d.c1);g.addColorStop(1,d.c2);
 c.fillStyle=g;c.fillRect(-r,-r,2*r,2*r);
 c.save();c.rotate(rot);if(PAT[d.pat])PAT[d.pat](c,r,d,t);c.restore();
 if(d.pat==='pumpkin')pumpkinFace(c,r,t);
 if(d.pat==='goat')goatHead(c,r*.62,'#4a3200');
 const sh=c.createRadialGradient(0,0,r*.5,0,0,r);sh.addColorStop(0,'rgba(0,0,0,0)');sh.addColorStop(.85,'rgba(0,0,0,.3)');sh.addColorStop(1,'rgba(0,0,0,.6)');c.fillStyle=sh;c.fillRect(-r,-r,2*r,2*r);
 const bl=c.createRadialGradient(r*.3,r*.55,0,r*.3,r*.55,r*.75);bl.addColorStop(0,hexA(d.c1,.55));bl.addColorStop(1,hexA(d.c1,0));c.fillStyle=bl;c.fillRect(-r,-r,2*r,2*r);
 if(rk>=2){c.save();c.rotate(-.6);const sx=((t*.45+(d.id.length%7)*.13)%1)*3*r-1.5*r,sg=c.createLinearGradient(sx,0,sx+r*.5,0);sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,'+(.2+rk*.03)+')');sg.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=sg;c.fillRect(sx,-2*r,r*.5,4*r);c.restore()}
 const hl=c.createRadialGradient(-r*.4,-r*.45,0,-r*.4,-r*.45,r*.55);hl.addColorStop(0,'rgba(255,255,255,.8)');hl.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=hl;c.fillRect(-r,-r,2*r,2*r);
 c.fillStyle='rgba(255,255,255,.95)';c.beginPath();c.ellipse(-r*.4,-r*.45,r*.2,r*.11,-.7,0,TAU);c.fill();
 c.fillStyle='rgba(255,255,255,.6)';c.beginPath();c.arc(r*.42,r*.36,r*.07,0,TAU);c.fill();
 c.restore();
 c.lineWidth=Math.max(1,r*.06);c.strokeStyle='rgba(0,0,0,.4)';c.beginPath();c.arc(0,0,r,0,TAU);c.stroke();
 if(rk>=1){c.lineWidth=Math.max(1,r*.05);c.strokeStyle=hexA(R_.col,.65);c.beginPath();c.arc(0,0,r*.94,0,TAU);c.stroke()}
 if(aura)fxDraw(c,r,d,t,true);
 c.restore();
}

function startTurn(p,bonus){
 M.turn=p;M.phase='aim';M.knocked=0;M.still=0;M.moveT=0;
 const d=M.defs[p],st=stats(d),ang=p===0?Math.PI/2:-Math.PI/2;
 M.shooter={kind:'s',owner:p,def:d,x:Math.cos(ang)*M.R,y:Math.sin(ang)*M.R,vx:0,vy:0,r:BASE.sr,m:1.15*st.mass,k:1.15/st.glide,rot:0,ang,trail:[]};
 M.marbles.push(M.shooter);M.drag=null;M.ai=p===1?{t:0,plan:null,pull:0}:null;
 if(M.o.mode==='closest'){const sh=M.shooter;for(let i=0;i<40;i++){if(!M.marbles.some(m=>m!==sh&&Math.hypot(m.x-sh.x,m.y-sh.y)<m.r+sh.r+4))break;place(ang+Math.ceil((i+1)/2)*.2*(i%2?1:-1))}M.tagDyn='BULLSEYE · ROUND '+M.round+' · SHOT '+(M.step+1)+'/4'}

let FX=true;
function hitFx(x,y,v){if(!FX)return;if(v>90){const n=Math.min(7,Math.floor(v/180)+1);for(let i=0;i<n;i++){const a=Math.random()*TAU,s=rnd(40,160);M.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4,max:.4,col:'#fff',sz:2.2})}}sfx('hit',v)}
function collide(a,b){
 const dx=b.x-a.x,dy=b.y-a.y,md2=a.r+b.r,d2=dx*dx+dy*dy;if(d2>=md2*md2)return;
 let d=Math.sqrt(d2),nx,ny;if(d<1e-4){nx=1;ny=0;d=0}else{nx=dx/d;ny=dy/d}
 const ov=md2-d,ia=1/a.m,ib=1/b.m,tot=ia+ib;
 a.x-=nx*ov*ia/tot;a.y-=ny*ov*ia/tot;b.x+=nx*ov*ib/tot;b.y+=ny*ov*ib/tot;
 const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(vn>=0)return;
 const j=-(1.94)*vn/tot;a.vx-=j*nx*ia;a.vy-=j*ny*ia;b.vx+=j*nx*ib;b.vy+=j*ny*ib;
 hitFx((a.x+b.x)/2,(a.y+b.y)/2,-vn)}
function pegHit(a,p){const dx=a.x-p.x,dy=a.y-p.y,md2=a.r+p.r,d2=dx*dx+dy*dy;if(d2>=md2*md2)return;const d=Math.sqrt(d2)||1e-3,nx=dx/d,ny=dy/d;a.x=p.x+nx*md2;a.y=p.y+ny*md2;const vn=a.vx*nx+a.vy*ny;if(vn<0){a.vx-=1.88*vn*nx;a.vy-=1.88*vn*ny;hitFx(p.x+nx*p.r,p.y+ny*p.r,-vn)}}
function onOut(m){
 M.ghosts.push({x:m.x,y:m.y,vx:m.vx*.6,vy:m.vy*.6,r:m.r,def:m.def,rot:m.rot,life:.7,max:.7,kind:m.kind});
 if(m.kind==='t'){M.score[M.turn]++;M.knocked++;sfx('out');for(let i=0;i<10;i++){const a=Math.random()*TAU,s=rnd(60,220);M.parts.push({x:m.x,y:m.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6,max:.6,col:m.def.c1,sz:3})}}
}
function stepWorld(W,dt,cb){
 const ms=W.marbles;
 for(const m of ms){if(m.vx||m.vy){
  if(W.wind){m.vx+=W.wx*dt;m.vy+=W.wy*dt}
  const sp=Math.hypot(m.vx,m.vy),ns=Math.max(0,sp-(m.k*W.fr*sp+55*W.fr)*dt);
  if(ns<8){m.vx=m.vy=0}else{const f=ns/sp;m.vx*=f;m.vy*=f}
  m.x+=m.vx*dt;m.y+=m.vy*dt;m.rot+=ns/m.r*dt}}
 for(let i=0;i<ms.length;i++){const a=ms[i];for(let j=i+1;j<ms.length;j++)collide(a,ms[j]);for(const p of W.pegs)pegHit(a,p)}
 for(let i=ms.length-1;i>=0;i--){const m=ms[i];if(Math.hypot(m.x,m.y)>W.R+m.r){ms.splice(i,1);cb(m)}}
}
function physics(dt){stepWorld(M,dt,onOut)}
function nearest(){let best=null,bd=1e9;for(const m of M.marbles){const d=Math.hypot(m.x,m.y);if(d<bd){bd=d;best=m}}return best?{m:best,d:bd}:null}
function endShotClosest(){
 M.step++;
 if(M.step<4){startTurn(M.order[M.step],false);return}
 const n=nearest();
 if(n){const w=n.m.owner;M.score[w]++;M.lead=n.m;M.msg=(w===0?'YOU WIN':(M.o.oppName||'OPP').toUpperCase()+' WINS')+' THE ROUND!';sfx(w===0?'win':'out');
  if(M.score[w]>=M.need){finish();return}}
 else{M.msg='NO MARBLES LEFT — REPLAY'}
 M.msgT=2.4;M.phase='roundend';M.pauseT=2.4}
function nextRound(){
 M.marbles.length=0;M.lead=null;M.round++;M.step=0;M.first=1-M.first;M.order=M.first?[1,0,1,0]:[0,1,0,1];startTurn(M.order[0],false)}
function endShot(){
 if(M.o.mode==='closest'){endShotClosest();return}
 const s=M.shooter,i=M.marbles.indexOf(s);
 if(i>=0){M.marbles.splice(i,1);M.ghosts.push({x:s.x,y:s.y,vx:0,vy:0,r:s.r,def:s.def,rot:s.rot,life:.4,max:.4,kind:'s'})}
 const left=M.marbles.length;
 if(left===0||M.score[0]>=M.need||M.score[1]>=M.need){finish();return}
 if(M.knocked>0&&M.bonusRun<bcap()){M.bonusRun++;startTurn(M.turn,true)}
 else{const capped=M.knocked>0,cp=bcap();M.bonusRun=0;startTurn(1-M.turn,false);if(capped){M.msg='BONUS LIMIT \u2014 '+cp+' IN A ROW';M.msgT=2}}
}
function finish(){M.phase='over';M.over=true;M.win=M.score[0]>M.score[1];M.endT=.9;M.msg=M.win?'YOU WIN!':'YOU LOSE';M.msgT=2;sfx(M.win?'win':'lose')}
function update(dt){
 M.t+=dt;if(M.msgT>0)M.msgT-=dt;
 if(M.wind){M.wt-=dt;if(M.wt<=0){M.wt=rnd(2.5,5);M.wd=rnd(0,TAU)}M.wx=Math.cos(M.wd)*30*M.wind;M.wy=Math.sin(M.wd)*30*M.wind}
 if(M.phase==='aim'&&M.turn===1)aiUpdate(dt);
 if(M.phase==='roundend'){M.pauseT-=dt;if(M.pauseT<=0)nextRound()}
 if(M.phase==='moving'){
  M.moveT+=dt;M.acc+=dt;let n=0;while(M.acc>=H&&n<24){physics(H);M.acc-=H;n++}if(n>=24)M.acc=0;
  const s=M.shooter;if(M.marbles.indexOf(s)>=0&&(s.vx||s.vy)){s.trail.push({x:s.x,y:s.y});if(s.trail.length>16)s.trail.shift()}else if(s.trail.length)s.trail.shift();
  let mv=false;for(const m of M.marbles)if(m.vx||m.vy){mv=true;break}
  if(!mv){M.still+=dt;if(M.still>.4)endShot()}else M.still=0;
  if(M.moveT>14)for(const m of M.marbles){m.vx=m.vy=0}
 }
 if(M.phase==='over'&&!M.ended){M.endT-=dt;if(M.endT<=0){M.ended=true;M.o.onEnd(M.win,M.score.slice())}}
 for(let i=M.parts.length-1;i>=0;i--){const p=M.parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;if(p.life<=0)M.parts.splice(i,1)}
 for(let i=M.ghosts.length-1;i>=0;i--){const g=M.ghosts[i];g.life-=dt;g.x+=g.vx*dt;g.y+=g.vy*dt;g.vx*=.97;g.vy*=.97;if(g.life<=0)M.ghosts.splice(i,1)}
}

/* ---------------- AI ---------------- */
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;let t=l2?((px-ax)*dx+(py-ay)*dy)/l2:0;t=clamp(t,0,1);return Math.hypot(px-(ax+t*dx),py-(ay+t*dy))}
function simDist(v0,k,c,dist){let v=v0,x=0;const h=1/120;while(x<dist){const nv=v-(k*v+c)*h;if(nv<8)return 0;v=nv;x+=v*h}return v}
function needPw(sh,s,d,maxV){
 const k=sh.k*M.fr,c=55*M.fr,tk=1.15*M.fr;
 let vt=100;while(vt<2500&&simDist(vt,tk,c,s+4)<=0)vt+=20;
 const vh=vt*(sh.m+1)/(1.95*sh.m)*1.1;
 let v0=vh;while(v0<maxV&&simDist(v0,k,c,d)<vh)v0+=20;
 return clamp(v0/maxV,.15,1)}
function simShot(sh,ux,uy,pw,maxV){
 const W={marbles:[],pegs:M.pegs,fr:M.fr,R:M.R,wind:0,wx:0,wy:0};let me=null;
 for(const m of M.marbles){const o={kind:m.kind,x:m.x,y:m.y,vx:0,vy:0,r:m.r,m:m.m,k:m.k,rot:0};W.marbles.push(o);if(m===sh)me=o}
 me.vx=ux*pw*maxV;me.vy=uy*pw*maxV;
 let outs=0;const cb=m=>{if(m.kind==='t')outs++};
 FX=false;
 for(let n=0;n<600;n++){stepWorld(W,1/120,cb);let mv=false;for(const m of W.marbles)if(m.vx||m.vy){mv=true;break}if(!mv)break}
 FX=true;return outs}
function aiPlan(){
 if(M.o.mode==='closest')return aiPlanClosest();
 const sh=M.shooter,R=M.R,st=stats(sh.def),skill=M.o.skill!==undefined?M.o.skill:.5,maxV=BASE.MAXV*st.pow;
 const tg=M.marbles.filter(m=>m.kind==='t'),pre=[],NA=36,off=sh.r+BASE.tr;
 for(let i=0;i<NA;i++){
  const a=i*TAU/NA+Math.random()*.08,sx=Math.cos(a)*R,sy=Math.sin(a)*R;
  for(const t of tg){
   const dx0=t.x-sx,dy0=t.y-sy,d0=Math.hypot(dx0,dy0)||1,px=-dy0/d0,py=dx0/d0;
   for(const o of[-.9,-.45,0,.45,.9]){
    const ux0=t.x+px*o*off*.9-sx,uy0=t.y+py*o*off*.9-sy,ul=Math.hypot(ux0,uy0),ux=ux0/ul,uy=uy0/ul;
    const save=sh.x,savey=sh.y;sh.x=sx;sh.y=sy;const h=rayHit(sx,sy,ux,uy,sh.r);sh.x=save;sh.y=savey;
    if(!h||h.obj.kind!=='t')continue;
    const T=h.obj,cxx=sx+ux*h.d,cyy=sy+uy*h.d,nl=Math.hypot(T.x-cxx,T.y-cyy)||1,nx=(T.x-cxx)/nl,ny=(T.y-cyy)/nl;
    const b=T.x*nx+T.y*ny,disc=b*b-(T.x*T.x+T.y*T.y-(R+T.r)*(R+T.r));if(disc<0)continue;
    const s=-b+Math.sqrt(disc);if(!(s>0))continue;
    pre.push({a,ux,uy,d:h.d,s,cost:s*.8+h.d*.05+Math.abs(o)*10+Math.random()*6})}}}
 if(!pre.length){const a=Math.random()*TAU;return{a,dx:-Math.cos(a),dy:-Math.sin(a),pw:.7}}
 pre.sort((p,q)=>p.cost-q.cost);
 const top=pre.slice(0,Math.round(14+skill*18)),cands=[];
 const save={x:sh.x,y:sh.y};
 for(const p of top){
  sh.x=Math.cos(p.a)*R;sh.y=Math.sin(p.a)*R;
  const base=needPw(sh,p.s,p.d,maxV);
  for(const f of[1,1.35,1.8,3]){const pw=clamp(base*f,.15,1);cands.push({a:p.a,ux:p.ux,uy:p.uy,pw,outs:simShot(sh,p.ux,p.uy,pw,maxV)});if(pw>=1)break}}
 sh.x=save.x;sh.y=save.y;
 cands.sort((p,q)=>q.outs-p.outs||p.pw-q.pw);
 let pl=cands[Math.floor(Math.random()*Math.min(cands.length,1+Math.round((1-skill*(M.o.edge||.8))*9)))];

function aiPlanClosest(){

 const err=1-skill*(M.o.edge||.8),ang=randn()*(.01+err*.07),ca=Math.cos(ang),sa=Math.sin(ang);
 return{a:pl.a,dx:pl.ux*ca-pl.uy*sa,dy:pl.ux*sa+pl.uy*ca,pw:clamp(pl.pw*(1+randn()*(.03+err*.25)),.1,1)}}

 const D=DIV[T.div];
 showUI('<div class="wrap"><div class="top"><button class="back" data-a="menu">\u2190 Menu</button>'+coinChip()+'</div><div class="h2">'+D.ic+' '+D.n+'</div>'+bracketHTML(T)+

function tourStart(div){
 const D=DIV[div];if(S.coins<D.fee){toast('Not enough coins');sfx('no');return}
 S.coins-=D.fee;const names=shuffle(NAMES.slice(0,29)).slice(0,7),ents=[{name:'You',sk:0}];
 names.forEach((n,i)=>{const pool=LIST.filter(m=>m.r===D.tiers[i%2]);ents.push({name:n,def:pick(pool).id,sk:D.sk[0]+(D.sk[1]-D.sk[0])*(i/6)})});

 const T=S.tourn,idx=T.alive.indexOf(0),pi=T.alive[idx^1],e=T.ents[pi],rd=T.hist.length;
 startMatch({tag:RN[rd].toUpperCase().replace(/S$/,'')+' \u00b7 '+DIV[T.div].n.toUpperCase(),oppName:e.name,oppDef:DEFS[e.def],skill:e.sk,pegs:pegSet([0,2,3][rd]),fr:1,theme:['felt','sand','gold'][rd],R:240,back:tourneyScreen,onEnd:win=>endTour(win)})}
function endTour(win){
 const T=S.tourn,D=DIV[T.div],pairs=[],next=[];
 for(let i=0;i<T.alive.length;i+=2){const a=T.alive[i],b=T.alive[i+1];let w;
  if(a===0||b===0)w=win?0:(a===0?b:a);else{const sa=T.ents[a].sk+.05,sb=T.ents[b].sk+.05;w=Math.random()<sa/(sa+sb)?a:b}
  pairs.push([a,b,w]);next.push(w)}
 T.hist.push(pairs);T.alive=next;
 if(!win){S.tourn=null;S.coins+=10;showResult({win:false,title:'ELIMINATED',sub:RN[T.hist.length-1].replace(/s$/,'')+' loss \u00b7 '+subScore(),coins:10,btns:[{t:'Tournaments',a:'tourney',p:1}]});return}
 S.wins++;
 if(next.length===1){S.coins+=D.prize;S.tourWins[T.div]++;if(T.div==='gold'&&!S.owned.king)grant('king');S.tourn=null;
  showResult({win:true,title:D.n.toUpperCase()+' CHAMPION!',sub:subScore(),coins:D.prize,btns:[{t:'Tournaments',a:'tourney',p:1}]})}
 else{save();showResult({win:true,title:'ROUND WON!',sub:subScore(),btns:[{t:'Continue',a:'tourney',p:1}]})}}

 const act=eventActive(),pr=S.event.prog;
 showUI('<div class="wrap"><div class="top"><button class="back" data-a="menu">\u2190 Menu</button>'+coinChip()+'</div><div class="logo" style="background:linear-gradient(#ffd9a8,#ff7a1a);-webkit-background-clip:text;background-clip:text;color:transparent">\ud83c\udf83 HAUNTED<span>HARVEST</span></div>'+
 '<div class="card hal"><div class="cardrow">'+iconHTML('jack',96,S.owned.jack?1:1)+'<div><b>Win it all: '+DEFS.jack.name+'</b><div class="mut">Exclusive Halloween marble \u2014 the 2nd best marble in the game, beaten only by the GOAT. <b style="color:#ff7a1a">HARD MODE</b> \u2014 the rivals are brutal.</div></div></div>'+
 '<div class="pips">'+EVR.map((r,i)=>'<div class="pip '+(i<pr?'done':i===pr?'on':'')+'"></div>').join('')+'</div>'+(S.owned.jack?'<div class="new" style="text-align:center">\u2714 UNLOCKED</div>':'')+'</div>'+
 (act?EVR.map((r,i)=>{const st=i<pr?'done':i===pr?'cur':'';const lock=i>pr;return '<button class="evr '+st+' '+(lock?'dis':'')+'" data-a="evgo" data-i="'+(i+1)+'"><div class="n">'+(i<pr?'\u2714':i+1)+'</div><div style="flex:1"><b>'+r.n+'</b><div class="mut">vs '+r.opp+' \u00b7 '+skillWord(r.sk)+(r.first?' \u00b7 rival shoots first':'')+(r.bonus?' \u00b7 rival gets '+r.bonus+' bonus shots':'')+'</div></div>'+iconHTML(r.def,46,1)+'</button>'}).join(''):'<div class="card"><b>Event over</b><div class="mut">Haunted Harvest runs through the first week of November and returns next October.</div></div>')+'</div>',true)}
function startEvent(r){

 showUI('<div class="wrap"><div class="top"><button class="back" data-a="menu">\u2190 Menu</button>'+coinChip()+'</div><div class="h2">\ud83d\uded2 Shop</div>'+

function rollRarity(odds){const ks=Object.keys(odds),tot=ks.reduce((a,k)=>a+odds[k],0);let x=Math.random()*tot;for(const k of ks){x-=odds[k];if(x<=0)return k}return ks[0]}
function openPack(p){

 modal('<div class="mcard" style="--c:'+p.col+'"><h2>'+p.n+'</h2><div class="orb" style="--c:'+p.col+'">?</div><div class="mut">Opening...</div></div>');
