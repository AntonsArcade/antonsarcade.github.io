<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idea Box — Anton's Arcade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">
    <img src="logo.jpg" alt="Anton's Arcade logo">
    <span>Anton's Arcade</span>
  </div>
  <nav>
    <a href="index.html">Home</a>
    <a href="games.html">Games</a>
    <a href="idea-box.html">Idea Box</a>
  </nav>
</header>

<main>
  <div class="box">
    <h2>Suggest a game idea</h2>
    <p>Got an idea for a game? Tell us about it. Anton reads these when he has time to look — no live chat, no replies guaranteed.</p>

    <form action="mailto:antonsarcades@gmail.com" method="post" enctype="text/plain">
      <input type="text" name="name" placeholder="Your name (optional)">
      <textarea name="idea" placeholder="What's your game idea?" required></textarea>
      <button type="submit">Send idea</button>
    </form>
  </div>
</main>

<footer>Anton's Arcade &mdash; built by a kid, made for everyone.</footer>

</body>
</html>
