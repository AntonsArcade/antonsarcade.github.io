<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Potato Soccer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#241b3f;
    --sky-bottom:#ff7a4d;
    --grass-a:#3fa34d;
    --grass-b:#358f40;
    --cream:#fff3df;
    --gold:#ffc93c;
    --gold-dark:#d99a1a;
    --ink:#2b1c12;
    --potato:#dba463;
    --shadow:#1a1228;
    --pessi:#5fb8e6;
    --potadaldo:#d6452d;
    --mbafry:#1e3a8a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Baloo 2',sans-serif;
    background:
      radial-gradient(ellipse at 50% 0%, #3a2a5c 0%, var(--sky-top) 55%, #150f26 100%);
    color:var(--cream);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    padding:14px;
  }
  h1,h2,h3{font-family:'Fredoka',sans-serif; margin:0;}
  #app{
    width:100%;
    max-width:920px;
    position:relative;
  }
  .screen{ display:flex; flex-direction:column; align-items:center; }
  .hidden{ display:none !important; }

  /* ---------- SELECT SCREEN ---------- */
  .title-wrap{ text-align:center; margin-bottom:6px; }
  .title-wrap h1{
    font-size:clamp(34px,7vw,56px);
    letter-spacing:1px;
    color:var(--gold);
    text-shadow:0 4px 0 #8a4a00, 0 8px 14px rgba(0,0,0,0.45);
    -webkit-text-stroke:2px #4a2a00;
  }
  .title-wrap p{
    color:var(--cream);
    opacity:0.85;
    font-weight:600;
    font-size:14px;
    margin-top:4px;
  }
  .ball-o{ display:inline-block; }

  .cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    width:100%;
    margin:18px 0 8px;
  }
  .card{
    background:linear-gradient(180deg,#3a2d22,#241a13);
    border:3px solid #523a23;
    border-radius:18px;
    padding:12px 10px 14px;
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    text-align:center;
    position:relative;
  }
  .card:hover{ transform:translateY(-4px); border-color:var(--gold); }
  .card.selected{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(255,201,60,0.35), 0 10px 24px rgba(0,0,0,0.5);
    transform:translateY(-6px);
  }
  .card canvas{ width:100%; max-width:140px; aspect-ratio:1/1; display:block; margin:0 auto; }
  .card h3{ font-size:clamp(13px,3vw,17px); color:var(--cream); margin-top:6px; }
  .card .nick{ font-size:11px; color:var(--gold); opacity:0.9; margin-bottom:6px; font-weight:600;}
  .stat-row{ display:flex; align-items:center; gap:6px; margin:3px 0; }
  .stat-label{ font-size:10px; width:38px; text-align:left; opacity:0.75; }
  .stat-bar{ flex:1; height:7px; background:#1a120c; border-radius:4px; overflow:hidden; }
  .stat-fill{ height:100%; background:linear-gradient(90deg,var(--gold-dark),var(--gold)); }
  .card .blurb{ font-size:10.5px; opacity:0.75; margin-top:6px; line-height:1.3; min-height:28px; }

  .start-btn{
    font-family:'Fredoka',sans-serif;
    font-size:18px;
    padding:12px 38px;
    border-radius:50px;
    border:none;
    background:linear-gradient(180deg,#ffe08a,var(--gold));
    color:#4a2a00;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 5px 0 var(--gold-dark), 0 10px 18px rgba(0,0,0,0.4);
    transition:transform .1s ease;
    margin-top:8px;
    letter-spacing:0.5px;
  }
  .start-btn:disabled{ opacity:0.4; cursor:not-allowed; box-shadow:0 5px 0 #7a6a3a; }
  .start-btn:not(:disabled):active{ transform:translateY(4px); box-shadow:0 1px 0 var(--gold-dark); }
  .hint{ font-size:11.5px; opacity:0.65; margin-top:10px; text-align:center; }

  /* ---------- GAME SCREEN ---------- */
  #gameScreen{ width:100%; position:relative; }
  #hud{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 4px;
    font-family:'Fredoka',sans-serif;
  }
  .hud-side{ display:flex; align-items:center; gap:8px; width:38%; }
  .hud-side.right{ justify-content:flex-end; }
  .hud-name{ font-size:clamp(11px,2.6vw,15px); font-weight:600; }
  .hud-score{
    font-size:clamp(20px,5vw,30px);
    background:#1a1228;
    border:2px solid var(--gold-dark);
    border-radius:10px;
    padding:2px 12px;
    min-width:38px;
    text-align:center;
    color:var(--gold);
  }
  .hud-timer{
    font-size:clamp(18px,4vw,24px);
    background:#1a1228;
    border:2px solid var(--gold-dark);
    border-radius:10px;
    padding:4px 14px;
    color:var(--cream);
  }
  .field-wrap{
    width:100%;
    position:relative;
    border-radius:14px;
    overflow:hidden;
    border:5px solid #4a2a00;
    box-shadow:0 14px 30px rgba(0,0,0,0.5);
  }
  canvas#canvas{ width:100%; height:auto; display:block; background:#000; }

  #banner{
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  #banner span{
    font-family:'Fredoka',sans-serif;
    font-size:clamp(28px,7vw,52px);
    color:var(--gold);
    -webkit-text-stroke:2px #4a2a00;
    text-shadow:0 6px 0 #4a2a00, 0 10px 20px rgba(0,0,0,0.5);
    animation:pop .35s ease;
  }
  @keyframes pop{ from{ transform:scale(0.4); opacity:0;} to{ transform:scale(1); opacity:1;} }

  #touchControls{
    display:none;
    width:100%;
    justify-content:space-between;
    padding:10px 4px 0;
  }
  .tc-btn{
    user-select:none;
    -webkit-user-select:none;
    width:62px; height:62px;
    border-radius:50%;
    background:linear-gradient(180deg,#ffe08a,var(--gold));
    border:3px solid var(--gold-dark);
    display:flex; align-items:center; justify-content:center;
    font-size:24px; font-weight:700; color:#4a2a00;
    box-shadow:0 4px 0 var(--gold-dark);
  }
  .tc-btn:active{ transform:translateY(3px); box-shadow:none; }
  .tc-group{ display:flex; gap:10px; }

  #gameOverScreen{
    position:absolute; inset:0;
    background:rgba(15,10,25,0.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:14px;
    text-align:center;
    padding:20px;
  }
  #gameOverScreen h2{ font-size:clamp(26px,6vw,40px); color:var(--gold); -webkit-text-stroke:1.5px #4a2a00; margin-bottom:6px;}
  #gameOverScreen .finalScore{ font-size:clamp(20px,5vw,30px); margin:10px 0 18px; }
  .over-btns{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .secondary-btn{
    font-family:'Fredoka',sans-serif;
    font-size:15px;
    padding:11px 26px;
    border-radius:50px;
    border:2px solid var(--gold);
    background:transparent;
    color:var(--gold);
    font-weight:600;
    cursor:pointer;
  }

  #countdownOverlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  #countdownOverlay span{
    font-family:'Fredoka',sans-serif;
    font-size:clamp(50px,12vw,90px);
    color:var(--gold);
    -webkit-text-stroke:3px #4a2a00;
    text-shadow:0 8px 0 #4a2a00;
  }

  .controls-legend{
    font-size:11px; opacity:0.65; text-align:center; margin-top:8px;
  }

  @media (max-width:640px){
    #touchControls{ display:flex; }
    .controls-legend.kb-only{ display:none; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ===================== SELECT SCREEN ===================== -->
  <div id="selectScreen" class="screen">
    <div class="title-wrap">
      <h1>🥔 POTATO SOCCER</h1>
      <p>Pick your spud. Win the cup. Avoid the fryer.</p>
    </div>
    <div class="cards" id="cards"></div>
    <button class="start-btn" id="startBtn" disabled>KICK OFF!</button>
    <div class="hint">Tap a potato to scout their stats, then hit Kick Off.</div>
  </div>

  <!-- ===================== GAME SCREEN ===================== -->
  <div id="gameScreen" class="screen hidden">
    <div id="hud">
      <div class="hud-side left">
        <div class="hud-score" id="scorePlayer">0</div>
        <div class="hud-name" id="namePlayer">YOU</div>
      </div>
      <div class="hud-timer" id="timer">1:30</div>
      <div class="hud-side right">
        <div class="hud-name" id="nameAI">CPU</div>
        <div class="hud-score" id="scoreAI">0</div>
      </div>
    </div>
    <div class="field-wrap">
      <canvas id="canvas" width="900" height="500"></canvas>
      <div id="banner"></div>
      <div id="countdownOverlay"></div>
      <div id="gameOverScreen" class="hidden"></div>
    </div>
    <div id="touchControls">
      <div class="tc-group">
        <div class="tc-btn" id="btnLeft">◀</div>
        <div class="tc-btn" id="btnRight">▶</div>
      </div>
      <div class="tc-group">
        <div class="tc-btn" id="btnKick">⚡</div>
        <div class="tc-btn" id="btnJump">⤒</div>
      </div>
    </div>
    <div class="controls-legend kb-only">A / D move &nbsp;•&nbsp; W jump &nbsp;•&nbsp; S kick</div>
  </div>

</div>

<script>
(function(){
"use strict";

/* ============================================================
   CHARACTER DEFINITIONS
============================================================ */
const CHARACTERS = [
  {
    id:'pessi', name:'Isigma Pessi', nick:'"El Spudo"',
    primary:'#74acdf', secondary:'#ffffff', hairColor:'#5a3a1e',
    hairStyle:'tuft', jerseyStyle:'stripes_v', number:10,
    speed:5.6, jump:13.0, kickPower:14.5,
    statSpeed:5, statJump:3, statKick:4,
    blurb:"Tiny, slippery, impossible to tackle. Born in a sack, raised on the pitch."
  },
  {
    id:'potadaldo', name:'Potadaldo', nick:'"CR-Yukon"',
    primary:'#cc0000', secondary:'#006600', hairColor:'#3a2a16',
    hairStyle:'quiff', jerseyStyle:'plain', number:7,
    speed:4.9, jump:15.8, kickPower:15.5,
    statSpeed:3, statJump:5, statKick:5,
    blurb:"Towers over the field. Never skips leg day, or any day, technically."
  },
  {
    id:'mbafry', name:'Mbafry', nick:'"The Fry Guy"',
    primary:'#002395', secondary:'#ffffff', hairColor:'#1a1a1a',
    hairStyle:'curls', jerseyStyle:'plain', number:10,
    speed:6.3, jump:13.4, kickPower:13.2,
    statSpeed:5, statJump:3, statKick:3,
    blurb:"Blistering speed, fresh out of the fryer. Crispy on the outside."
  },
  {
    id:'yamtato', name:'Laminé Yamtato', nick:'"El Golden Spud"',
    primary:'#c60b1e', secondary:'#ffc400', hairColor:'#2a1a0a',
    hairStyle:'yamal', jerseyStyle:'plain', number:19,
    speed:6.5, jump:15.8, kickPower:15.5,
    statSpeed:5, statJump:5, statKick:5,
    blurb:"17 and already untouchable. Fastest spud in La Liga. Born on the pitch, raised on chips."
  },
  {
    id:'haataland', name:'Erling Haataland', nick:'"The Spud Viking"',
    primary:'#ef2b2d', secondary:'#002868', hairColor:'#f0d060',
    hairStyle:'viking', jerseyStyle:'cross', number:9,
    speed:4.8, jump:16.5, kickPower:16.0,
    statSpeed:3, statJump:5, statKick:5,
    blurb:"Seven feet of Norwegian potato. Headers so hard they dent the crossbar."
  },
  {
    id:'fryingham', name:'Jude Fryingham', nick:'"The Golden Hash"',
    primary:'#ffffff', secondary:'#cf081f', hairColor:'#1a0f08',
    hairStyle:'fade', jerseyStyle:'cross', number:10,
    speed:5.9, jump:14.2, kickPower:14.8,
    statSpeed:4, statJump:4, statKick:4,
    blurb:"Box-to-box spud. Goals, assists, and drip — all in one crispy package."
  }
];

/* ============================================================
   FIELD / PHYSICS CONSTANTS
============================================================ */
const W = 900, H = 500;
const GROUND_Y = 440;
const GOAL_OPEN_H = 132;
const CROSSBAR_Y = GROUND_Y - GOAL_OPEN_H;
const LEFT_POST_X = 26, RIGHT_POST_X = W - 26;
const HEAD_R = 34;
const LEG_H = 44;
const BALL_R = 15;
const GRAVITY = 0.62;
const MATCH_SECONDS = 90;
const KICK_RANGE = 80;
const KICK_COOLDOWN = 360;

/* ============================================================
   GLOBAL STATE
============================================================ */
let selectedIndex = null;
let screenState = 'select'; // select | countdown | playing | celebrating | over
let countdownVal = 3;
let countdownAccum = 0;
let celebrationTimer = 0;
let celebrationWho = null;
let timeLeft = MATCH_SECONDS;
let lastTs = null;

const score = { player:0, ai:0 };

const keys = { left:false, right:false, jump:false, kick:false };

function freshEntity(side){
  return {
    side, x: side==='player'?220:680,
    vy:0, jumpY:0, onGround:true,
    facing: side==='player'?1:-1,
    attackDir: side==='player'?1:-1,
    vx:0, lastKick:-9999,
    aiTargetX: 450, aiNextThink:0
  };
}

let player = freshEntity('player');
let ai = freshEntity('ai');
let playerChar = CHARACTERS[0];
let aiChar = CHARACTERS[1];

const ball = { x:450, y:200, vx:0, vy:0, rot:0 };

/* ============================================================
   SELECT SCREEN
============================================================ */
const cardsEl = document.getElementById('cards');
const startBtn = document.getElementById('startBtn');

function miniPotatoCanvas(char){
  const c = document.createElement('canvas');
  c.width = 160; c.height = 160;
  const cx = c.getContext('2d');
  drawLegs(cx, 80, 118, 0, false, 1, 38);
  drawPotatoCharacter(cx, char, 80, 118, 1, 0, false, 0, 38);
  return c;
}

function buildCards(){
  cardsEl.innerHTML = '';
  CHARACTERS.forEach((char, i)=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.index = i;

    const canvasHolder = document.createElement('div');
    canvasHolder.appendChild(miniPotatoCanvas(char));
    card.appendChild(canvasHolder);

    const h3 = document.createElement('h3');
    h3.textContent = char.name;
    card.appendChild(h3);

    const nick = document.createElement('div');
    nick.className = 'nick';
    nick.textContent = char.nick;
    card.appendChild(nick);

    card.appendChild(statRow('SPD', char.statSpeed));
    card.appendChild(statRow('JMP', char.statJump));
    card.appendChild(statRow('KCK', char.statKick));

    const blurb = document.createElement('div');
    blurb.className = 'blurb';
    blurb.textContent = char.blurb;
    card.appendChild(blurb);

    card.addEventListener('click', ()=>{
      selectedIndex = i;
      [...cardsEl.children].forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      startBtn.disabled = false;
    });

    cardsEl.appendChild(card);
  });
}

function statRow(label, val){
  const row = document.createElement('div');
  row.className = 'stat-row';
  const lab = document.createElement('div');
  lab.className = 'stat-label';
  lab.textContent = label;
  const bar = document.createElement('div');
  bar.className = 'stat-bar';
  const fill = document.createElement('div');
  fill.className = 'stat-fill';
  fill.style.width = (val*20)+'%';
  bar.appendChild(fill);
  row.appendChild(lab);
  row.appendChild(bar);
  return row;
}

buildCards();

startBtn.addEventListener('click', ()=>{
  if (selectedIndex === null) return;
  playerChar = CHARACTERS[selectedIndex];
  const rest = CHARACTERS.filter((c,i)=>i!==selectedIndex);
  aiChar = rest[Math.floor(Math.random()*rest.length)];
  document.getElementById('namePlayer').textContent = playerChar.name.toUpperCase();
  document.getElementById('nameAI').textContent = aiChar.name.toUpperCase();
  document.getElementById('selectScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  startMatch();
});

/* ============================================================
   CANVAS / DRAWING
============================================================ */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function drawField(){
  // sky
  const sky = ctx.createLinearGradient(0,0,0,CROSSBAR_Y);
  sky.addColorStop(0,'#241b3f');
  sky.addColorStop(1,'#ff7a4d');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,GROUND_Y);

  // distant crowd glow strip
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for(let i=0;i<14;i++){
    ctx.beginPath();
    ctx.arc(i*70+20, 60+Math.sin(i)*10, 26, 0, Math.PI*2);
    ctx.fill();
  }

  // grass
  const stripes = 9;
  const stripeH = (H-GROUND_Y)/1; // not used directly
  for(let i=0;i<stripes;i++){
    ctx.fillStyle = i%2===0 ? '#3fa34d' : '#358f40';
    const sw = W/stripes;
    ctx.fillRect(i*sw, GROUND_Y, sw, H-GROUND_Y);
  }
  // grass top highlight line
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(0,GROUND_Y,W,3);

  // center line + circle
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(W/2,GROUND_Y);
  ctx.lineTo(W/2,H);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(W/2,H,50,Math.PI,Math.PI*2);
  ctx.stroke();

  drawGoal(LEFT_POST_X, 1);
  drawGoal(RIGHT_POST_X, -1);
}

function drawGoal(postX, dir){
  // dir: 1 means net extends to the right (left goal), -1 means net extends left (right goal)
  ctx.save();
  ctx.strokeStyle = '#fdf6e3';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(postX, GROUND_Y);
  ctx.lineTo(postX, CROSSBAR_Y);
  ctx.lineTo(postX + dir*26, CROSSBAR_Y);
  ctx.stroke();

  // net hatching
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1.4;
  const netDepth = 26;
  for(let i=0;i<=6;i++){
    const yy = CROSSBAR_Y + i*(GOAL_OPEN_H/6);
    ctx.beginPath();
    ctx.moveTo(postX, yy);
    ctx.lineTo(postX+dir*netDepth, yy);
    ctx.stroke();
  }
  for(let i=0;i<=4;i++){
    const xx = postX + dir*i*(netDepth/4);
    ctx.beginPath();
    ctx.moveTo(xx, CROSSBAR_Y);
    ctx.lineTo(xx, GROUND_Y);
    ctx.stroke();
  }
  ctx.restore();
}

function shadowAt(x, jumpY, baseR){
  const scale = Math.max(0.35, 1 - jumpY/220);
  ctx.save();
  ctx.globalAlpha = 0.35*scale;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(x, GROUND_Y+4, baseR*scale, baseR*0.32*scale, 0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// Universal lumpy potato silhouette path (relative to 0,0), used for every character
function potatoPath(r){
  this.beginPath();
  this.moveTo(-r*0.2, -r*1.05);
  this.bezierCurveTo(r*0.55,-r*1.15, r*1.1,-r*0.5, r*1.05,-r*0.05);
  this.bezierCurveTo(r*1.15, r*0.45, r*0.7, r*1.05, r*0.05, r*1.02);
  this.bezierCurveTo(-r*0.55, r*1.18, -r*1.15, r*0.55, -r*1.08,-r*0.05);
  this.bezierCurveTo(-r*1.1, -r*0.6, -r*0.65,-r*1.0, -r*0.2,-r*1.05);
  this.closePath();
}

function drawPotatoCharacter(g, char, cx, cy, facing, kickPhase, isKicking, walkPhase, r){
  r = r || HEAD_R;
  g.save();
  g.translate(cx, cy);

  // body shading gradient
  const grad = g.createRadialGradient(-r*0.3,-r*0.4,r*0.2, 0,0, r*1.3);
  grad.addColorStop(0, '#f2c98a');
  grad.addColorStop(0.55, '#dba463');
  grad.addColorStop(1, '#b97f3f');

  potatoPath.call(g, r);
  g.fillStyle = grad;
  g.fill();
  g.lineWidth = 2.5;
  g.strokeStyle = '#8a5a2c';
  g.stroke();

  // potato "eyes" texture dots (the pun)
  g.fillStyle = 'rgba(120,80,40,0.55)';
  const texSpots = [[-r*0.6,r*0.5],[r*0.55,r*0.6],[r*0.65,-r*0.55],[-r*0.75,-r*0.1]];
  texSpots.forEach(p=>{
    g.beginPath();
    g.ellipse(p[0],p[1], r*0.07, r*0.045, 0.6, 0, Math.PI*2);
    g.fill();
  });

  // jersey (lower portion) — styled per national kit
  g.save();
  potatoPath.call(g, r);
  g.clip();
  const jTop = r*0.38, jH = r*1.0;
  if (char.jerseyStyle === 'stripes_v'){
    const sw = r*0.34;
    for(let col=-4; col<=4; col++){
      g.fillStyle = col%2===0 ? char.primary : char.secondary;
      g.fillRect(col*sw - sw*0.5, jTop, sw+0.5, jH);
    }
  } else if (char.jerseyStyle === 'cross'){
    g.fillStyle = char.primary;
    g.fillRect(-r*1.3, jTop, r*2.6, jH);
    g.fillStyle = char.secondary;
    g.fillRect(-r*1.3, jTop + jH*0.32, r*2.6, jH*0.3);
    g.fillRect(-r*0.16, jTop, r*0.32, jH);
    g.fillStyle = '#ffffff';
    g.fillRect(-r*1.3, jTop + jH*0.38, r*2.6, jH*0.04);
    g.fillRect(-r*1.3, jTop + jH*0.58, r*2.6, jH*0.04);
  } else {
    g.fillStyle = char.primary;
    g.fillRect(-r*1.3, jTop, r*2.6, jH);
  }
  g.fillStyle = 'rgba(255,255,255,0.15)';
  g.fillRect(-r*1.3, jTop, r*2.6, r*0.14);
  g.restore();

  // jersey number badge
  g.fillStyle = char.jerseyStyle === 'cross' ? char.secondary : char.secondary;
  g.beginPath();
  g.arc(0, r*0.66, r*0.3, 0, Math.PI*2);
  g.fill();
  g.fillStyle = char.jerseyStyle === 'cross' ? char.primary : char.primary;
  g.font = '700 '+Math.round(r*0.34)+'px Fredoka, sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(char.number, 0, r*0.68);

  // hair / accessory
  g.save();
  g.translate(0, -r*0.85);
  if (char.hairStyle === 'tuft'){
    g.fillStyle = char.hairColor;
    g.beginPath();
    g.moveTo(-r*0.35,0);
    g.quadraticCurveTo(-r*0.1,-r*0.55, r*0.15,-r*0.1);
    g.quadraticCurveTo(r*0.3,-r*0.4, r*0.4,0);
    g.closePath();
    g.fill();
    // headband (sky blue / white stripes)
    g.fillStyle = char.primary;
    g.fillRect(-r*0.95, r*0.18, r*1.9, r*0.22);
    g.fillStyle = '#fff';
    g.fillRect(-r*0.95, r*0.18, r*0.55, r*0.22);
    g.fillRect(r*0.35, r*0.18, r*0.55, r*0.22);
  } else if (char.hairStyle === 'quiff'){
    g.fillStyle = char.hairColor;
    for(let i=-2;i<=2;i++){
      g.beginPath();
      g.moveTo(i*r*0.22, r*0.1);
      g.lineTo(i*r*0.22 - r*0.06, -r*0.5 - Math.abs(i)*r*0.05);
      g.lineTo(i*r*0.22 + r*0.14, r*0.05);
      g.closePath();
      g.fill();
    }
  } else if (char.hairStyle === 'curls'){
    g.fillStyle = char.hairColor;
    for(let i=-2;i<=2;i++){
      g.beginPath();
      g.arc(i*r*0.32, -r*0.05 + Math.abs(i)*r*0.06, r*0.22, 0, Math.PI*2);
      g.fill();
    }
    g.fillStyle = char.primary;
    g.beginPath();
    g.ellipse(0, -r*0.15, r*0.55, r*0.18, 0, Math.PI, Math.PI*2);
    g.fill();
  } else if (char.hairStyle === 'yamal'){
    g.fillStyle = char.hairColor;
    for(let i=-3;i<=3;i++){
      g.beginPath();
      g.arc(i*r*0.26, -r*0.06 + Math.abs(i)*r*0.05, r*0.2, 0, Math.PI*2);
      g.fill();
    }
    g.strokeStyle = char.primary;
    g.lineWidth = r*0.16;
    g.beginPath();
    g.moveTo(-r*0.95, r*0.2);
    g.lineTo(r*0.95, r*0.2);
    g.stroke();
    g.strokeStyle = char.secondary;
    g.lineWidth = r*0.09;
    g.beginPath();
    g.moveTo(-r*0.95, r*0.2);
    g.lineTo(r*0.95, r*0.2);
    g.stroke();
  } else if (char.hairStyle === 'viking'){
    g.fillStyle = '#f0d060';
    g.beginPath();
    g.ellipse(0, -r*0.08, r*0.78, r*0.32, 0, Math.PI, Math.PI*2);
    g.fill();
    g.beginPath();
    g.arc(0, -r*0.38, r*0.24, 0, Math.PI*2);
    g.fill();
    g.beginPath();
    g.ellipse(-r*0.78, r*0.12, r*0.18, r*0.3, -0.3, 0, Math.PI*2);
    g.fill();
    g.beginPath();
    g.ellipse(r*0.78, r*0.12, r*0.18, r*0.3, 0.3, 0, Math.PI*2);
    g.fill();
    g.strokeStyle = '#d4b040';
    g.lineWidth = r*0.07;
    g.beginPath();
    g.arc(0, -r*0.38, r*0.14, 0, Math.PI*2);
    g.stroke();
  } else if (char.hairStyle === 'fade'){
    g.fillStyle = char.hairColor;
    g.beginPath();
    g.ellipse(0, -r*0.16, r*0.68, r*0.3, 0, Math.PI, Math.PI*2);
    g.fill();
    g.fillStyle = '#2a1a08';
    g.beginPath();
    g.ellipse(-r*0.72, r*0.08, r*0.16, r*0.27, -0.2, 0, Math.PI*2);
    g.fill();
    g.beginPath();
    g.ellipse(r*0.72, r*0.08, r*0.16, r*0.27, 0.2, 0, Math.PI*2);
    g.fill();
    g.strokeStyle = '#ffd700';
    g.lineWidth = r*0.13;
    g.beginPath();
    g.moveTo(-r*0.92, r*0.2);
    g.lineTo(r*0.92, r*0.2);
    g.stroke();
  }
  g.restore();

  // face direction offset
  const fx = facing*r*0.18;

  // eyebrows (personality)
  g.strokeStyle = '#5a3a1e';
  g.lineWidth = r*0.06;
  g.lineCap = 'round';
  g.beginPath();
  if (char.id==='potadaldo'){
    g.moveTo(fx-r*0.42,-r*0.34); g.lineTo(fx-r*0.12,-r*0.42);
    g.moveTo(fx+r*0.12,-r*0.42); g.lineTo(fx+r*0.42,-r*0.3);
  } else if (char.id==='mbafry'){
    g.moveTo(fx-r*0.4,-r*0.28); g.lineTo(fx-r*0.1,-r*0.4);
    g.moveTo(fx+r*0.1,-r*0.4); g.lineTo(fx+r*0.4,-r*0.28);
  } else {
    g.moveTo(fx-r*0.4,-r*0.3); g.lineTo(fx-r*0.12,-r*0.34);
    g.moveTo(fx+r*0.12,-r*0.34); g.lineTo(fx+r*0.4,-r*0.3);
  }
  g.stroke();

  // eyes
  [-1,1].forEach(side=>{
    g.fillStyle = '#fff';
    g.beginPath();
    g.ellipse(fx+side*r*0.32, -r*0.08, r*0.17, r*0.2, 0,0,Math.PI*2);
    g.fill();
    g.strokeStyle = '#8a5a2c';
    g.lineWidth = 1.2;
    g.stroke();
    g.fillStyle = '#241a13';
    g.beginPath();
    g.arc(fx+side*r*0.32 + facing*r*0.05, -r*0.06, r*0.085, 0, Math.PI*2);
    g.fill();
  });

  // mouth
  g.strokeStyle = '#6b3f1d';
  g.lineWidth = r*0.06;
  g.beginPath();
  if (isKicking){
    g.ellipse(fx, r*0.18, r*0.14, r*0.1, 0, 0, Math.PI*2);
    g.stroke();
  } else {
    g.arc(fx, r*0.05, r*0.28, 0.15*Math.PI, 0.85*Math.PI);
    g.stroke();
  }

  g.restore();
}

function drawLegs(g, cx, footY, walkPhase, isKicking, facing, r){
  r = r || HEAD_R;
  const hipY = footY - LEG_H;
  const swing = isKicking ? 0 : Math.sin(walkPhase)*10;
  g.strokeStyle = '#5a3a1e';
  g.lineWidth = r*0.22;
  g.lineCap = 'round';

  // back leg
  g.beginPath();
  g.moveTo(cx - r*0.22, hipY + r*0.6);
  g.lineTo(cx - r*0.22 - swing*0.4, footY);
  g.stroke();
  drawFoot(g, cx - r*0.22 - swing*0.4, footY, facing);

  // front leg (kicking leg)
  g.beginPath();
  g.moveTo(cx + r*0.22, hipY + r*0.6);
  if (isKicking){
    g.lineTo(cx + r*0.22 + facing*r*1.1, footY - r*0.3);
  } else {
    g.lineTo(cx + r*0.22 + swing*0.4, footY);
  }
  g.stroke();
  drawFoot(g, isKicking ? cx + r*0.22 + facing*r*1.1 : cx + r*0.22 + swing*0.4, isKicking ? footY - r*0.3 : footY, facing);

  // little arms
  g.lineWidth = r*0.14;
  g.beginPath();
  g.moveTo(cx - r*0.85, footY - LEG_H - r*0.95);
  g.lineTo(cx - r*1.15 + swing*0.2, footY - LEG_H - r*0.6);
  g.stroke();
  g.beginPath();
  g.moveTo(cx + r*0.85, footY - LEG_H - r*0.95);
  g.lineTo(cx + r*1.15 - swing*0.2, footY - LEG_H - r*0.6);
  g.stroke();
}

function drawFoot(g, x, y, facing){
  g.fillStyle = '#2b1c12';
  g.beginPath();
  g.ellipse(x + facing*4, y+3, 11, 6, 0, 0, Math.PI*2);
  g.fill();
}

function drawBall(){
  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.rotate(ball.rot);
  const grad = ctx.createRadialGradient(-5,-6,2,0,0,BALL_R*1.3);
  grad.addColorStop(0,'#f3d8a8');
  grad.addColorStop(0.6,'#dba463');
  grad.addColorStop(1,'#a8753f');
  ctx.beginPath();
  ctx.arc(0,0,BALL_R,0,Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#8a5a2c';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.fillStyle = 'rgba(120,80,40,0.6)';
  [[-5,-3],[4,2],[1,-6],[-3,6]].forEach(p=>{
    ctx.beginPath();
    ctx.ellipse(p[0],p[1],2,1.4,0.5,0,Math.PI*2);
    ctx.fill();
  });
  ctx.restore();
}

/* ============================================================
   PHYSICS / GAME LOGIC
============================================================ */
function headCenter(e){
  return { x: e.x, y: GROUND_Y - LEG_H - HEAD_R - e.jumpY };
}

function resetPositions(){
  player.x = 220; player.jumpY=0; player.vy=0; player.onGround=true; player.facing=1;
  ai.x = 680; ai.jumpY=0; ai.vy=0; ai.onGround=true; ai.facing=-1;
  ball.x = W/2; ball.y = 160; ball.vx = (Math.random()-0.5)*4; ball.vy = 0;
}

function startMatch(){
  score.player = 0; score.ai = 0;
  timeLeft = MATCH_SECONDS;
  resetPositions();
  updateHud();
  document.getElementById('gameOverScreen').classList.add('hidden');
  screenState = 'countdown';
  countdownVal = 3;
  countdownAccum = 0;
  lastTs = null;
  requestAnimationFrame(loop);
}

function updateHud(){
  document.getElementById('scorePlayer').textContent = score.player;
  document.getElementById('scoreAI').textContent = score.ai;
  const s = Math.max(0, Math.ceil(timeLeft));
  const mm = Math.floor(s/60), ss = s%60;
  document.getElementById('timer').textContent = mm+':'+String(ss).padStart(2,'0');
}

function showBanner(text, ms){
  const b = document.getElementById('banner');
  b.innerHTML = '<span>'+text+'</span>';
  setTimeout(()=>{ if(b.querySelector('span') && b.querySelector('span').textContent===text) b.innerHTML=''; }, ms);
}

function tryKick(e, now){
  if (now - e.lastKick < KICK_COOLDOWN) return;
  const hc = headCenter(e);
  const dx = ball.x - hc.x, dy = ball.y - hc.y;
  const dist = Math.hypot(dx,dy);
  if (dist < KICK_RANGE){
    e.lastKick = now;
    const airborne = !e.onGround;
    const kp = (e.side==='player'?playerChar:aiChar).kickPower;
    ball.vx = e.attackDir*kp*(0.85+Math.random()*0.35) + e.vx*0.2;
    ball.vy = -(11 + (airborne?5.5:0) + Math.random()*2.5);
    ball.x += e.attackDir*8;
    e.kicking = true;
    e.kickTimer = 160;
  }
}

function circleResolve(e){
  const hc = headCenter(e);
  const dx = ball.x - hc.x, dy = ball.y - hc.y;
  const dist = Math.hypot(dx,dy);
  const minDist = BALL_R + HEAD_R;
  if (dist < minDist && dist > 0.01){
    const nx = dx/dist, ny = dy/dist;
    const overlap = minDist - dist;
    ball.x += nx*overlap;
    ball.y += ny*overlap;
    const speed = Math.max(Math.hypot(ball.vx,ball.vy), 6);
    ball.vx = nx*speed*0.85 + e.vx*0.35;
    ball.vy = ny*speed*0.85 - 1.5;
  }
}

function updatePlayer(dt){
  const p = player;
  p.vx = 0;
  if (keys.left){ p.vx = -playerChar.speed; p.facing = -1; }
  if (keys.right){ p.vx = playerChar.speed; p.facing = 1; }
  p.x += p.vx*dt;
  p.x = Math.max(40, Math.min(W-40, p.x));

  if (keys.jump && p.onGround){
    p.vy = -playerChar.jump;
    p.onGround = false;
  }
  if (!p.onGround){
    p.vy += GRAVITY*dt;
    p.jumpY -= p.vy*dt;
    if (p.jumpY <= 0){ p.jumpY = 0; p.vy = 0; p.onGround = true; }
  }
  if (keys.kick) tryKick(p, performance.now());
  if (p.kickTimer>0){ p.kickTimer -= dt*16.6; if (p.kickTimer<=0) p.kicking=false; }
}

function updateAI(dt, now){
  const e = ai;
  e.aiNextThink -= dt*16.6;
  if (e.aiNextThink <= 0){
    e.aiNextThink = 130 + Math.random()*90;
    e.aiTargetX = ball.x + (Math.random()-0.5)*26;
    e.aiTargetX = Math.max(60, Math.min(W-60, e.aiTargetX));
  }
  const diff = e.aiTargetX - e.x;
  if (Math.abs(diff) > 6){
    e.vx = Math.sign(diff)*aiChar.speed;
    e.facing = Math.sign(diff);
  } else {
    e.vx = 0;
  }
  e.x += e.vx*dt;
  e.x = Math.max(40, Math.min(W-40, e.x));

  const hc = headCenter(e);
  const ballAbove = ball.y < hc.y - 6;
  const closeX = Math.abs(ball.x - e.x) < 64;
  if (e.onGround && ballAbove && closeX && Math.random()<0.18){
    e.vy = -aiChar.jump;
    e.onGround = false;
  }
  if (!e.onGround){
    e.vy += GRAVITY*dt;
    e.jumpY -= e.vy*dt;
    if (e.jumpY <= 0){ e.jumpY = 0; e.vy = 0; e.onGround = true; }
  }

  e.facing = ball.x > e.x ? 1 : -1;
  tryKick(e, now);
  if (e.kickTimer>0){ e.kickTimer -= dt*16.6; if (e.kickTimer<=0) e.kicking=false; }
}

function goalScored(who){
  if (who==='player'){ score.player++; }
  else { score.ai++; }
  updateHud();
  showBanner(who==='player' ? (playerChar.name+' SCORES! \u26BD') : (aiChar.name+' SCORES! \u26BD'), 1300);
  screenState = 'celebrating';
  celebrationTimer = 1400;
}

function updateBall(dt){
  ball.vy += GRAVITY*dt;
  ball.x += ball.vx*dt;
  ball.y += ball.vy*dt;
  ball.rot += ball.vx*0.04*dt;

  // ground
  if (ball.y + BALL_R >= GROUND_Y){
    ball.y = GROUND_Y - BALL_R;
    ball.vy = -ball.vy*0.6;
    ball.vx *= 0.985;
    if (Math.abs(ball.vy) < 1.4) ball.vy = 0;
  }
  // ceiling
  if (ball.y - BALL_R < 0){
    ball.y = BALL_R;
    ball.vy = -ball.vy*0.55;
  }
  ball.vx *= 0.998;

  // left goal / post
  if (ball.x - BALL_R < LEFT_POST_X){
    const inOpening = ball.y + BALL_R > CROSSBAR_Y;
    if (inOpening){
      goalScored('ai');
      return;
    } else {
      ball.x = LEFT_POST_X + BALL_R;
      ball.vx = Math.abs(ball.vx)*0.6 + 1;
    }
  }
  // right goal / post
  if (ball.x + BALL_R > RIGHT_POST_X){
    const inOpening = ball.y + BALL_R > CROSSBAR_Y;
    if (inOpening){
      goalScored('player');
      return;
    } else {
      ball.x = RIGHT_POST_X - BALL_R;
      ball.vx = -Math.abs(ball.vx)*0.6 - 1;
    }
  }
}

function endMatch(){
  screenState = 'over';
  const over = document.getElementById('gameOverScreen');
  let resultText, resultColor='var(--gold)';
  if (score.player > score.ai) resultText = playerChar.name+' WINS! \u{1F3C6}';
  else if (score.ai > score.player) resultText = aiChar.name+' WINS! \u{1F3C6}';
  else resultText = "IT'S A MASH... I MEAN A DRAW!";
  over.innerHTML =
    '<h2>'+resultText+'</h2>'+
    '<div class="finalScore">'+score.player+' &nbsp;-&nbsp; '+score.ai+'</div>'+
    '<div class="over-btns">'+
      '<button class="start-btn" id="rematchBtn">REMATCH</button>'+
      '<button class="secondary-btn" id="menuBtn">CHANGE POTATO</button>'+
    '</div>';
  over.classList.remove('hidden');
  document.getElementById('rematchBtn').addEventListener('click', ()=>{
    over.classList.add('hidden');
    startMatch();
  });
  document.getElementById('menuBtn').addEventListener('click', ()=>{
    over.classList.add('hidden');
    document.getElementById('gameScreen').classList.add('hidden');
    document.getElementById('selectScreen').classList.remove('hidden');
    selectedIndex = null;
    startBtn.disabled = true;
    buildCards();
    screenState = 'select';
  });
}

/* ============================================================
   MAIN LOOP
============================================================ */
let playerWalkPhase = 0, aiWalkPhase = 0;

function loop(ts){
  if (lastTs === null) lastTs = ts;
  const realDt = ts - lastTs;
  lastTs = ts;
  const dt = Math.min(realDt, 40) / 16.667; // frame-rate independent scale, clamp spikes

  if (screenState === 'countdown'){
    countdownAccum += realDt;
    const co = document.getElementById('countdownOverlay');
    if (countdownVal > 0){
      co.innerHTML = '<span>'+countdownVal+'</span>';
      if (countdownAccum > 700){ countdownAccum = 0; countdownVal--; }
    } else {
      co.innerHTML = '<span>KICK OFF!</span>';
      setTimeout(()=>{ co.innerHTML=''; }, 500);
      screenState = 'playing';
    }
  } else if (screenState === 'playing'){
    timeLeft -= realDt/1000;
    updateHud();
    if (timeLeft <= 0){
      timeLeft = 0; updateHud();
      render();
      endMatch();
      return;
    }
    updatePlayer(dt);
    updateAI(dt, performance.now());
    updateBall(dt);
    if (screenState === 'playing'){
      circleResolve(player);
      circleResolve(ai);
      if (player.vx !== 0) playerWalkPhase += dt*0.35;
      if (ai.vx !== 0) aiWalkPhase += dt*0.35;
    }
  } else if (screenState === 'celebrating'){
    celebrationTimer -= realDt;
    if (celebrationTimer <= 0){
      resetPositions();
      screenState = 'playing';
    }
  }

  render();
  if (screenState !== 'over'){
    requestAnimationFrame(loop);
  }
}

function render(){
  ctx.clearRect(0,0,W,H);
  drawField();

  shadowAt(player.x, player.jumpY, 36);
  shadowAt(ai.x, ai.jumpY, 36);
  shadowAt(ball.x, GROUND_Y - ball.y, 16);

  drawBall();

  const ph = headCenter(player);
  drawLegs(ctx, player.x, GROUND_Y - player.jumpY, playerWalkPhase, player.kicking, player.facing, HEAD_R);
  drawPotatoCharacter(ctx, playerChar, ph.x, ph.y, player.facing, 0, player.kicking, playerWalkPhase, HEAD_R);

  const ah = headCenter(ai);
  drawLegs(ctx, ai.x, GROUND_Y - ai.jumpY, aiWalkPhase, ai.kicking, ai.facing, HEAD_R);
  drawPotatoCharacter(ctx, aiChar, ah.x, ah.y, ai.facing, 0, ai.kicking, aiWalkPhase, HEAD_R);
}

/* ============================================================
   INPUT
============================================================ */
window.addEventListener('keydown', (e)=>{
  switch(e.key.toLowerCase()){
    case 'a': case 'arrowleft': keys.left = true; e.preventDefault(); break;
    case 'd': case 'arrowright': keys.right = true; e.preventDefault(); break;
    case 'w': case 'arrowup': keys.jump = true; e.preventDefault(); break;
    case 's': case 'arrowdown': keys.kick = true; e.preventDefault(); break;
  }
});
window.addEventListener('keyup', (e)=>{
  switch(e.key.toLowerCase()){
    case 'a': case 'arrowleft': keys.left = false; break;
    case 'd': case 'arrowright': keys.right = false; break;
    case 'w': case 'arrowup': keys.jump = false; break;
    case 's': case 'arrowdown': keys.kick = false; break;
  }
});

function bindTouch(id, prop){
  const el = document.getElementById(id);
  const on = (ev)=>{ ev.preventDefault(); keys[prop] = true; };
  const off = (ev)=>{ ev.preventDefault(); keys[prop] = false; };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off, {passive:false});
  el.addEventListener('touchcancel', off, {passive:false});
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}
bindTouch('btnLeft','left');
bindTouch('btnRight','right');
bindTouch('btnJump','jump');
bindTouch('btnKick','kick');

})();
