<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huss Vallies</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10353a;--deep:#0a2428;--sun:#ffd23a;--coral:#ff6b4a;--mint:#5ef2b0;--sky:#8fd3ff;--glass:rgba(10,36,40,.72)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--deep);font-family:'Baloo 2',system-ui,sans-serif;color:#fff;user-select:none}
#game,#game canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.hidden{display:none!important}
.pill{background:var(--glass);border:2px solid rgba(255,255,255,.16);border-radius:999px;padding:4px 16px;font-weight:700;font-size:18px;display:flex;gap:10px;align-items:center;backdrop-filter:blur(6px)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot.b{background:var(--sky)}.dot.r{background:var(--coral)}.dot.g{background:#aaa}.dot.s{background:var(--mint)}
#top{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
#timer{font-size:26px;min-width:92px;justify-content:center;color:var(--sun)}
#role{position:absolute;top:64px;left:50%;transform:translateX(-50%);font-weight:800;font-size:15px;padding:2px 14px;border-radius:8px}
#role.runner{background:var(--sky);color:var(--ink)}#role.chaser{background:var(--coral);color:#fff}
#banner{position:absolute;top:22%;left:0;right:0;text-align:center;font-size:clamp(28px,6vw,64px);font-weight:800;text-shadow:0 4px 0 rgba(0,0,0,.35);opacity:0;transition:opacity .25s,transform .25s;transform:scale(.9)}
#banner.on{opacity:1;transform:scale(1)}
#toasts{position:absolute;right:18px;top:110px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;font-weight:800;font-size:20px;color:var(--sun)}
#prompt{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);text-align:center;font-weight:700;font-size:20px;text-shadow:0 2px 0 #000}
#pbar{width:200px;height:10px;background:rgba(0,0,0,.5);border-radius:6px;margin:6px auto 0;overflow:hidden}
#pbar i{display:block;height:100%;width:0;background:var(--mint)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(255,40,40,.9));opacity:0;transition:opacity .15s}
#arrowWrap{position:absolute;left:50%;top:50%;width:0;height:0}
#arrow{position:absolute;left:-18px;top:-18px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--coral);text-shadow:0 0 8px #000;transform-origin:50% 50%}
#bottom{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:14px;align-items:flex-end}
.key{position:relative;width:72px;height:72px;border-radius:16px;background:var(--glass);border:3px solid rgba(255,255,255,.25);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;line-height:1}
.key small{font-size:13px;font-weight:700;opacity:.9;margin-top:2px}
.key .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);height:0}
.key .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:var(--sun)}
.key.q{border-color:var(--sun);width:88px;height:88px;font-size:40px}
#cross{background:var(--glass);border-radius:14px;padding:6px 14px;font-weight:700;font-size:16px;text-align:center}
.panel{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;background:linear-gradient(180deg,rgba(10,36,40,.35),rgba(10,36,40,.9));overflow:auto}
h1{margin:0;font-size:clamp(44px,9vw,96px);font-weight:800;line-height:.95;color:var(--sun);text-shadow:0 5px 0 var(--coral),0 10px 24px rgba(0,0,0,.5);letter-spacing:1px;text-align:center}
.sub{max-width:620px;text-align:center;font-size:17px;opacity:.92}
#shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;width:min(920px,100%)}
.card{background:var(--glass);border:3px solid rgba(255,255,255,.14);border-radius:18px;padding:12px;text-align:center}
.card.eq{border-color:var(--mint)}
.card .ic{font-size:38px}.card b{display:block;font-size:19px}.card p{margin:2px 0 8px;font-size:14px;opacity:.85;min-height:36px}
button{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:14px;padding:8px 20px;cursor:pointer;background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #b88f00}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b88f00}
button:disabled{background:#546;color:#aaa;box-shadow:none;cursor:default}
button.big{font-size:30px;padding:10px 46px;background:var(--coral);color:#fff;box-shadow:0 6px 0 #a83a22}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.help{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;font-size:15px;max-width:760px}
.help span b{background:#fff;color:var(--ink);border-radius:6px;padding:0 7px;margin-right:4px}
table{border-collapse:collapse;background:var(--glass);border-radius:14px;overflow:hidden;font-size:17px}
th,td{padding:6px 14px;text-align:center}th{background:rgba(255,255,255,.12)}tr.me td{background:rgba(94,242,176,.25);font-weight:800}
.res{font-size:clamp(28px,5vw,48px);font-weight:800;text-align:center}
@media(max-width:600px){.key{width:56px;height:56px;font-size:22px}.key.q{width:68px;height:68px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

</style>

<body>
<div id="game"></div>
<div id="ui"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>

const ARENA = { halfW: 20, halfL: 60, zone: 9 };

function seeded(s) { return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 4;
  return t;
}
const grassTex = (rx, ry) => canvasTex(128, 256, (g, w, h) => {
  g.fillStyle = '#4ddb55'; g.fillRect(0, 0, w, h / 2);
  g.fillStyle = '#3cc447'; g.fillRect(0, h / 2, w, h / 2);
  for (let i = 0; i < 1200; i++) { g.fillStyle = Math.random() < .5 ? 'rgba(255,255,255,.08)' : 'rgba(0,70,0,.08)'; g.fillRect(Math.random() * w, Math.random() * h, 2, 4); }
}, rx, ry);

/** Builds the valley: striped mown grass, checkered safe zones, rolling hills, fence, chokepoints, crates and gems. */
class Arena {
  constructor(scene) {
    this.scene = scene; this.obstacles = []; this.gems = []; this.clouds = []; this.t = 0;
    const rnd = seeded(42);
    const sky = canvasTex(4, 256, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#2f86ff'); gr.addColorStop(.6, '#8fd3ff'); gr.addColorStop(1, '#fff1c9'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
    sky.wrapS = sky.wrapT = THREE.ClampToEdgeWrapping;
    scene.background = sky; scene.fog = new THREE.Fog(0xd8f0ff, 90, 230);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x6fcf5a, 1.0));
    const sun = this.sun = new THREE.DirectionalLight(0xfff3d0, 1.0);
    sun.position.set(30, 55, -20); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005;
    Object.assign(sun.shadow.camera, { left: -38, right: 38, top: 38, bottom: -38, near: 1, far: 160 });
    scene.add(sun, sun.target);

    const flat = (w, d, mat, y) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
      m.rotation.x = -Math.PI / 2; m.position.y = y; m.receiveShadow = true; scene.add(m); return m;
    };
    flat(ARENA.halfW * 2 + 160, ARENA.halfL * 2 + 160, new THREE.MeshLambertMaterial({ map: grassTex(10, 20), color: 0xa8e0a0 }), 0);
    flat(ARENA.halfW * 2, ARENA.halfL * 2, new THREE.MeshLambertMaterial({ map: grassTex(1, 8) }), 0.02);

    // Safe zones with checkered finish strip on the inner edge
    [[-1, '#2f9bff', false], [1, '#ff9a2a', true]].forEach(([s, col, edgeTop]) => {
      const map = canvasTex(256, 64, (g, w, h) => {
        g.globalAlpha = .6; g.fillStyle = col; g.fillRect(0, 0, w, h); g.globalAlpha = 1;
        const y0 = edgeTop ? 0 : h - 16;
        for (let c = 0; c < 16; c++) { g.fillStyle = c % 2 ? '#fff' : '#222'; g.fillRect(c * 16, y0, 16, 16); }
      });
      const z = flat(ARENA.halfW * 2, ARENA.zone, new THREE.MeshBasicMaterial({ map, transparent: true }), 0.04);
      z.position.z = s * (ARENA.halfL - ARENA.zone / 2); z.receiveShadow = false;
      for (const x of [-ARENA.halfW, ARENA.halfW]) {
        const p = new THREE.Mesh(new THREE.CylinderGeometry(.45, .55, 6, 12), new THREE.MeshLambertMaterial({ color: col }));
        p.position.set(x, 3, s * (ARENA.halfL - ARENA.zone)); p.castShadow = true;
        const ball = new THREE.Mesh(new THREE.SphereGeometry(.75, 14, 10), new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x333333 }));
        ball.position.y = 3.4; p.add(ball); scene.add(p);
      }
    });

    // Rolling hills framing the valley, rounded trees, wooden fence
    for (const s of [-1, 1]) {
      for (let i = 0; i < 9; i++) {
        const r = 13 + rnd() * 6, hill = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(.3 + rnd() * .04, .62, .42 + rnd() * .08) }));
        hill.scale.y = .7; hill.position.set(s * (ARENA.halfW + 8 + r * .6), -r * .1, -80 + i * 20); scene.add(hill);
      }
      for (let k = 0; k < 2; k++) {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(.12, .14, ARENA.halfL * 2), new THREE.MeshLambertMaterial({ color: 0xc58a4a }));
        rail.position.set(s * (ARENA.halfW + .15), .5 + k * .4, 0); scene.add(rail);
      }
      for (let z = -ARENA.halfL; z <= ARENA.halfL; z += 3) {
        const post = new THREE.Mesh(new THREE.BoxGeometry(.25, 1.2, .25), new THREE.MeshLambertMaterial({ color: 0xa86f36 }));
        post.position.set(s * (ARENA.halfW + .15), .6, z); post.castShadow = true; scene.add(post);
      }
    }
    for (let i = 0; i < 36; i++) {
      const s = i % 2 ? 1 : -1, tree = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.3, .42, 2.2, 8), new THREE.MeshLambertMaterial({ color: 0x7a4b25 })); trunk.position.y = 1.1;
      const c1 = new THREE.Mesh(new THREE.SphereGeometry(1.7, 14, 10), new THREE.MeshLambertMaterial({ color: 0x27b85a })); c1.position.y = 3;
      const c2 = new THREE.Mesh(new THREE.SphereGeometry(1.2, 14, 10), new THREE.MeshLambertMaterial({ color: 0x3fd06c })); c2.position.y = 4.4;
      trunk.castShadow = c1.castShadow = c2.castShadow = true; tree.add(trunk, c1, c2);
      tree.position.set(s * (ARENA.halfW + 2.5 + rnd() * 5), 0, -ARENA.halfL + rnd() * ARENA.halfL * 2); scene.add(tree);
    }
    for (let i = 0; i < 9; i++) {
      const cl = new THREE.Group(), m = new THREE.MeshBasicMaterial({ color: 0xffffff });
      for (let k = 0; k < 4; k++) { const b = new THREE.Mesh(new THREE.SphereGeometry(4 + rnd() * 3, 12, 8), m); b.position.set(k * 5 - 8, rnd() * 2, rnd() * 3); b.scale.y = .6; cl.add(b); }
      cl.position.set(-120 + rnd() * 240, 50 + rnd() * 20, -120 + rnd() * 240); scene.add(cl); this.clouds.push(cl);
    }

    // Chokepoints, pillars and vaultable crates
    for (const z of [-22, 22]) { this.addBox(-12.5, z, 15, 2, 4, 0x7f95c9, true); this.addBox(12.5, z, 15, 2, 4, 0x7f95c9, true); }
    this.addBox(-12, 0, 3, 3, 3.5, 0x9a82d8, true); this.addBox(12, 0, 3, 3, 3.5, 0x9a82d8, true);
    let placed = 0;
    while (placed < 18) {
      const x = (rnd() - .5) * 34, z = (rnd() - .5) * 84;
      if ([-22, 22].some(c => Math.abs(z - c) < 4) || Math.abs(z) < 3 || this.obstacles.some(o => x > o.minX - 3 && x < o.maxX + 3 && z > o.minZ - 3 && z < o.maxZ + 3)) continue;
      this.addBox(x, z, 2.2, 2.2, 1.1, 0xffffff, false, 0, 'crate'); placed++;
    }
    this.crateMat = null;

    // Gem pickups
    const cyan = new THREE.MeshLambertMaterial({ color: 0x35e0ff, emissive: 0x108aa8 });
    const gold = new THREE.MeshLambertMaterial({ color: 0xffd23a, emissive: 0x9a6a00 });
    for (let i = 0; i < 30; i++) {
      const big = i < 7, value = big ? 5 : 1;
      const mesh = new THREE.Mesh(new THREE.OctahedronGeometry(big ? .6 : .38), big ? gold : cyan);
      mesh.castShadow = true;
      const g = { mesh, value, active: true, x: (rnd() - .5) * 34, z: (rnd() - .5) * 86, ph: rnd() * 6 };
      mesh.position.set(g.x, 1, g.z); scene.add(mesh); this.gems.push(g);
    }
  }

  /** Axis-aligned box. solid=true can never be vaulted; ttl (seconds) makes it temporary; kind 'crate' gets a wooden look. */
  addBox(x, z, w, d, h, color, solid, ttl = 0, kind = '') {
    if (kind === 'crate' && !this.crateMat) this.crateMat = new THREE.MeshLambertMaterial({ map: canvasTex(128, 128, (g, s) => {
      g.fillStyle = '#f0b258'; g.fillRect(0, 0, s, s);
      g.fillStyle = '#d9983f'; for (let i = 1; i < 4; i++) g.fillRect(0, i * 32 - 2, s, 3);
      g.strokeStyle = '#8a5320'; g.lineWidth = 12; g.strokeRect(6, 6, s - 12, s - 12);
      g.lineWidth = 9; g.beginPath(); g.moveTo(10, 10); g.lineTo(s - 10, s - 10); g.moveTo(s - 10, 10); g.lineTo(10, s - 10); g.stroke();
    }) });
    const mat = kind === 'crate' ? this.crateMat : new THREE.MeshLambertMaterial({ color });
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    mesh.position.set(x, h / 2, z); mesh.castShadow = mesh.receiveShadow = true;
    if (solid && !ttl) { // lighter cap makes walls read as chunky toy blocks
      const cap = new THREE.Mesh(new THREE.BoxGeometry(w + .3, .35, d + .3), new THREE.MeshLambertMaterial({ color: new THREE.Color(color).offsetHSL(0, 0, .15) }));
      cap.position.y = h / 2 + .17; mesh.add(cap);
    }
    this.scene.add(mesh);
    const o = { minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2, h, solid, mesh, expires: ttl ? this.t + ttl : 0 };
    this.obstacles.push(o);
    return o;
  }

  update(dt) {
    this.t += dt;
    for (let i = this.obstacles.length - 1; i >= 0; i--) {
      const o = this.obstacles[i];
      if (o.expires && this.t >= o.expires) { this.scene.remove(o.mesh); this.obstacles.splice(i, 1); }
    }
    for (const g of this.gems) { g.mesh.rotation.y += dt * 2; g.mesh.position.y = 1 + Math.sin(this.t * 3 + g.ph) * .2; }
    for (const c of this.clouds) { c.position.x += dt * 1.5; if (c.position.x > 130) c.position.x = -130; }
  }

  reset() {
    this.obstacles.filter(o => o.expires).forEach(o => this.scene.remove(o.mesh));
    this.obstacles = this.obstacles.filter(o => !o.expires);
    this.gems.forEach(g => { g.active = true; g.mesh.visible = true; });
  }
}


/** Keyboard + mouse state. Mouse look needs pointer lock (click the canvas); arrow keys also turn the camera. */
class Input {
  constructor(dom) {
    this.keys = new Set(); this.pressed = new Set(); this.yaw = 0;
    addEventListener('keydown', e => {
      if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
      if (!e.repeat) this.pressed.add(e.code);
      this.keys.add(e.code);
    });
    addEventListener('keyup', e => this.keys.delete(e.code));
    addEventListener('blur', () => this.keys.clear());
    addEventListener('mousemove', e => { if (document.pointerLockElement === dom) this.yaw -= e.movementX * 0.0028; });
    dom.addEventListener('click', () => dom.requestPointerLock && dom.requestPointerLock());
  }
  has(code) { return this.keys.has(code); }
  consume(code) { return this.pressed.delete(code); }
  tick(dt) { this.yaw += ((this.has('ArrowLeft') ? 1 : 0) - (this.has('ArrowRight') ? 1 : 0)) * 2.2 * dt; }
  endFrame() { this.pressed.clear(); }
}

/** Momentum-based movement, dash, slide, vault and circle-vs-box collision shared by players, bots and decoys. */
class MovementController {
  constructor(arena) { this.arena = arena; }

  speedOf(a) {
    let s = a.isDecoy ? 10.5 : a.team === 'chaser' ? 8.8 : 9.2;
    if (a.boostT > 0) s *= 1.75;
    return s * (a.slow || 1);
  }

  step(a, wish, dt) {
    for (const k of ['dashCd', 'dashT', 'slideT', 'slideCd', 'vaultT', 'boostT', 'lungeT', 'stunT', 'invulnT'])
      if (a[k] > 0) a[k] = Math.max(0, a[k] - dt);
    if (a.stunT > 0 || a.team === 'downed' || a.escaped) wish = { x: 0, z: 0 };
    const sp = this.speedOf(a);
    if (!(a.dashT > 0 || a.lungeT > 0)) {
      // Slight glide: velocity eases toward the wanted direction, so sharp turns slide (low grip while sliding).
      const k = 1 - Math.exp(-(a.slideT > 0 ? 1.4 : 7) * dt);
      a.vel.x += (wish.x * sp - a.vel.x) * k;
      a.vel.z += (wish.z * sp - a.vel.z) * k;
    }
    a.x += a.vel.x * dt; a.z += a.vel.z * dt;
    if (a.y > 0 || a.yv > 0) { a.yv -= 26 * dt; a.y += a.yv * dt; if (a.y <= 0) { a.y = 0; a.yv = 0; } }
    this.collide(a);
    a.x = Math.max(-ARENA.halfW + .6, Math.min(ARENA.halfW - .6, a.x));
    a.z = Math.max(-ARENA.halfL + .6, Math.min(ARENA.halfL - .6, a.z));
    a.speed = Math.hypot(a.vel.x, a.vel.z);
    if (a.speed > 0.6) a.heading = Math.atan2(a.vel.x, a.vel.z);
  }

  /** Spacebar: burst in the held direction (2.5s cooldown). */
  dash(a, d) {
    if (a.dashCd > 0 || a.vaultT > 0 || a.stunT > 0 || a.team === 'downed') return false;
    a.vel.x = d.x * 25; a.vel.z = d.z * 25; a.dashT = 0.2; a.dashCd = 2.5;
    return true;
  }

  /** Spacebar near a low obstacle: smooth hop over it. */
  tryVault(a, d) {
    if (a.y > 0 || a.vaultT > 0 || a.slideT > 0 || a.stunT > 0 || a.team === 'downed' || (!d.x && !d.z)) return false;
    const px = a.x + d.x * 1.3, pz = a.z + d.z * 1.3;
    for (const o of this.arena.obstacles) {
      if (!o.solid && px > o.minX - .5 && px < o.maxX + .5 && pz > o.minZ - .5 && pz < o.maxZ + .5) {
        a.vaultT = 0.7; a.yv = 8.5; a.vel.x = d.x * 10.5; a.vel.z = d.z * 10.5;
        return true;
      }
    }
    return false;
  }

  /** C: low, low-grip slide. */
  slide(a, d) {
    if (a.slideT > 0 || a.slideCd > 0 || a.y > 0 || a.stunT > 0 || a.team === 'downed') return false;
    const s = this.speedOf(a) * 1.4;
    a.vel.x = d.x * s; a.vel.z = d.z * s; a.slideT = 0.65; a.slideCd = 1;
    return true;
  }

  collide(a) {
    const r = 0.5;
    for (const o of this.arena.obstacles) {
      if (!o.solid && (a.vaultT > 0 || a.y > o.h - 0.2)) continue;
      const cx = Math.max(o.minX, Math.min(a.x, o.maxX)), cz = Math.max(o.minZ, Math.min(a.z, o.maxZ));
      const dx = a.x - cx, dz = a.z - cz, d2 = dx * dx + dz * dz;
      if (d2 >= r * r) continue;
      let nx = 0, nz = 0, push;
      if (d2 > 1e-6) { const d = Math.sqrt(d2); nx = dx / d; nz = dz / d; push = r - d; }
      else {
        const l = a.x - o.minX, rt = o.maxX - a.x, t = a.z - o.minZ, b = o.maxZ - a.z, m = Math.min(l, rt, t, b);
        if (m === l) nx = -1; else if (m === rt) nx = 1; else if (m === t) nz = -1; else nz = 1;
        push = m + r;
      }
      a.x += nx * push; a.z += nz * push;
      const vn = a.vel.x * nx + a.vel.z * nz;
      if (vn < 0) { a.vel.x -= vn * nx; a.vel.z -= vn * nz; }
    }
  }
}

const ABILITIES = {
  cloak: { name: 'Invisibility Cloak', icon: '👻', cd: 12, price: 80, desc: '90% transparent for 2.5s. Chasers lose you.' },
  door:  { name: 'Pocket Door Slam', icon: '🚪', cd: 10, price: 100, desc: 'Drops a solid door behind you for 6s.' },
  decoy: { name: 'Decoy', icon: '🧍', cd: 14, price: 140, desc: 'A clone sprints ahead to bait Chasers.' },

/** Q-key active abilities. Chasers always use Lunge; Runners use whatever they equipped. */
class AbilitySystem {
  constructor(game) { this.game = game; }

  idFor(a) { return a.team === 'chaser' ? 'lunge' : a.ability; }

  ready(a) {
    const id = this.idFor(a);
    return !!ABILITIES[id] && a.abCd <= 0 && a.stunT <= 0 && a.team !== 'downed' && !a.escaped && !a.isDecoy;
  }

  use(a) {
    if (!this.ready(a)) return false;
    const g = this.game, id = this.idFor(a), f = { x: Math.sin(a.heading), z: Math.cos(a.heading) };
    switch (id) {
      case 'cloak': a.invisT = 2.5; break;
      case 'boots': a.boostT = 3; g.dust(a, 12); break;
      case 'door': {
        const horiz = Math.abs(f.x) > Math.abs(f.z);
        g.arena.addBox(a.x - f.x * 2.4, a.z - f.z * 2.4, horiz ? .6 : 4.2, horiz ? 4.2 : .6, 3, 0x8a5a2b, true, 6);
        break;
      }
      case 'decoy': g.spawnDecoy(a); break;
      case 'lunge':
        a.lungeT = 0.35; a.lungeActive = true; a.lungeHit = false;
        a.vel.x = f.x * 21; a.vel.z = f.z * 21; g.dust(a, 10);
        break;
    }
    a.abCd = ABILITIES[id].cd;
    g.ui.sfx(id === 'lunge' ? 'dash' : 'ability');
    return true;
  }

  tick(a, dt) {
    a.abCd = Math.max(0, a.abCd - dt);
    a.invisT = Math.max(0, a.invisT - dt);
  }
}

  constructor() { this.c = null; }

      case 'slide': t(260, .3, 'sawtooth', .07, 90); break;

      case 'ability': t(220, .35, 'sine', .14, 880); break;
      case 'convert': t(200, .5, 'sawtooth', .13, 60); break;

        this.actors.forEach(a => { if (a.team === 'chaser') a.stunT = 1.5; });
      }
    } else this.timeLeft -= dt;
    const live = this.state === 'playing';

    for (const a of this.actors) {
      this.abilities.tick(a, dt);
      if (a.isDecoy) { this.updateDecoy(a, dt); continue; }
      if (a.escaped) { this.syncMesh(a); continue; }
      let wish = v(0, 0);
      if (live) wish = a.isPlayer ? this.playerWish(a) : this.ai(a, dt);
      if (a.team === 'downed' && live) { a.downT -= dt; if (a.downT <= 0) this.convert(a); }
      this.move.step(a, wish, dt);
      if (a.dashT > 0 || a.slideT > 0) this.dust(a, 2); else if (a.boostT > 0 && Math.random() < .5) this.dust(a, 1);
      if (a.lungeActive && a.lungeT <= 0) { a.lungeActive = false; if (!a.lungeHit) a.stunT = 1.1; }
      this.syncMesh(a);
    }
    if (live) { this.interactions(dt); this.checkEnd(); }
    if (this.actors.some(a => a.dead)) this.actors = this.actors.filter(a => !a.dead);
    this.updateCamera(dt); this.updateHud(); this.input.endFrame();
  }

  playerWish(a) {
    const i = this.input, y = i.yaw, f = v(Math.sin(y), Math.cos(y)), r = v(-f.z, f.x);
    const fw = (i.has('KeyW') ? 1 : 0) - (i.has('KeyS') ? 1 : 0), rt = (i.has('KeyD') ? 1 : 0) - (i.has('KeyA') ? 1 : 0);
    const w = norm(f.x * fw + r.x * rt, f.z * fw + r.z * rt);
    if (a.team === 'downed') return v(0, 0);
    const dir = (w.x || w.z) ? w : v(Math.sin(a.heading), Math.cos(a.heading));
    if (i.consume('Space')) {
      if (this.move.tryVault(a, dir)) this.ui.sfx('vault');
      else if (this.move.dash(a, dir)) { this.ui.sfx('dash'); this.dust(a, 14); }
    }
    if (i.consume('KeyC') && this.move.slide(a, dir)) this.ui.sfx('slide');
    if (i.consume('KeyQ')) this.abilities.use(a);
    return w;
  }

  updateDecoy(d, dt) {
    d.life -= dt;
    if (d.life <= 0) { d.dead = true; this.scene.remove(d.grp); return; }
    this.move.tryVault(d, d.dir);
    this.move.step(d, d.dir, dt); this.syncMesh(d);
  }

  // ---------- bot AI ----------
  ai(a, dt) {
    const ai = a.ai; ai.t -= dt;
    if (ai.t <= 0) { ai.t = .4 + Math.random() * .6; ai.jit = (Math.random() - .5) * .9; }
    if (a.team === 'downed') return v(0, 0);
    if (a.team === 'chaser') {
      let best = null, bd = 1e9;
      for (const r of this.actors) {
        if (!((r.team === 'runner' && !r.escaped) || (r.isDecoy && r.life > 0))) continue;
        const d = dist(a, r);
        if (r.invisT > 0 && d > 3) continue;
        if (d < bd) { bd = d; best = r; }
      }
      if (!best) return v(0, 0);
      const lead = Math.min(.35, bd / 30);
      let w = norm(best.x + best.vel.x * lead - a.x, best.z + best.vel.z * lead - a.z);
      w = norm(w.x - w.z * ai.jit * .15, w.z + w.x * ai.jit * .15);
      if (bd < 4.2 && bd > 1.5) this.abilities.use(a);
      if (bd > 4 && bd < 10 && a.dashCd <= 0 && Math.random() < .02 && this.move.dash(a, w)) this.dust(a, 8);
      this.move.tryVault(a, w);
      return w;
    }
    // Runner bot: head for the goal via the chokepoint gaps, flee chasers, dodge with dash/abilities, revive when safe
    const goalZ = a.crossings % 2 === 0 ? ARENA.halfL - 3 : -(ARENA.halfL - 3), dirZ = Math.sign(goalZ - a.z);
    const nearGate = [-22, 22].some(c => Math.sign(c - a.z) === dirZ && Math.abs(c - a.z) < 14);
    let w = norm((nearGate ? 0 : a.x + ai.jit * 4) - a.x, dirZ * 8);
    let ax = 0, az = 0, near = 1e9;
    for (const c of this.actors) {
      if (c.team !== 'chaser') continue;
      const dx = a.x - c.x, dz = a.z - c.z, d = Math.hypot(dx, dz);
      near = Math.min(near, d);
      if (d < 13) { const k = (1 - d / 13) * 3 / Math.max(d, .5); ax += dx * k; az += dz * k; }
    }
    w = norm(w.x + ax, w.z + az);
    if (near < 4 && this.move.dash(a, w)) this.dust(a, 10);
    if (near < 6) this.abilities.use(a);
    this.move.tryVault(a, w);
    a.reviveGoal = false;
    if (near > 12) {
      const d = this.actors.find(o => o.team === 'downed' && dist(o, a) < 18);
      if (d) { if (dist(d, a) < 2.2) { a.reviveGoal = true; return v(0, 0); } return norm(d.x - a.x, d.z - a.z); }
    }
    return w;
  }

  // ---------- rules ----------
  interactions(dt) {
    const A = this.actors.filter(a => !a.isDecoy);
    const chasers = A.filter(a => a.team === 'chaser');
    const runners = A.filter(a => a.team === 'runner' && !a.escaped);
    const downed = A.filter(a => a.team === 'downed');

    for (const c of chasers) {
      if (c.stunT > 0 && !c.lungeActive) continue;
      const R = c.lungeActive ? 1.8 : 1.15;
      for (const r of runners) {
        if (r.team === 'runner' && r.invulnT <= 0 && dist(r, c) < R && Math.abs(r.y - c.y) < 1.2) this.down(r, c);
      }
      for (const d of this.actors) if (d.isDecoy && d.life > 0 && dist(d, c) < R) { d.life = 0; c.lungeHit = true; this.ui.sfx('pop'); }
    }

    for (const r of runners) {
      r.slow = 1;
      if (r.team !== 'runner') continue;
      const want = r.isPlayer ? this.input.has('KeyF') : r.reviveGoal;
      const tgt = downed.find(d => d.team === 'downed' && dist(d, r) < 2.3);
      if (tgt && want) {
        r.slow = .4; tgt.reviveP += dt / 1.5; tgt.beingRevived = true;
        if (tgt.reviveP >= 1) {
          tgt.team = 'runner'; tgt.downT = 0; tgt.reviveP = 0; tgt.invulnT = 1.5; this.recolor(tgt);
          r.revives++; r.coins += 15; this.ui.sfx('revive');
          if (r.isPlayer) this.ui.toast('+15 revive'); else if (tgt.isPlayer) this.ui.announce('Revived! Run!', 1200);
        }
      }
      for (const g of this.arena.gems) {
        if (g.active && Math.hypot(g.x - r.x, g.z - r.z) < 1.3) {
          g.active = false; g.mesh.visible = false; r.gems += g.value; r.coins += g.value;
          if (r.isPlayer) { this.ui.sfx('gem'); this.ui.toast(`+${g.value} 💎`); }
        }
      }
      const toB = r.crossings % 2 === 0;
      if (toB ? r.z >= ARENA.halfL - ARENA.zone : r.z <= -(ARENA.halfL - ARENA.zone)) this.crossed(r);
    }
    for (const d of downed) { if (!d.beingRevived) d.reviveP = Math.max(0, d.reviveP - dt * .5); d.beingRevived = false; }
  }

  down(r, c) {
    r.team = 'downed'; r.downT = DOWN_TIME; r.reviveP = 0; r.vel = v(0, 0); r.dashT = r.slideT = r.boostT = 0; this.recolor(r);
    c.tags++; c.coins += 10; c.lungeHit = true; if (!c.lungeActive) c.stunT = .4;
    this.ui.sfx('tag'); this.dust(r, 10);
    if (r.isPlayer) this.ui.announce('DOWNED! Wait for a revive', 1800);
  }

  convert(a) {
    a.team = 'chaser'; a.stunT = 1; a.hero = false; this.recolor(a); this.ui.sfx('convert');
    if (a.isPlayer) this.ui.announce('You are a CHASER! Q = Lunge', 2200);
  }

  crossed(r) {
    r.crossings++; r.coins += 10;
    if (r.isPlayer) { this.ui.sfx('cross'); this.ui.toast('+10 crossing'); if (r.crossings < WIN_CROSS) this.ui.announce(`Crossing ${r.crossings}/${WIN_CROSS}`, 1200); }
    if (r.crossings >= WIN_CROSS) {
      r.escaped = true; r.vel = v(0, 0);
      if (r.hero) this.heroDone = true;
      if (r.isPlayer) this.ui.announce('SAFE! 🎉', 2000);
    }
  }

  recolor(a) { const [c1, c2] = this.pair(a); a.jer.map = this.jersey(c1, c2); a.jer.needsUpdate = true; }

  checkEnd() {
    const A = this.actors.filter(a => !a.isDecoy);
    const act = A.filter(a => a.team === 'runner' && !a.escaped).length, dn = A.filter(a => a.team === 'downed').length, esc = A.filter(a => a.escaped).length;
    if (this.heroDone) return this.end(true, 'The Hero made it across! Every active Runner wins!');
    if (act === 0 && dn === 0) return this.end(esc > 0, esc > 0 ? 'Every remaining Runner reached safety!' : 'Every Runner was turned into a Chaser!');
    if (this.timeLeft <= 0) this.end(false, "Time's up. Chasers win!");
  }

  end(runnersWin, msg) {
    this.state = 'results'; document.exitPointerLock && document.exitPointerLock();
    const p = this.player, A = this.actors.filter(a => !a.isDecoy);
    const won = p.team === 'chaser' ? !runnersWin : runnersWin && p.team === 'runner';
    const bonus = won ? 25 : 5, earned = p.coins + bonus;
    this.ui.save.coins += earned; this.ui.persist();
    const rows = A.map(a => ({ name: a.name, you: a.isPlayer, role: a.team === 'chaser' ? 'Chaser' : a.escaped ? 'Safe' : 'Runner', tags: a.tags, revives: a.revives,
      crossings: a.crossings, gems: a.gems, score: a.tags * 10 + a.revives * 15 + a.crossings * 10 + a.gems })).sort((x, y) => y.score - x.score);
    this.ui.showResults(rows, msg, { won, earned, coins: p.coins, bonus });
  }

  // ---------- presentation ----------
  syncMesh(a) {
    const down = a.team === 'downed', k = down ? 0 : Math.min(1, a.speed / 8), air = a.y > .1;
    a.phase += a.speed * this.dt * .9;
    const sw = Math.sin(a.phase) * k * .95;
    a.legL.rotation.x = air ? -.9 : sw; a.legR.rotation.x = air ? .5 : -sw;
    a.armL.rotation.x = air ? -2.4 : -sw; a.armR.rotation.x = air ? -2.4 : sw;
    a.grp.position.set(a.x, a.y, a.z); a.grp.rotation.y = a.heading;
    a.body.rotation.x = down ? -1.45 : a.slideT > 0 ? -.9 : k * .12;
    a.body.position.y = (down ? .4 : a.slideT > 0 ? -.3 : 0) + Math.abs(Math.sin(a.phase)) * .1 * k;
    const op = a.isDecoy ? .7 : a.invisT > 0 ? .1 : a.escaped ? .45 : down ? .85 : 1;
    for (const m of a.mats) m.opacity = op;
    a.blob.visible = a.invisT <= 0; a.blob.position.y = .05 - a.y; a.blob.scale.setScalar(Math.max(.4, 1 - a.y * .2));
    a.aura.visible = a.hero && a.team === 'runner';
    if (a.aura.visible) { const s = 1.1 + Math.sin(this.t * 4) * .12; a.aura.scale.set(s, s, s); a.aura.rotation.z = this.t; }
  }

  updateCamera(dt) {
    const p = this.player, y = this.input.yaw, fx = Math.sin(y), fz = Math.cos(y), k = Math.min(1, dt * 10), c = this.camera.position;
    c.x += (p.x - fx * 7.5 - c.x) * k; c.y += (p.y + 4.6 - c.y) * k; c.z += (p.z - fz * 7.5 - c.z) * k;
    this.camera.lookAt(p.x + fx * 3, p.y + 1.4, p.z + fz * 3);
    this.arena.sun.position.set(p.x + 30, 55, p.z - 20); this.arena.sun.target.position.set(p.x, 0, p.z);
  }

  orbit(dt) {
    this.orbitA += dt * .12;
    this.camera.position.set(Math.sin(this.orbitA) * 75, 38, Math.cos(this.orbitA) * 75);
    this.camera.lookAt(0, 0, 0);
  }

  updateHud() {
    const p = this.player, A = this.actors.filter(a => !a.isDecoy);
    const id = this.abilities.idFor(p);
    let threat = null, prompt = null;
    if (p.team === 'runner' && !p.escaped) {
      let best = null, bd = 28;
      for (const c of A) if (c.team === 'chaser') { const d = dist(c, p); if (d < bd) { bd = d; best = c; } }
      if (best) {
        const y = this.input.yaw, f = v(Math.sin(y), Math.cos(y)), r = v(-f.z, f.x), dx = best.x - p.x, dz = best.z - p.z;
        threat = { angle: Math.atan2(dx * r.x + dz * r.z, dx * f.x + dz * f.z), k: 1 - bd / 28 };
      }
      const d = A.find(o => o.team === 'downed' && dist(o, p) < 2.3);
      if (d) prompt = { text: 'Hold F to revive', p: d.reviveP };
    } else if (p.team === 'downed') prompt = { text: `Downed! You turn in ${Math.ceil(p.downT)}s unless a teammate revives you`, p: p.reviveP };
    else if (p.escaped) prompt = { text: 'Safe! Watch your team finish.' };
    this.ui.updateHud({
      time: Math.max(0, this.timeLeft), run: A.filter(a => a.team === 'runner' && !a.escaped).length, ch: A.filter(a => a.team === 'chaser').length,
      dn: A.filter(a => a.team === 'downed').length, esc: A.filter(a => a.escaped).length, coins: p.coins,
      role: p.team === 'chaser' ? 'CHASER' : 'RUNNER', hero: p.hero && p.team === 'runner', crossings: p.crossings,
      ability: id, abCd: p.abCd, dashCd: p.dashCd, slideCd: p.slideCd, threat, prompt
    });
  }
}





const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 400);
const resize = () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
};
addEventListener('resize', resize);
resize();

const input = new Input(renderer.domElement);
const ui = new UIController(document.getElementById('ui'));
const game = new GameManager(scene, camera, input, ui);

let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  game.update(dt);
  renderer.render(scene, camera);
});

</script>
</body>
</html>
