<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Panda Fight 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text;font:inherit}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1410;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
#flash{position:fixed;inset:0;z-index:12;pointer-events:none;opacity:0;background:#fff;transition:opacity .35s}
#ftl{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.ft{position:fixed;transform:translate(-50%,-50%);font-weight:900;font-size:24px;text-shadow:0 2px 0 #000,0 0 8px #000;white-space:nowrap}
.ft.dmgE{color:#fff}.ft.dmgP{color:#ff5a5a}.ft.crit{color:#ffe14d;font-size:32px}.ft.blk{color:#7fd0ff}.ft.par{color:#ffd24a;font-size:30px}.ft.dod{color:#7dff9a}.ft.brk{color:#ff9d3d;font-size:28px}
/* HUD */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
.bars{position:absolute;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;align-items:flex-start}
.bar{flex:1;min-width:0}
.bar.right{text-align:right}
.nm{font-weight:900;font-size:15px;text-shadow:0 2px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{opacity:.85;font-size:11px;margin-left:5px}
.hp{position:relative;height:22px;background:#0009;border:2px solid #000;border-radius:12px;overflow:hidden;margin-top:2px}
.hp .lag{position:absolute;left:0;top:0;bottom:0;background:#ff4d4d;transition:width .6s .35s}
.hp .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#7dff6a,#2fbf3a);transition:width .08s}
.bar.right .hp .lag,.bar.right .hp .fill{left:auto;right:0}
.bar.right .hp .fill{background:linear-gradient(#ffb36a,#e0501b)}
.hpn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;text-shadow:0 1px 0 #000}
.gd{height:6px;background:#0008;border-radius:4px;margin-top:3px;overflow:hidden}
.gd div{height:100%;background:#5cc8ff;width:100%}
.mid{width:92px;text-align:center;flex:none}
.gd.st div{background:#ffd24a}
.foe{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:11px;font-weight:800;margin-bottom:3px;text-shadow:0 1px 0 #000}
.foe .mh{width:64px;height:9px;background:#0009;border:1px solid #000;border-radius:5px;overflow:hidden;flex:none}
.foe .mh i{display:block;height:100%;background:linear-gradient(#ffb36a,#e0501b)}
.foe.dead{opacity:.35;text-decoration:line-through}
.foe.solo{display:block;font-size:15px;font-weight:900}
.foe.solo .mh{width:100%;height:22px;border:2px solid #000;border-radius:12px;margin-top:2px}
#alive{font-size:12px;font-weight:900;text-shadow:0 1px 0 #000}
#radar{position:absolute;left:50%;transform:translateX(-50%);bottom:34px;width:88px;height:88px;border-radius:50%;background:#0007;display:none}
@media (pointer:coarse){#radar{bottom:14px}}
#timer{font-size:28px;font-weight:900;text-shadow:0 2px 0 #000;line-height:1}
#wlabel{font-size:11px;font-weight:800;opacity:.95;text-shadow:0 1px 0 #000;margin-bottom:2px;white-space:nowrap}
#dmgtaken{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 74px);left:12px;font-size:13px;font-weight:800;text-shadow:0 1px 0 #000;opacity:.95}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:clamp(44px,12vw,110px);font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 5px 0 #b45309,0 0 30px #000;opacity:0;transform:scale(.6)}
#banner.show{animation:bn .9s ease-out forwards}
@keyframes bn{0%{opacity:0;transform:scale(2)}18%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
#banner.show.hold{animation:bn2 .3s ease-out forwards}
@keyframes bn2{0%{opacity:0;transform:scale(2)}100%{opacity:1;transform:scale(1)}}
#pauseBtn{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 58px);right:12px;pointer-events:auto;background:#0007;color:#fff;border:2px solid #fff6;border-radius:10px;font-size:16px;font-weight:900;padding:4px 10px}
#keys{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;opacity:.75;text-shadow:0 1px 0 #000}
#joyZone{position:absolute;left:0;bottom:0;width:52%;height:62%;pointer-events:auto;touch-action:none}
#joy{position:absolute;width:110px;height:110px;border-radius:50%;background:#fff2;border:3px solid #fff5;display:none}
#knob{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:#fffc}
#btns{position:absolute;right:14px;bottom:max(18px,env(safe-area-inset-bottom));width:210px;height:190px;pointer-events:none}
#btns button{position:absolute;pointer-events:auto;touch-action:none;border:3px solid #fff8;border-radius:50%;color:#fff;font-size:30px;background:#0007}
#bAtk{right:0;bottom:0;width:100px;height:100px;background:#d93b2b!important;font-size:44px!important}
#bBlk{right:112px;bottom:10px;width:74px;height:74px;background:#2d7dd2!important}
#bDash{right:60px;bottom:112px;width:70px;height:70px;background:#16a085!important}
#bBlk.on,#bAtk.on{filter:brightness(1.4)}
@media (pointer:fine){#joyZone,#btns{display:none}}
@media (pointer:coarse){#keys{display:none}}
/* UI screens */
#ui{position:fixed;inset:0;z-index:20;pointer-events:none}
#ui>.scr{position:absolute;inset:0;pointer-events:auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:max(10px,env(safe-area-inset-top)) 12px 18px}
.scr.solid{background:linear-gradient(#10261cf2,#07120dfa)}
.scr.dark{background:#000a}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;position:sticky;top:0;z-index:3;padding:4px 0}
.ttl{font-size:22px;font-weight:900;flex:1;text-align:center;text-shadow:0 2px 0 #000}
.coins{background:#0008;border:2px solid #f5c542;border-radius:20px;padding:5px 12px;font-weight:900;color:#ffe08a;white-space:nowrap}
.btn{background:linear-gradient(#ffd24a,#f59e0b);color:#2b1a00;border:0;border-radius:14px;padding:12px 22px;font-weight:900;font-size:18px;box-shadow:0 5px 0 #a15f00,0 8px 16px #0006;cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a15f00}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px;box-shadow:0 3px 0 #a15f00}
.btn.alt{background:linear-gradient(#6fd0ff,#2f8fe0);color:#06223b;box-shadow:0 5px 0 #1a5a96,0 8px 16px #0006}
.btn.alt.sm{box-shadow:0 3px 0 #1a5a96}
.btn.grn{background:linear-gradient(#8dff7a,#2fbf3a);color:#052b0a;box-shadow:0 5px 0 #17782a,0 8px 16px #0006}
.btn.dim{filter:grayscale(.9) brightness(.7)}
.btn.big{font-size:30px;padding:16px 56px;border-radius:20px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.menu{min-height:100%;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center}
.logo{font-size:clamp(34px,9vw,64px);font-weight:900;color:#fff;text-shadow:0 5px 0 #14532d,0 0 24px #000;letter-spacing:1px;margin-top:10px}
.logo span{color:#ffd24a;text-shadow:0 5px 0 #a15f00,0 0 24px #000}
.tag{font-weight:800;opacity:.9;text-shadow:0 2px 0 #000}
.menuBot{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:460px}
.eqname{background:#0009;border-radius:14px;padding:8px 16px;font-weight:800}
.stats{font-size:14px;font-weight:800;background:#0008;border-radius:12px;padding:6px 14px}
.panel{background:#0e2419ee;border:2px solid #2e6b4a;border-radius:18px;padding:16px;max-width:620px;margin:10px auto}
.panel h2,.panel h3{margin:0 0 8px}
.panel p,.panel li{line-height:1.45;margin:6px 0}
/* worlds */
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;max-width:900px;margin:0 auto}
.wc{border-radius:18px;padding:14px;border:3px solid #fff4;cursor:pointer;position:relative;overflow:hidden;min-height:120px}
.wc.lock{filter:grayscale(1) brightness(.55);cursor:default}
.wc h3{margin:0;font-size:22px;text-shadow:0 2px 0 #0008}
.wc .el{font-weight:800;opacity:.95}
.pips{display:flex;gap:6px;margin:10px 0 6px}
.pip{width:22px;height:22px;border-radius:50%;background:#0006;border:2px solid #fff7;display:flex;align-items:center;justify-content:center;font-size:12px}
.pip.on{background:#ffe14d;border-color:#fff}
.pip.boss{border-color:#ff5a5a;border-radius:6px}
.wc .big{position:absolute;right:10px;top:4px;font-size:54px;opacity:.9}
.wc .st{font-weight:800;font-size:14px}
.eqbar{display:flex;align-items:center;gap:12px;background:#0009;border-radius:16px;padding:8px 14px;max-width:520px;margin:0 auto 12px}
.eqbar img{width:64px;height:72px;object-fit:contain}
.eqbar div{flex:1}
/* cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;max-width:980px;margin:0 auto}
.card{position:relative;background:linear-gradient(#22344a,#111a28);border:3px solid var(--rc,#888);border-radius:14px;padding:6px 4px 6px;text-align:center;cursor:pointer;box-shadow:0 0 12px color-mix(in srgb,var(--rc) 45%,transparent)}
.card img{width:100%;height:104px;object-fit:contain;display:block}
.card img.sil{filter:brightness(0) opacity(.45)}
.card .rn{font-size:10px;font-weight:900;color:var(--rc);text-transform:uppercase;letter-spacing:.5px}
.card .cn{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cw{font-size:11px;opacity:.85}
.card .cnt{position:absolute;right:5px;top:4px;background:#000a;border-radius:8px;padding:1px 6px;font-size:11px;font-weight:900}
.card .eqd{position:absolute;left:4px;top:4px;background:#2fbf3a;color:#021;border-radius:8px;padding:1px 6px;font-size:10px;font-weight:900}
.card.selc{outline:3px solid #fff;outline-offset:2px}
.card.r7{border-color:transparent;background:linear-gradient(#26123a,#120a24);box-shadow:0 0 16px #ff5cf4aa}
.card.r7::after{content:'';position:absolute;inset:-3px;border-radius:15px;padding:3px;background:conic-gradient(#ff5cf4,#5cf0ff,#fff35c,#6aff7a,#ff5cf4);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:hue 3s linear infinite;pointer-events:none}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.card.back{background:linear-gradient(135deg,#27405e,#15233a);border-color:#6a86ad}
.card.back>*{visibility:hidden}
.card.back::before{content:'?';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:900;color:#8fb0d8;visibility:visible}
.card.back.r7::after{display:none}
.card.r8{border-color:#ff7a1a;background:linear-gradient(#3a1a05,#160a02);box-shadow:0 0 16px #ff7a1aaa}
.card.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.5) rotateY(90deg)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.nw{position:absolute;left:4px;bottom:4px;background:#ffe14d;color:#221;border-radius:6px;padding:0 5px;font-size:10px;font-weight:900}
.dust{position:absolute;left:0;right:0;bottom:2px;font-size:10px;color:#ffe08a;font-weight:800}
.detail{max-width:620px;margin:12px auto 0;background:#0e2419f0;border:2px solid #2e6b4a;border-radius:16px;padding:12px;position:sticky;bottom:0}
.dr{display:flex;gap:12px;align-items:center}
.dr img{width:90px;height:100px;object-fit:contain}
.sbar{height:8px;background:#0008;border-radius:5px;overflow:hidden;margin:3px 0 7px}
.sbar i{display:block;height:100%;background:linear-gradient(#ffe14d,#f59e0b)}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;max-width:940px;margin:0 auto}
.pack{background:linear-gradient(#1d3a5a,#101c30);border:3px solid #4a7fb5;border-radius:18px;padding:14px;text-align:center}
.pack.skillp{border-color:#f5c542;background:linear-gradient(#4a3a14,#1f1808)}
.pack.legend{border-color:#ff5cf4;background:linear-gradient(#3a1450,#150a24)}
.pack .pi{font-size:52px}
.pack h3{margin:2px 0}
.pack p{margin:4px 0 10px;font-size:13px;opacity:.9}
.odds{font-size:11px;text-align:left;margin:8px auto 10px;max-width:220px}
.odds div{display:flex;justify-content:space-between;font-weight:800}
.skillbar{height:12px;background:#000a;border-radius:8px;overflow:hidden;margin:6px auto;max-width:300px;border:2px solid #000}
.skillbar i{display:block;height:100%;background:linear-gradient(90deg,#5cf06a,#ffe14d,#ff5c5c)}
.res h1{font-size:42px;margin:6px 0;text-shadow:0 4px 0 #000}
.rrow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #fff2;font-weight:800}
.rrow.tot{font-size:22px;color:#ffe08a;border:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;border:2px solid #fff6;border-radius:14px;padding:10px 18px;font-weight:900;z-index:50;pointer-events:none}
.rb{background:linear-gradient(90deg,#ff5cf4,#5cf0ff,#fff35c,#6aff7a,#ff5cf4);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:sh 3s linear infinite}
@keyframes sh{to{background-position:200% 0}}
.lbar{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;font-weight:800;font-size:13px;background:#0008;border-radius:12px;padding:6px 10px;max-width:620px;margin:0 auto 6px}
.scr.lab{background:linear-gradient(transparent 0,transparent 24%,#07120dfa 52%)}
.labgap{height:30vh;min-height:150px}
.etrack{display:flex;gap:6px;margin:10px 0}
.etk{flex:1;text-align:center;border:2px solid #fff3;border-radius:10px;padding:4px 2px;opacity:.5}
.etk.on{opacity:1;border-color:var(--ec);background:#0006}
.etk.nx{opacity:.9;border-style:dashed;border-color:var(--ec)}
.etk i{display:block;font-style:normal;font-size:13px;color:var(--ec)}
.etk small{font-size:10px;font-weight:800}
.erow{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:4px;font-size:13px;font-weight:800;padding:3px 0;border-bottom:1px solid #fff2}
.erow.eh{opacity:.7;font-size:11px}
.erow .ev{text-align:right}.erow .up{color:#7dff6a}
.eab{display:flex;gap:8px;align-items:flex-start;background:#0006;border-radius:10px;padding:6px 8px;margin:4px 0;font-size:13px}
.eab.lock{opacity:.55}.eab.newab{border:2px solid #ffe14d}
.eab .ei{font-size:20px}.evnew{background:#ffe14d;color:#221;border-radius:6px;padding:0 5px;font-size:10px;font-weight:900}
.rq{display:flex;justify-content:space-between;font-weight:800;font-size:14px;padding:3px 0}.rq.ok{color:#9dff8a}.rq.no{color:#ffb0a0}
.pbar{position:relative;height:16px;background:#000a;border-radius:9px;overflow:hidden;margin:8px 0;border:2px solid #000}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#5cf06a,#ffe14d)}
.pbar span{position:absolute;inset:0;text-align:center;font-size:11px;font-weight:900;line-height:12px;text-shadow:0 1px 0 #000}
.pbar.sm{height:12px;margin:4px 0}.pbar.sm span{line-height:8px;font-size:9px}
.chip{background:#0008;color:#fff;border:2px solid #fff5;border-radius:14px;padding:4px 10px;font-weight:800;font-family:inherit;cursor:pointer}.chip.on{background:#2fbf3a;color:#021}
.estrip{display:flex;gap:8px;overflow-x:auto;max-width:620px;margin:0 auto 14px;padding:4px 2px 10px;-webkit-overflow-scrolling:touch;touch-action:pan-x}
.emini{flex:none;width:84px;position:relative;text-align:center;background:linear-gradient(#22344a,#111a28);border:3px solid var(--rc);border-radius:12px;padding:4px;cursor:pointer}
.emini.on{outline:3px solid #fff;outline-offset:1px}
.emini img{width:100%;height:68px;object-fit:contain}.emini b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evb{position:absolute;right:4px;bottom:34px;background:#000b;border-radius:8px;padding:0 4px;font-size:10px;font-style:normal;font-weight:900;letter-spacing:-1px}
.emini .evb{bottom:18px}
.qrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #fff2}.qrow>div{flex:1}.qdone{color:#9dff8a;font-weight:900}.qwait{opacity:.5}
.evring{position:fixed;left:50%;top:26%;width:40px;height:40px;margin:-20px;border-radius:50%;border:6px solid #fff;box-shadow:0 0 40px #fff,inset 0 0 30px #fff;animation:evr 1.2s ease-out forwards;pointer-events:none;z-index:30}
@keyframes evr{0%{transform:scale(.2);opacity:1}100%{transform:scale(14);opacity:0}}
#evoBan{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 100px);transform:translateX(-50%);padding:4px 14px;border-radius:14px;background:#000b;border:2px solid var(--ec,#fff);font-weight:900;font-size:13px;opacity:0;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#evoBan.show{animation:evb 3.6s ease-out forwards}
@keyframes evb{0%{opacity:0;transform:translateX(-50%) scale(.7)}10%{opacity:1;transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#bA1{right:140px;bottom:122px;width:56px;height:56px;background:#8e44ad!important;font-size:24px!important;display:none}
#bA2{right:0;bottom:112px;width:56px;height:56px;background:#c0392b!important;font-size:24px!important;display:none}
#bA1.cdn,#bA2.cdn{filter:grayscale(.8) brightness(.6);font-size:20px!important}
#abBar{position:absolute;bottom:34px;left:12px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.abc{background:#000a;border:2px solid #ffe14d;border-radius:10px;padding:3px 9px;font-size:12px;font-weight:900;display:none}.abc.cdn{opacity:.55;border-color:#fff5}
@media (pointer:coarse){#abBar{display:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="flash"></div>
<div id="ftl"></div>

<div id="hud" class="hidden">
  <div class="bars">
    <div class="bar">
      <div class="nm"><span id="pn"></span><small id="pr"></small></div>
      <div class="hp"><div class="lag" id="pLag"></div><div class="fill" id="pFill"></div><div class="hpn" id="pHp">100</div></div>
      <div class="gd"><div id="pGd"></div></div>
      <div class="gd st"><div id="pSt"></div></div>
    </div>
    <div class="mid"><div id="wlabel"></div><div id="timer">90</div><div id="alive"></div></div>
    <div class="bar right" id="foes"></div>
  </div>
  <canvas id="radar" width="176" height="176"></canvas>
  <div id="dmgtaken">Damage taken: <b id="dtk">0</b></div>
  <div id="banner"></div>
  <div id="evoBan"></div>
  <div id="abBar"><div class="abc" id="abc1"></div><div class="abc" id="abc2"></div></div>
  <button id="pauseBtn">❚❚</button>
  <div id="keys">WASD move · SPACE attack · K block (tap right before a hit = PARRY) · L dash · Q / R evolution abilities</div>
  <div id="joyZone"><div id="joy"><div id="knob"></div></div></div>
  <div id="btns">
    <button id="bDash">💨</button>
    <button id="bA1"></button>
    <button id="bA2"></button>
    <button id="bBlk">🛡️</button>
    <button id="bAtk">⚔️</button>
  </div>
</div>
<div id="ui"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ===================================================== UTIL ===================================================== */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;
const ARENA_R=9;

/* ===================================================== DATA ===================================================== */
const RAR=[
 {n:'Common',   c:'#aab4c0',w:56,  mul:1.00,dust:10},
 {n:'Uncommon', c:'#4ade80',w:26,  mul:1.06,dust:25},
 {n:'Rare',     c:'#3b9cff',w:10,  mul:1.12,dust:60},
 {n:'Epic',     c:'#b266ff',w:4.5,   mul:1.20,dust:120},

function evoKit(p){
 const k=p.key>=1000?p.key-1000+101:p.key,order=['bamboo','iron','spirit','thunder','heal'];
 const wb={12:3,13:3,5:3,9:1,1:0,10:0,7:2,3:2,11:2};
 const a=(wb[p.w]!==undefined)?wb[p.w]:(k*7+p.w*3+p.r)%5;
 const b=(a+1+(k%4))%5;
 return{pass:PASS[(k+p.r*3+p.w)%5],a1:order[a],a2:order[b]};
}
// cost of going from level lv (0..2) to lv+1. Ultimate / Exclusive pandas can't be duplicated, so they need no duplicates (but more shards).
function evoReq(p,lv){
 const r=p.r,sp=!!(p.ex||(r===7&&!p.boss));
 let dup=[1,2,3][lv];if(r>=6)dup=[1,1,2][lv];else if(r>=4)dup=[1,2,2][lv];
 if(sp)dup=0;
 return{dup:dup,coins:Math.round([250,750,1800][lv]*(1+r*.3)/10)*10,sh:Math.round([3,8,16][lv]*(1+r*.12)*(sp?1.5:1))};
}

 return ids;
}
function cleanEvo(o,owned){
 const e={st:{},shards:0,q:{},aura:'',auras:{},cnt:{win:0,boss:0},daily:{d:'',p:[0,0,0],c:[0,0,0]}};
 if(!o||typeof o!=='object')return e;
 const n=(v,lo,hi)=>{v=+v;return Number.isFinite(v)?Math.max(lo,Math.min(hi,Math.floor(v))):lo;};
 if(o.st&&typeof o.st==='object')for(const k of Object.keys(o.st)){const ki=+k;if(!Number.isInteger(ki)||!((ki>=0&&ki<ROSTER.length)||ki===1000))continue;if(owned&&!(owned[ki]>0))continue;const lv=n(o.st[k],0,3);if(lv>0)e.st[ki]=lv;}
 e.shards=n(o.shards,0,1e9);
 if(o.q&&typeof o.q==='object')for(const q of EVQ){const x=o.q[q.id];if(x&&typeof x==='object')e.q[q.id]={p:n(x.p,0,q.t),c:x.c?1:0};}
 if(o.auras&&typeof o.auras==='object')for(const a of AURAS)if(a.id&&o.auras[a.id])e.auras[a.id]=1;
 e.aura=(typeof o.aura==='string'&&(o.aura===''||e.auras[o.aura]))?o.aura:'';
 if(o.cnt&&typeof o.cnt==='object'){e.cnt.win=n(o.cnt.win,0,1e7);e.cnt.boss=n(o.cnt.boss,0,1e7);}
 const dd=o.daily;
 if(dd&&typeof dd==='object'&&typeof dd.d==='string'&&dd.d.length<16){e.daily.d=dd.d;for(let i=0;i<3;i++){e.daily.p[i]=n(dd.p&&dd.p[i],0,1000);e.daily.c[i]=(dd.c&&dd.c[i])?1:0;}}
 return e;
}

 try{const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.value=f;
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+d);
 g.gain.value=v||.08;g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
 o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}catch(e){}
}

function burst(x,y,z,color,n,spd,size,grav){

  const u=m.userData;u.vx=Math.cos(a)*Math.cos(e)*s;u.vz=Math.sin(a)*Math.cos(e)*s;u.vy=Math.sin(e)*s+spd*.3;
  u.life=u.max=rnd(.3,.7);u.g=grav===undefined?9:grav;u.s=size||.1;m.scale.setScalar(u.s);m.material.opacity=1;}
}
const BOLTS=[];
function bolt(x,z){
 const n=9;
 for(let j=0;j<3;j++){
  const arr=new Float32Array(n*3);let cx=x,cz=z;
  for(let i=0;i<n;i++){const y=14*(1-i/(n-1));arr[i*3]=i===n-1?x:cx+rnd(-.7,.7)+j*.05;arr[i*3+1]=y;arr[i*3+2]=i===n-1?z:cz+rnd(-.7,.7);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(arr,3));
  const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:j===0?0xffffff:0x8fe8ff}));scene.add(l);BOLTS.push({l,t:.25});
 }
 flash('#cfefff',.55);

const _v=new THREE.Vector3();
function updFX(dt,rdt){
 for(const m of PART){if(!m.visible)continue;const u=m.userData;u.life-=dt;if(u.life<=0){m.visible=false;continue;}
  m.position.x+=u.vx*dt;m.position.y+=u.vy*dt;m.position.z+=u.vz*dt;u.vy-=u.g*dt;
  const k=u.life/u.max;m.scale.setScalar(u.s*(.3+k));m.material.opacity=k;}
 for(let i=BOLTS.length-1;i>=0;i--){const b=BOLTS[i];b.t-=rdt;if(b.t<=0){scene.remove(b.l);b.l.geometry.dispose();BOLTS.splice(i,1);}}
 for(let i=FT.length-1;i>=0;i--){const q=FT[i];q.t+=rdt;if(q.t>1.1){q.el.remove();FT.splice(i,1);continue;}
  _v.set(q.x,q.y+q.t*.8,q.z).project(camera);
  q.el.style.left=((_v.x*.5+.5)*innerWidth)+'px';q.el.style.top=((-_v.y*.5+.5)*innerHeight)+'px';q.el.style.opacity=clamp(1.6-q.t*1.4,0,1);}
}

 let da=s.fa-f.face;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;f.face+=da*k;
 f.vx=s.vx;f.vz=s.vz;f.atk=s.a;f.atkT=Math.max(0,s.at-age);f.rec=s.rc;f.blocking=!!s.b;f.blockT=s.bt+age;f.dash=Math.max(0,s.d-age);f.hurt=Math.max(0,s.h-age);

function hitRemote(a,d){

}

 }else{applyHit(a,d,dmg,kb,crit);if(m.sp>0&&!d.dead){d.stun=Math.max(d.stun,num(m.sp,0,1.2));d.atk=-1;ftext(d,'⚡ STAGGER','brk');}}
 a.x=sx;a.z=sz;

/* ===================================================== PACKS ===================================================== */
function weights(sk,minR){let tot=0;const L=sk==null?1:luckMul(sk);const ws=RAR.map((r,i)=>{if(i<minR)return 0;const w=r.w*(i>=1?Math.pow(L,i*.5):1);tot+=w;return w;});return{ws,tot};}
function rollRarity(boost,minR){const{ws,tot}=weights(boost,minR||0);let x=Math.random()*tot;for(let i=0;i<ws.length;i++){x-=ws[i];if(x<=0&&ws[i]>0)return i;}return minR||0;}
function oddsPct(boost,minR){const{ws,tot}=weights(boost,minR||0);return ws.map(w=>w/tot*100);}
function give(p){const had=S.owned[p.key]|0;S.owned[p.key]=had+1;if(had){const d=RAR[p.r].dust,sh=1+Math.floor(p.r/2);S.coins+=d;addShards(sh);return{p,isNew:false,dust:d,sh:sh};}return{p,isNew:true,dust:0};}
const PACKS={
 single:{cost:150,n:1},
 skill:{cost:1200,n:10},
 legend:{cost:2500,n:1}
};
function buyPack(kind){
 const k=PACKS[kind];if(S.coins<k.cost){toast('Not enough coins 🪙');return;}
 S.coins-=k.cost;const boost=skill(),res=[];
 if(kind==='single'){res.push(give(pick(ROSTER.filter(p=>p.r===rollRarity(null,0)))));}
 else if(kind==='skill'){
  const rs=[];for(let i=0;i<10;i++)rs.push(rollRarity(boost,0));
  if(!rs.some(r=>r>=1))rs[9]=rollRarity(boost,1);
  rs.sort((a,b)=>a-b);rs.forEach(r=>res.push(give(pick(ROSTER.filter(p=>p.r===r)))));
 }else{res.push(give(pick(ROSTER.filter(p=>p.r===rollRarity(boost,4)))));}
 save();revealScreen(res);
}

function cleanSave(o){
 const d=defSave(),n=(v,lo,hi,def)=>{v=+v;return Number.isFinite(v)?Math.max(lo,Math.min(hi,Math.floor(v))):def;};

/* ---------- evolving ---------- */
function evoState(p){
 const lv=evoLv(p.key),own=S.owned[p.key]|0,dups=Math.max(0,own-1);
 if(lv>=3)return{lv:lv,max:true,dups:dups,own:own,can:false};
 const r=evoReq(p,lv),ok={dup:dups>=r.dup,coins:S.coins>=r.coins,sh:S.evo.shards>=r.sh};
 const fr=[];if(r.dup)fr.push(Math.min(1,dups/r.dup));fr.push(Math.min(1,S.coins/r.coins));fr.push(Math.min(1,S.evo.shards/r.sh));
 return{lv:lv,max:false,dups:dups,own:own,r:r,ok:ok,can:own>0&&ok.dup&&ok.coins&&ok.sh,pct:Math.round(fr.reduce((a,b)=>a+b,0)/fr.length*100)};
}
function doEvolve(key,expect){
 const p=getP(key);if(!p||evoBusy)return false;
 const st=evoState(p);
 if(st.max||st.lv!==expect||!st.can)return false;
 S.owned[key]=Math.max(1,(S.owned[key]|0)-st.r.dup);
 S.coins-=st.r.coins;S.evo.shards-=st.r.sh;
 S.evo.st[key]=st.lv+1;
 qRecalc();save();return true;
}
function evoConvert(key){
 const p=getP(key),st=evoState(p);if(!p||st.dups<1)return;
 S.owned[key]=Math.max(1,(S.owned[key]|0)-1);const g=addShards(3+p.r*2);save();SFX.reveal(2);toast('Converted 1 duplicate → +'+g+' 💎');evoRender();
}
function evoStatRows(p,lv){
 const w=WEP[p.w],ult=isUlt(p),ex=!!p.ex,def0=ult?.3:(ex?.26:p.r*.018),spd0=(5.0+p.r*.1)*(ult?1.2:1)*(ex?1.15:1);
 const row=l=>{const E=EVO_STATS[l];return{dmg:w.dmg*powOf(p)*(1+E.dmg),hp:100*(1+E.hp)/(1-def0),sr:100*(1+E.stam),sp:spd0*(1+E.spd)};};
 return{b:row(0),c:row(lv),n:lv<3?row(lv+1):null};
}

/* ---------- Evolution Lab UI ---------- */
function setMenuFor(p,lv,aur){
 if(menuF)scene.remove(menuF.g);
 menuF=mkFighter(p,true,0,lv,aur);menuF.opp=menuF;
}
function evoOwnedList(){return ROSTER.concat(SKINS).filter(p=>(S.owned[p.key]|0)>0).sort((a,b)=>evoLv(b.key)-evoLv(a.key)||b.r-a.r||a.key-b.key);}
function labFighter(){const p=getP(evoSel),lv=evoLv(p.key);setMenuFor(p,Math.min(3,lv+(evoPrev?1:0)),S.evo.aura);}
function evoScreen(key,from){
 if(from)evoFrom=from;
 state='menu';hudShow(false);
 if(key!==undefined&&key!==null&&(S.owned[key]|0)>0)evoSel=+key;
 else if(!((S.owned[evoSel]|0)>0))evoSel=S.sel;
 evoPrev=false;
 clearFighters();buildArena(clamp(S.unlocked-1,0,4));labMode=true;
 labFighter();evoRender();
}
function evoBack(){
 labMode=false;
 if(evoFrom==='collection'){setMenuFor(getP(S.sel));collectionScreen();}else mainMenu();
}
function evoRender(){
 const old=$('estrip'),sl=old?old.scrollLeft:0;
 const p=getP(evoSel),lv=evoLv(p.key),rc=RAR[p.r],st=evoState(p),kit=evoKit(p),rows=evoStatRows(p,lv),E=S.evo;
 const next=lv+1,own=evoOwnedList();
 const fmt={dmg:v=>v.toFixed(1),hp:v=>Math.round(v),sr:v=>Math.round(v)+'%',sp:v=>v.toFixed(2)};
 const statLine=(lab,k)=>{const b=fmt[k](rows.b[k]),c=fmt[k](rows.c[k]),n=rows.n?fmt[k](rows.n[k]):null;
  return `<div class="erow"><span>${lab}</span><span class="ev">${b}</span><span class="ev"><b>${c}</b></span><span class="ev ${n?'up':''}">${n?'▲ '+n:'MAX'}</span></div>`;};
 const track=[0,1,2,3].map(i=>`<div class="etk${i<=lv?' on':''}${i===next&&!st.max?' nx':''}" style="--ec:${EVO_COL[i]}"><i>${i===0?'●':'★'.repeat(i)}</i><small>${EVO_NAMES[i]}</small></div>`).join('');
 const abil=[
  {l:1,t:'Passive',n:kit.pass.n,d:kit.pass.d,ico:'✦'},
  {l:2,t:'Ability (Q)',n:ABIL[kit.a1].n,d:ABIL[kit.a1].d+' Cooldown '+ABIL[kit.a1].cd+'s.',ico:ABIL[kit.a1].ico},
  {l:3,t:'Signature (R)',n:ULTA[kit.a2].n,d:ULTA[kit.a2].d+' Cooldown '+ULTA[kit.a2].cd+'s.',ico:ULTA[kit.a2].ico}
 ].map(a=>`<div class="eab${lv>=a.l?'':' lock'}${a.l===next&&!st.max?' newab':''}"><span class="ei">${lv>=a.l?a.ico:'🔒'}</span><div><b>Stage ${a.l+1} · ${a.t}: ${a.n}</b>${a.l===next&&!st.max?' <span class="evnew">NEXT</span>':''}<br><small>${a.d}</small></div></div>`).join('');
 let req='';
 if(st.max)req='<div style="font-weight:900;color:#ffd24a;text-align:center;margin:8px 0">✨ Fully evolved — Transcendent!</div>';
 else{
  const line=(ic,lab,have,need,ok)=>`<div class="rq ${ok?'ok':'no'}"><span>${ic} ${lab}</span><span>${have.toLocaleString()} / ${need.toLocaleString()} ${ok?'✔':'✖'}</span></div>`;
  req=`<div style="font-weight:900;margin:8px 0 2px">Evolve to Stage ${next+1} · ${EVO_NAMES[next]}</div>
   ${st.r.dup?line('🐼','Duplicate copies',st.dups,st.r.dup,st.ok.dup):'<div class="rq ok"><span>🐼 Duplicates</span><span>Not needed (special rule) ✔</span></div>'}
   ${line('🪙','Coins',S.coins,st.r.coins,st.ok.coins)}
   ${line('💎','Evolution Shards',E.shards,st.r.sh,st.ok.sh)}
   <div class="pbar"><i style="width:${st.pct}%"></i><span>${st.pct}% ready</span></div>`;
 }
 const canEv=!st.max&&st.can;
 const evBtn=st.max?'':`<button class="btn ${canEv?'grn':'dim'}" data-act="evoask">🧬 Evolve to Stage ${next+1}</button>`;
 const miss=(!st.max&&!st.can)?`<div style="font-size:12px;color:#ff9a8a;font-weight:800;margin-top:4px">Missing: ${[!st.ok.dup?(st.r.dup-st.dups)+' duplicate'+(st.r.dup-st.dups>1?'s':''):'',!st.ok.coins?(st.r.coins-S.coins).toLocaleString()+' coins':'',!st.ok.sh?(st.r.sh-E.shards)+' shards':''].filter(Boolean).join(', ')}</div>`:'';
 const conv=st.dups>0?`<button class="btn alt sm" data-act="evoconv">♻ Convert 1 duplicate → ${3+p.r*2} 💎 (${st.dups} spare)</button>`:`<span style="font-size:12px;opacity:.75">No spare duplicates (pack duplicates give 💎 automatically)</span>`;
 const auras=AURAS.filter(a=>a.id===''||E.auras[a.id]).map(a=>`<button class="chip${E.aura===a.id?' on':''}" data-act="evoaura" data-v="${a.id||'-'}" style="${a.col?'border-color:'+a.col:''}">${a.n}</button>`).join('');
 const strip=own.map(q=>{const l=evoLv(q.key);return `<div class="emini${q.key===evoSel?' on':''}" data-act="evosel" data-v="${q.key}" style="--rc:${RAR[q.r].c}"><img src="${thumb(q)}" alt=""><b>${q.name}</b>${l?`<i class="evb" style="color:${EVO_COL[l]}">${evoBadge(l)}</i>`:''}</div>`;}).join('');
 const spec=(p.ex||isUlt(p))?'<div style="font-size:12px;font-weight:800;color:#ffa24a;margin-top:4px">⭐ Special rule: this panda is one of a kind, so it needs no duplicates — only coins and extra shards.</div>':'';
 ui(topbar('Evolution Lab','evoback')+`<div class="lbar"><span>💎 <b>${E.shards.toLocaleString()}</b> Evolution Shards</span><span>🧬 Evolved <b>${evoCount()}</b>/${ownedCount()+((S.owned[1000]|0)?1:0)}</span><button class="btn sm alt" data-act="evoquests">📜 Quests</button></div>
 <div class="labgap"></div>
 <div class="panel elab">
  <div class="${p.r===7?'rb':''}" style="font-weight:900;font-size:12px;color:${rc.c}">${rc.n.toUpperCase()}</div>
  <div style="font-size:22px;font-weight:900">${p.name} <span style="color:${EVO_COL[lv]}">${lv?evoBadge(lv):''}</span></div>
  <div style="font-size:13px;opacity:.9">${WEP[p.w].ico} ${WEP[p.w].n} · Stage ${lv+1}: <b style="color:${EVO_COL[lv]}">${EVO_NAMES[lv]}</b>${evoPrev?' · <b style="color:#ffe14d">previewing Stage '+(lv+2)+'</b>':''}</div>
  <div class="etrack">${track}</div>
  <div class="erow eh"><span></span><span class="ev">Base</span><span class="ev">Now</span><span class="ev">Next</span></div>
  ${statLine('⚔️ Damage','dmg')}${statLine('❤️ Health','hp')}${statLine('🔋 Stamina regen','sr')}${statLine('👟 Speed','sp')}
  <div style="margin-top:8px">${abil}</div>
  ${req}${miss}${spec}
  <div class="row" style="margin-top:10px">${evBtn}${st.max?'':`<button class="btn alt sm" data-act="evoprev">${evoPrev?'👁 Show current':'👁 Preview next stage'}</button>`}${S.sel===p.key?'<button class="btn dim sm">Equipped ✔</button>':`<button class="btn sm" data-act="evoequip">Equip</button>`}</div>
  <div style="margin-top:8px;text-align:center">${conv}</div>
  <div style="margin-top:8px;text-align:center"><div style="font-size:12px;font-weight:800;opacity:.85;margin-bottom:4px">Aura colour (unlock more through quests)</div><div class="row" style="gap:6px">${auras}</div></div>
  <div style="font-size:12px;opacity:.8;margin-top:8px;text-align:center">Evolution is optional. Abilities: <b>Q</b> / <b>R</b> on keyboard, or the round buttons on phone. In online PvP with “Fair stats” on, evolution is cosmetic only.</div>
 </div>
 <div style="max-width:620px;margin:6px auto 4px;font-weight:900;font-size:13px">Your pandas</div>
 <div class="estrip" id="estrip">${strip}</div>`,'lab');
 const s2=$('estrip');if(s2)s2.scrollLeft=sl;
}
function evoConfirm(){
 const p=getP(evoSel),st=evoState(p);
 if(st.max||!st.can){toast(st.max?'Already fully evolved':'You can\'t afford that yet');return;}
 evoPending={key:p.key,lv:st.lv};
 const r=st.r,nx=st.lv+1,rc=RAR[p.r];
 ui(topbar('Confirm Evolution','')+`<div class="panel" style="text-align:center;margin-top:16vh">
  <img src="${thumb(p)}" style="width:110px;height:120px;object-fit:contain" alt="">
  <div style="font-size:20px;font-weight:900;color:${rc.c}">${p.name}</div>
  <div style="font-size:18px;font-weight:900;margin:4px 0">Stage ${st.lv+1} → <span style="color:${EVO_COL[nx]}">Stage ${nx+1} · ${EVO_NAMES[nx]}</span></div>
  <div style="text-align:left;margin:10px 0">
   ${r.dup?`<div class="rrow"><span>🐼 Duplicate copies used</span><span>−${r.dup} (${st.own} → ${st.own-r.dup} owned)</span></div>`:''}
   <div class="rrow"><span>🪙 Coins</span><span>−${r.coins.toLocaleString()} (${S.coins.toLocaleString()} → ${(S.coins-r.coins).toLocaleString()})</span></div>
   <div class="rrow"><span>💎 Shards</span><span>−${r.sh} (${S.evo.shards} → ${S.evo.shards-r.sh})</span></div></div>
  <div style="font-size:12px;opacity:.85;margin-bottom:8px">You keep your panda — only the listed duplicates, coins and shards are spent.</div>
  <div class="row"><button class="btn grn" data-act="evogo">✔ Confirm</button><button class="btn alt" data-act="evocancel">Cancel</button></div></div>`,'dark');
}
function evoGo(){
 if(!evoPending||evoBusy)return;
 const pe=evoPending;evoPending=null;
 if(!doEvolve(pe.key,pe.lv)){toast('Evolution failed — nothing was spent');evoRender();return;}
 evoBusy=true;setTimeout(()=>{evoBusy=false;},900);
 const p=getP(pe.key),lv=pe.lv+1,kit=evoKit(p);
 evoSel=pe.key;evoPrev=false;labFighter();
 SFX.evolve();flash('#ffffff',.85);
 if(menuF){for(let k=0;k<5;k++)setTimeout(()=>burst(0,.4+k*.35,0,RAR[p.r].c,26,9,.14,0),k*120);}
 let unlock='';
 if(lv===1)unlock=`✦ Passive unlocked: <b>${evoKit(p).pass.n}</b> — ${evoKit(p).pass.d}`;
 else if(lv===2)unlock=`${ABIL[kit.a1].ico} Ability unlocked: <b>${ABIL[kit.a1].n}</b> (press <b>Q</b>)`;
 else unlock=`${ULTA[kit.a2].ico} Signature unlocked: <b>${ULTA[kit.a2].n}</b> (press <b>R</b>)`;
 const qn=EVQ.filter(q=>{const x=S.evo.q[q.id];return x&&!x.c&&x.p>=q.t;}).length;
 ui(`<div class="evring"></div><div class="panel res" style="text-align:center;margin-top:34vh;border-color:${EVO_COL[lv]};position:relative">
  <h1 style="color:${EVO_COL[lv]};margin:0">✨ EVOLVED!</h1>
  <div style="font-size:20px;font-weight:900">${p.name}</div>
  <div style="font-size:18px;font-weight:900;margin:4px 0;color:${EVO_COL[lv]}">${evoBadge(lv)} Stage ${lv+1} · ${EVO_NAMES[lv]}</div>
  <div style="margin:8px 0">${unlock}</div>
  ${qn?`<div style="font-weight:900;color:#ffe14d;margin:6px 0">📜 ${qn} evolution quest reward${qn>1?'s':''} ready to claim!</div>`:''}
  <div class="row" style="margin-top:10px"><button class="btn grn" data-act="evocancel">Continue</button></div></div>`,'lab');
}
function evoQuestScreen(){
 dailyEnsure();const E=S.evo;
 const bar=(p,t)=>`<div class="pbar sm"><i style="width:${Math.round(p/t*100)}%"></i><span>${p}/${t}</span></div>`;
 const dids=dailyPick(E.daily.d);
 const dl=dids.map((di,i)=>{const d=EVD[di],pr=E.daily.p[i],c=E.daily.c[i];
  return `<div class="qrow"><div><b>${d.d}</b><br><small>Reward: ${d.coins} 🪙 + ${d.sh} 💎</small>${bar(pr,d.t)}</div>${c?'<span class="qdone">✔ Claimed</span>':(pr>=d.t?`<button class="btn grn sm" data-act="evodclaim" data-v="${i}">Claim</button>`:'<span class="qwait">…</span>')}</div>`;}).join('');
 const ql=EVQ.map(d=>{const q=E.q[d.id]||{p:0,c:0};
  return `<div class="qrow"><div><b>${d.n}</b> — ${d.d}<br><small>Reward: ${d.coins.toLocaleString()} 🪙 + ${d.sh} 💎${d.aura?' + '+AURAS.find(a=>a.id===d.aura).n+' aura':''}</small>${bar(Math.min(q.p,d.t),d.t)}</div>${q.c?'<span class="qdone">✔ Claimed</span>':(q.p>=d.t?`<button class="btn grn sm" data-act="evoclaim" data-v="${d.id}">Claim</button>`:'<span class="qwait">…</span>')}</div>`;}).join('');
 ui(topbar('Evolution Quests','evocancel')+`<div class="lbar"><span>💎 <b>${E.shards.toLocaleString()}</b> Evolution Shards</span></div>
  <div class="panel"><h3>📅 Daily challenges <small style="opacity:.7">(reset every day)</small></h3>${dl}</div>
  <div class="panel"><h3>🧬 Evolution quests</h3>${ql}</div>
  <div class="panel" style="font-size:13px"><b>How to earn 💎 shards:</b> beat bosses and clear worlds, reach Survival wave milestones (every 5 waves), win Freeplay and online matches, finish daily challenges and quests, get duplicate pandas from packs, or convert spare duplicates in the Lab.</div>`,'solid');
}

const ACT={
 menu:()=>{pvpLeave();mainMenu();},pvp:()=>pvpScreen(),pvpcreate:()=>pvpHostRoom(),pvpjoin:()=>pvpJoinRoom($('pvpCode').value),pvpcancel:()=>{pvpLeave();pvpScreen();},evomenu:()=>evoScreen(undefined,'menu'),evolab:v=>evoScreen(+v,'collection'),evoback:()=>evoBack(),evosel:v=>{evoSel=+v;evoPrev=false;labFighter();evoRender();},evoprev:()=>{evoPrev=!evoPrev;labFighter();evoRender();},evoask:()=>evoConfirm(),evogo:()=>evoGo(),evocancel:()=>{evoPending=null;evoRender();},evoconv:()=>evoConvert(evoSel),evoequip:()=>{S.sel=evoSel;save();evoRender();},evoaura:v=>{const a=v==='-'?'':v;if(a===''||S.evo.auras[a]){S.evo.aura=a;save();labFighter();evoRender();}},evoquests:()=>evoQuestScreen(),evoclaim:v=>evoClaim(v),evodclaim:v=>evoClaimDaily(+v),pvpstart:()=>pvpStartMatch(),pvplobby:()=>{if(!pvpHost&&!pvpConn){pvpLeave();pvpScreen();pvpSetStatus('The host left the room.');}else pvpShowLobby();},pvpkick:v=>pvpKick(+v),pvpleave:()=>{pvpLeave();mainMenu();},pvpcopy:v=>{const l=location.href.split('#')[0].split('?')[0]+'?room='+v;try{navigator.clipboard.writeText(l).then(()=>toast('Link copied!'),()=>toast(l));}catch(e){toast(l);}},freeplay:()=>freeplayScreen(),hwevent:()=>hwScreen(),hw:()=>startFight(4,'hw'),survival:()=>survivalScreen(),surv:v=>startFight(+v,'surv'),ffa:v=>startFight(+v,true),worlds:()=>worldsScreen(),collection:()=>collectionScreen(),shop:()=>shopScreen(),help:()=>helpScreen(),settings:()=>settingsScreen(),
 play:v=>startFight(+v,false),
 sel:v=>{colSel=+v;detailPanel();},
 equip:v=>{S.sel=+v;save();detailPanel();document.querySelectorAll('.cgrid .card').forEach(c=>{const old=c.querySelector('.eqd');if(old)old.remove();if(+c.dataset.v===S.sel){const d=document.createElement('div');d.className='eqd';d.textContent='EQUIPPED';c.appendChild(d);}});},
 buy:v=>buyPack(v),rev:v=>revealOne(+v),
 revall:()=>{revealList.forEach((g,i)=>setTimeout(()=>revealOne(i),i*140));},
 mute:()=>{S.mute=!S.mute;save();settingsScreen();},
 savemenu:()=>saveScreen(),
 savecopy:()=>saveCopy(),
 saveload:()=>{try{importPrompt(decodeSave($('saveIn').value));}catch(e){toast('That save link is not valid');}},
 saveapply:()=>saveApply(),
 savecancel:()=>{clearSaveHash();mainMenu();},
 savedel:()=>saveScreen(true),
 savedelno:()=>saveScreen(false),
 savedelyes:()=>{S=defSave();try{localStorage.removeItem(KEY);}catch(e){}save();clearSaveHash();mainMenu();toast('Progress deleted');},
 resume:()=>{paused=false;hideUI();},
 quit:()=>{paused=false;mainMenu();}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;if(!a)return;au();if(ACT[a])ACT[a](el.dataset.v,el);});
$('pauseBtn').addEventListener('click',()=>{if(!pvp&&(state==='fight'||state==='countdown')){paused=true;pauseScreen();}});
document.addEventListener('visibilitychange',()=>{if(!pvp&&document.hidden&&(state==='fight'||state==='countdown')&&!paused){paused=true;pauseScreen();}});
addEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){if(paused){paused=false;hideUI();}else if(!pvp&&(state==='fight'||state==='countdown')){paused=true;pauseScreen();}}});

/* ===================================================== MAIN LOOP ===================================================== */
let last=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 const rdt=Math.min(.05,(now-last)/1000);last=now;
 if(!paused){
  T+=rdt;
  if(state==='menu'){menuUpdate(rdt);}
  else if(P){fightUpdate(rdt);}
  const sd=rdt*(state==='ko'?timeScale:1);
  arenaUpd(T,rdt);updFX(sd,rdt);evoPulse(T);
 }
 renderer.render(scene,camera);
}
mainMenu();
if(!S.seenHelp){S.seenHelp=true;save();helpScreen();}
try{if((location.hash||'').indexOf('#save=')===0){try{importPrompt(decodeSave(location.hash));}catch(e){clearSaveHash();toast('That save link is not valid');}}}catch(e){}
try{const rq=new URLSearchParams(location.search).get('room');if(rq){pvpScreen();pvpJoinRoom(rq);}}catch(e){}
requestAnimationFrame(loop);
</script>
