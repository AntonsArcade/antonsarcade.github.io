<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Panda Fight 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1410;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
#flash{position:fixed;inset:0;z-index:12;pointer-events:none;opacity:0;background:#fff;transition:opacity .35s}
#ftl{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.ft{position:fixed;transform:translate(-50%,-50%);font-weight:900;font-size:24px;text-shadow:0 2px 0 #000,0 0 8px #000;white-space:nowrap}
.ft.dmgE{color:#fff}.ft.dmgP{color:#ff5a5a}.ft.crit{color:#ffe14d;font-size:32px}.ft.blk{color:#7fd0ff}.ft.par{color:#ffd24a;font-size:30px}.ft.dod{color:#7dff9a}.ft.brk{color:#ff9d3d;font-size:28px}
/* HUD */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
.bars{position:absolute;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:8px;align-items:flex-start}
.bar{flex:1;min-width:0}
.bar.right{text-align:right}
.nm{font-weight:900;font-size:15px;text-shadow:0 2px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{opacity:.85;font-size:11px;margin-left:5px}
.hp{position:relative;height:22px;background:#0009;border:2px solid #000;border-radius:12px;overflow:hidden;margin-top:2px}
.hp .lag{position:absolute;left:0;top:0;bottom:0;background:#ff4d4d;transition:width .6s .35s}
.hp .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#7dff6a,#2fbf3a);transition:width .08s}
.bar.right .hp .lag,.bar.right .hp .fill{left:auto;right:0}
.bar.right .hp .fill{background:linear-gradient(#ffb36a,#e0501b)}
.hpn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;text-shadow:0 1px 0 #000}
.gd{height:6px;background:#0008;border-radius:4px;margin-top:3px;overflow:hidden}
.gd div{height:100%;background:#5cc8ff;width:100%}
.mid{width:92px;text-align:center;flex:none}
.gd.st div{background:#ffd24a}
.foe{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:11px;font-weight:800;margin-bottom:3px;text-shadow:0 1px 0 #000}
.foe .mh{width:64px;height:9px;background:#0009;border:1px solid #000;border-radius:5px;overflow:hidden;flex:none}
.foe .mh i{display:block;height:100%;background:linear-gradient(#ffb36a,#e0501b)}
.foe.dead{opacity:.35;text-decoration:line-through}
.foe.solo{display:block;font-size:15px;font-weight:900}
.foe.solo .mh{width:100%;height:22px;border:2px solid #000;border-radius:12px;margin-top:2px}
#alive{font-size:12px;font-weight:900;text-shadow:0 1px 0 #000}
#radar{position:absolute;left:50%;transform:translateX(-50%);bottom:34px;width:88px;height:88px;border-radius:50%;background:#0007;display:none}
@media (pointer:coarse){#radar{bottom:14px}}
#timer{font-size:28px;font-weight:900;text-shadow:0 2px 0 #000;line-height:1}
#wlabel{font-size:11px;font-weight:800;opacity:.95;text-shadow:0 1px 0 #000;margin-bottom:2px;white-space:nowrap}
#dmgtaken{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 74px);left:12px;font-size:13px;font-weight:800;text-shadow:0 1px 0 #000;opacity:.95}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:clamp(44px,12vw,110px);font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 5px 0 #b45309,0 0 30px #000;opacity:0;transform:scale(.6)}
#banner.show{animation:bn .9s ease-out forwards}
@keyframes bn{0%{opacity:0;transform:scale(2)}18%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
#banner.show.hold{animation:bn2 .3s ease-out forwards}
@keyframes bn2{0%{opacity:0;transform:scale(2)}100%{opacity:1;transform:scale(1)}}
#pauseBtn{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 58px);right:12px;pointer-events:auto;background:#0007;color:#fff;border:2px solid #fff6;border-radius:10px;font-size:16px;font-weight:900;padding:4px 10px}
#keys{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;opacity:.75;text-shadow:0 1px 0 #000}
#joyZone{position:absolute;left:0;bottom:0;width:52%;height:62%;pointer-events:auto;touch-action:none}
#joy{position:absolute;width:110px;height:110px;border-radius:50%;background:#fff2;border:3px solid #fff5;display:none}
#knob{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:#fffc}
#btns{position:absolute;right:14px;bottom:max(18px,env(safe-area-inset-bottom));width:210px;height:190px;pointer-events:none}
#btns button{position:absolute;pointer-events:auto;touch-action:none;border:3px solid #fff8;border-radius:50%;color:#fff;font-size:30px;background:#0007}
#bAtk{right:0;bottom:0;width:100px;height:100px;background:#d93b2b!important;font-size:44px!important}
#bBlk{right:112px;bottom:10px;width:74px;height:74px;background:#2d7dd2!important}
#bDash{right:60px;bottom:112px;width:70px;height:70px;background:#16a085!important}
#bBlk.on,#bAtk.on{filter:brightness(1.4)}
@media (pointer:fine){#joyZone,#btns{display:none}}
@media (pointer:coarse){#keys{display:none}}
/* UI screens */
#ui{position:fixed;inset:0;z-index:20;pointer-events:none}
#ui>.scr{position:absolute;inset:0;pointer-events:auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:max(10px,env(safe-area-inset-top)) 12px 18px}
.scr.solid{background:linear-gradient(#10261cf2,#07120dfa)}
.scr.dark{background:#000a}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;position:sticky;top:0;z-index:3;padding:4px 0}
.ttl{font-size:22px;font-weight:900;flex:1;text-align:center;text-shadow:0 2px 0 #000}
.coins{background:#0008;border:2px solid #f5c542;border-radius:20px;padding:5px 12px;font-weight:900;color:#ffe08a;white-space:nowrap}
.btn{background:linear-gradient(#ffd24a,#f59e0b);color:#2b1a00;border:0;border-radius:14px;padding:12px 22px;font-weight:900;font-size:18px;box-shadow:0 5px 0 #a15f00,0 8px 16px #0006;cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a15f00}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px;box-shadow:0 3px 0 #a15f00}
.btn.alt{background:linear-gradient(#6fd0ff,#2f8fe0);color:#06223b;box-shadow:0 5px 0 #1a5a96,0 8px 16px #0006}
.btn.alt.sm{box-shadow:0 3px 0 #1a5a96}
.btn.grn{background:linear-gradient(#8dff7a,#2fbf3a);color:#052b0a;box-shadow:0 5px 0 #17782a,0 8px 16px #0006}
.btn.dim{filter:grayscale(.9) brightness(.7)}
.btn.big{font-size:30px;padding:16px 56px;border-radius:20px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.menu{min-height:100%;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center}
.logo{font-size:clamp(34px,9vw,64px);font-weight:900;color:#fff;text-shadow:0 5px 0 #14532d,0 0 24px #000;letter-spacing:1px;margin-top:10px}
.logo span{color:#ffd24a;text-shadow:0 5px 0 #a15f00,0 0 24px #000}
.tag{font-weight:800;opacity:.9;text-shadow:0 2px 0 #000}
.menuBot{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:460px}
.eqname{background:#0009;border-radius:14px;padding:8px 16px;font-weight:800}
.stats{font-size:14px;font-weight:800;background:#0008;border-radius:12px;padding:6px 14px}
.panel{background:#0e2419ee;border:2px solid #2e6b4a;border-radius:18px;padding:16px;max-width:620px;margin:10px auto}
.panel h2,.panel h3{margin:0 0 8px}
.panel p,.panel li{line-height:1.45;margin:6px 0}
/* worlds */
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;max-width:900px;margin:0 auto}
.wc{border-radius:18px;padding:14px;border:3px solid #fff4;cursor:pointer;position:relative;overflow:hidden;min-height:120px}
.wc.lock{filter:grayscale(1) brightness(.55);cursor:default}
.wc h3{margin:0;font-size:22px;text-shadow:0 2px 0 #0008}
.wc .el{font-weight:800;opacity:.95}
.pips{display:flex;gap:6px;margin:10px 0 6px}
.pip{width:22px;height:22px;border-radius:50%;background:#0006;border:2px solid #fff7;display:flex;align-items:center;justify-content:center;font-size:12px}
.pip.on{background:#ffe14d;border-color:#fff}
.pip.boss{border-color:#ff5a5a;border-radius:6px}
.wc .big{position:absolute;right:10px;top:4px;font-size:54px;opacity:.9}
.wc .st{font-weight:800;font-size:14px}
.eqbar{display:flex;align-items:center;gap:12px;background:#0009;border-radius:16px;padding:8px 14px;max-width:520px;margin:0 auto 12px}
.eqbar img{width:64px;height:72px;object-fit:contain}
.eqbar div{flex:1}
/* cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;max-width:980px;margin:0 auto}
.card{position:relative;background:linear-gradient(#22344a,#111a28);border:3px solid var(--rc,#888);border-radius:14px;padding:6px 4px 6px;text-align:center;cursor:pointer;box-shadow:0 0 12px color-mix(in srgb,var(--rc) 45%,transparent)}
.card img{width:100%;height:104px;object-fit:contain;display:block}
.card img.sil{filter:brightness(0) opacity(.45)}
.card .rn{font-size:10px;font-weight:900;color:var(--rc);text-transform:uppercase;letter-spacing:.5px}
.card .cn{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cw{font-size:11px;opacity:.85}
.card .cnt{position:absolute;right:5px;top:4px;background:#000a;border-radius:8px;padding:1px 6px;font-size:11px;font-weight:900}
.card .eqd{position:absolute;left:4px;top:4px;background:#2fbf3a;color:#021;border-radius:8px;padding:1px 6px;font-size:10px;font-weight:900}
.card.selc{outline:3px solid #fff;outline-offset:2px}
.card.r7{border-color:transparent;background:linear-gradient(#26123a,#120a24);box-shadow:0 0 16px #ff5cf4aa}
.card.r7::after{content:'';position:absolute;inset:-3px;border-radius:15px;padding:3px;background:conic-gradient(#ff5cf4,#5cf0ff,#fff35c,#6aff7a,#ff5cf4);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:hue 3s linear infinite;pointer-events:none}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.card.back{background:linear-gradient(135deg,#27405e,#15233a);border-color:#6a86ad}
.card.back>*{visibility:hidden}
.card.back::before{content:'?';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:900;color:#8fb0d8;visibility:visible}
.card.back.r7::after{display:none}
.card.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.5) rotateY(90deg)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.nw{position:absolute;left:4px;bottom:4px;background:#ffe14d;color:#221;border-radius:6px;padding:0 5px;font-size:10px;font-weight:900}
.dust{position:absolute;left:0;right:0;bottom:2px;font-size:10px;color:#ffe08a;font-weight:800}
.detail{max-width:620px;margin:12px auto 0;background:#0e2419f0;border:2px solid #2e6b4a;border-radius:16px;padding:12px;position:sticky;bottom:0}
.dr{display:flex;gap:12px;align-items:center}
.dr img{width:90px;height:100px;object-fit:contain}
.sbar{height:8px;background:#0008;border-radius:5px;overflow:hidden;margin:3px 0 7px}
.sbar i{display:block;height:100%;background:linear-gradient(#ffe14d,#f59e0b)}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;max-width:940px;margin:0 auto}
.pack{background:linear-gradient(#1d3a5a,#101c30);border:3px solid #4a7fb5;border-radius:18px;padding:14px;text-align:center}
.pack.skillp{border-color:#f5c542;background:linear-gradient(#4a3a14,#1f1808)}
.pack.legend{border-color:#ff5cf4;background:linear-gradient(#3a1450,#150a24)}
.pack .pi{font-size:52px}
.pack h3{margin:2px 0}
.pack p{margin:4px 0 10px;font-size:13px;opacity:.9}
.odds{font-size:11px;text-align:left;margin:8px auto 10px;max-width:220px}
.odds div{display:flex;justify-content:space-between;font-weight:800}
.skillbar{height:12px;background:#000a;border-radius:8px;overflow:hidden;margin:6px auto;max-width:300px;border:2px solid #000}
.skillbar i{display:block;height:100%;background:linear-gradient(90deg,#5cf06a,#ffe14d,#ff5c5c)}
.res h1{font-size:42px;margin:6px 0;text-shadow:0 4px 0 #000}
.rrow{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #fff2;font-weight:800}
.rrow.tot{font-size:22px;color:#ffe08a;border:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;border:2px solid #fff6;border-radius:14px;padding:10px 18px;font-weight:900;z-index:50;pointer-events:none}
.rb{background:linear-gradient(90deg,#ff5cf4,#5cf0ff,#fff35c,#6aff7a,#ff5cf4);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:sh 3s linear infinite}
@keyframes sh{to{background-position:200% 0}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="flash"></div>
<div id="ftl"></div>

<div id="hud" class="hidden">
  <div class="bars">
    <div class="bar">
      <div class="nm"><span id="pn"></span><small id="pr"></small></div>
      <div class="hp"><div class="lag" id="pLag"></div><div class="fill" id="pFill"></div><div class="hpn" id="pHp">100</div></div>
      <div class="gd"><div id="pGd"></div></div>
      <div class="gd st"><div id="pSt"></div></div>
    </div>
    <div class="mid"><div id="wlabel"></div><div id="timer">90</div><div id="alive"></div></div>
    <div class="bar right" id="foes"></div>
  </div>
  <canvas id="radar" width="176" height="176"></canvas>
  <div id="dmgtaken">Damage taken: <b id="dtk">0</b></div>
  <div id="banner"></div>
  <button id="pauseBtn">❚❚</button>
  <div id="keys">WASD move · SPACE attack · K block (tap right before a hit = PARRY) · L dash</div>
  <div id="joyZone"><div id="joy"><div id="knob"></div></div></div>
  <div id="btns">
    <button id="bDash">💨</button>
    <button id="bBlk">🛡️</button>
    <button id="bAtk">⚔️</button>
  </div>
</div>
<div id="ui"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const ROSTER=RAW.map((a,i)=>({key:i,name:a[0],r:a[1],w:a[2],hue:a[3],red:!!a[4],scale:1}));
const BOSSES=[
 {name:'Boss Bamboo Brute',r:2,w:5, hue:30},

];
const WORLDS=[
 {id:'earth',n:'Bamboo Valley',el:'Earth',ico:'🌿',col:'#5fae4a',col2:'#2f6d2a',sky:0xa6dcae,hT:0xffffff,hB:0x556b3a,sun:0xfff2cc,sI:1,top:0x76a84a,side:0x6b4a2b,rar:[0,1],tip:'Rocks block the way'},

function tone(f,d,type,v,slide){
 if(S.mute)return;const a=au();if(!a)return;
 try{const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.value=f;
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+d);
 g.gain.value=v||.08;g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
 o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}catch(e){}
}

 const armR=mkArm(.64),armL=mkArm(-.64);

 // head

 mesh(GEO.sph,furM,.52,.46,.48,0,0,0,head);
 const glowEyes=R>=5;
 const eyeM=glowEyes?M(0xff3333,{emissive:0xff1111,emissiveIntensity:1.4}):M(0xffffff);
 [-1,1].forEach(s=>{

  mesh(GEO.sph,eyeM,.055,.055,.045,s*.2,.06,.45,head);
  if(!glowEyes)mesh(GEO.sph,blkM,.028,.028,.025,s*.2,.06,.49,head);
 });
 mesh(GEO.sph,blkM,.09,.06,.07,0,-.09,.46,head);
 if(red){[-1,1].forEach(s=>mesh(GEO.sph,whtM,.17,.13,.12,s*.2,-.06,.4,head));mesh(GEO.sph,whtM,.2,.1,.1,0,.26,.38,head);
  for(let i=0;i<6;i++){const seg=mesh(GEO.sph,i%2?blkM:furM,.2-i*.012,.2-i*.012,.26,0,.55-i*.05,-.62-i*.34,body);}}
 const hb=mesh(GEO.tor,accM,.5,.5,.5,0,.2,0,head);hb.rotation.x=Math.PI/2;
 const tail1=mesh(GEO.box,accM,.1,.3,.04,-.1,.1,-.52,head);tail1.rotation.z=.3;

 let cape=null;
 if(R>=2){cape=new THREE.Group();cape.position.set(0,1.38,-.36);body.add(cape);
  const cm=M(accC,{roughness:.6,side:THREE.DoubleSide});const cp=mesh(GEO.box,cm,.95,1.0,.04,0,-.5,0,cape);cp.castShadow=false;}
 if(R>=3){[-1,1].forEach(s=>mesh(GEO.sph,accM,.24,.18,.24,s*.62,1.45,0,body));}
 if(R>=4){for(let i=0;i<5;i++){const a=i/5*TAU;mesh(GEO.cone,goldM,.07,.22,.07,Math.cos(a)*.28,.46,Math.sin(a)*.28,head);}
  const cr=mesh(GEO.tor,goldM,.3,.3,.3,0,.38,0,head);cr.rotation.x=Math.PI/2;}
 // floor ring
 const ring=new THREE.Mesh(GEO.ring,new THREE.MeshBasicMaterial({color:rc,transparent:true,opacity:.75,side:THREE.DoubleSide}));

const partGroup=new THREE.Group();scene.add(partGroup);
const PART=[];
for(let i=0;i<160;i++){const m=new THREE.Mesh(GEO.box,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true}));m.visible=false;m.userData={life:0,max:1,vx:0,vy:0,vz:0,g:9,s:.1};partGroup.add(m);PART.push(m);}
function burst(x,y,z,color,n,spd,size,grav){
 for(let k=0;k<n;k++){const m=PART.find(q=>!q.visible);if(!m)return;
  m.visible=true;m.position.set(x,y,z);m.material.color.set(color);
  const a=Math.random()*TAU,e=rnd(-.2,1.2),s=spd*rnd(.4,1.2);
  const u=m.userData;u.vx=Math.cos(a)*Math.cos(e)*s;u.vz=Math.sin(a)*Math.cos(e)*s;u.vy=Math.sin(e)*s+spd*.3;
  u.life=u.max=rnd(.3,.7);u.g=grav===undefined?9:grav;u.s=size||.1;m.scale.setScalar(u.s);m.material.opacity=1;}
}
const BOLTS=[];
function bolt(x,z){
 const n=9;
 for(let j=0;j<3;j++){
  const arr=new Float32Array(n*3);let cx=x,cz=z;
  for(let i=0;i<n;i++){const y=14*(1-i/(n-1));arr[i*3]=i===n-1?x:cx+rnd(-.7,.7)+j*.05;arr[i*3+1]=y;arr[i*3+2]=i===n-1?z:cz+rnd(-.7,.7);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(arr,3));
  const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:j===0?0xffffff:0x8fe8ff}));scene.add(l);BOLTS.push({l,t:.25});
 }
 flash('#cfefff',.55);
}
function flash(color,op){const f=$('flash');f.style.background=color;f.style.transition='none';f.style.opacity=op;void f.offsetWidth;f.style.transition='opacity .35s';f.style.opacity=0;}
const FT=[];
function ftext(f,text,cls){const el=document.createElement('div');el.className='ft '+(cls||'');el.textContent=text;$('ftl').appendChild(el);FT.push({el,x:f.x+rnd(-.3,.3),y:(2.4+rnd(0,.4))*f.scale,z:f.z,t:0});}
const _v=new THREE.Vector3();
function updFX(dt,rdt){
 for(const m of PART){if(!m.visible)continue;const u=m.userData;u.life-=dt;if(u.life<=0){m.visible=false;continue;}
  m.position.x+=u.vx*dt;m.position.y+=u.vy*dt;m.position.z+=u.vz*dt;u.vy-=u.g*dt;
  const k=u.life/u.max;m.scale.setScalar(u.s*(.3+k));m.material.opacity=k;}
 for(let i=BOLTS.length-1;i>=0;i--){const b=BOLTS[i];b.t-=rdt;if(b.t<=0){scene.remove(b.l);b.l.geometry.dispose();BOLTS.splice(i,1);}}
 for(let i=FT.length-1;i>=0;i--){const q=FT[i];q.t+=rdt;if(q.t>1.1){q.el.remove();FT.splice(i,1);continue;}
  _v.set(q.x,q.y+q.t*.8,q.z).project(camera);
  q.el.style.left=((_v.x*.5+.5)*innerWidth)+'px';q.el.style.top=((-_v.y*.5+.5)*innerHeight)+'px';q.el.style.opacity=clamp(1.6-q.t*1.4,0,1);}
}

function dot(f,a){if(f.dead||state!=='fight')return;f.hp-=a;if(f.hp<=0){f.hp=0;koFighter(f);}}
function koFighter(f,killer){
 if(f.dead)return;
 killer=killer||f.lastHitBy;
 f.dead=true;f.hp=0;f.koT=0;f.atk=-1;f.blocking=false;

 SFX.ko();burst(f.x,1.2,f.z,0xffffff,24,9,.14);burst(f.x,1.2,f.z,RAR[f.p.r].c,18,7,.12);

 ftext(f,'K.O.!','brk');shake=Math.max(shake,.4);

function applyHit(a,d,dmg,kb,crit){
 dmg=Math.max(1,Math.round(dmg));d.hp-=dmg;d.hurt=.25;d.lastHitBy=a;
 const dx=d.x-a.x,dz=d.z-a.z,l=Math.hypot(dx,dz)||1;
 const po=d.poise>0,kk=kb*(po?.5:1);
 d.kx+=dx/l*kk;d.kz+=dz/l*kk;
 if(!po){d.stun=Math.max(d.stun,.22);d.atk=-1;d.poise=.8;}
 const hammer=a.p.w===12;
 if(hammer){d.stun=Math.max(d.stun,.5);d.atk=-1;}
 if(a.p.w===9){d.slow=2;ftext(d,'❄️ SLOW','blk');}
 if(a.p.w===10){d.burn=3;d.burnA=0;ftext(d,'🔥 BURN','brk');}
 ftext(d,(crit?'CRIT ':'')+dmg,crit?'crit':(d.isPlayer?'dmgP':'dmgE'));
 const col=hammer?0x9fe8ff:(a.p.w===10?0xff8a1a:(a.p.w===9?0xbff0ff:0xffe08a));
 burst(d.x,1.3*d.scale,d.z,col,10+Math.round(dmg/3),6,.1);
 SFX.hit();shake=Math.max(shake,.12+dmg*.007);hitStop=Math.min(.1,.03+dmg*.0025);
 if(hammer){bolt(d.x,d.z);SFX.thunder();shake=Math.max(shake,.7);hitStop=.12;burst(d.x,.3,d.z,0x9fe8ff,20,10,.16);}
 if(d.hp<=0){d.hp=0;koFighter(d);}
}
function hitOne(a,d){
 const dx=d.x-a.x,dz=d.z-a.z,dist=Math.hypot(dx,dz)||.001;
 const reach=a.wep.reach*a.scale+.55*d.scale;
 const fx=Math.sin(a.face),fz=Math.cos(a.face),dt=(dx*fx+dz*fz)/dist;
 if(dist>reach||dt<.3)return false;
 if(d.dash>0){ftext(d,'DODGE!','dod');return false;}
 let dmg=a.wep.dmg*a.pow*rnd(.9,1.1)*a.dmgMul*(1-d.def);
 const crit=Math.random()<.1;if(crit)dmg*=1.5;
 if(d.blocking){
  if(d.blockT<.16){a.stun=.85;a.atk=-1;a.poise=0;d.guard=Math.min(100,d.guard+25);
   ftext(d,'PARRY!','par');SFX.parry();hitStop=.1;shake=.3;burst(d.x+dx/dist*.8,1.4,d.z+dz/dist*.8,0xffe14d,16,7,.12);flash('#ffe9a0',.25);return true;}
  const chip=Math.max(1,Math.round(dmg*.2));d.hp-=chip;d.lastHitBy=a;
  d.guard-=Math.max(14,a.wep.dmg*a.pow*1.7);
  d.kx+=dx/dist*3;d.kz+=dz/dist*3;
  ftext(d,'BLOCK','blk');SFX.block();burst(d.x-dx/dist*.5,1.3,d.z-dz/dist*.5,0x7fd0ff,8,5,.09);shake=Math.max(shake,.1);
  if(d.guard<=0){d.guard=0;d.blocking=false;d.stun=1;ftext(d,'GUARD BREAK!','brk');SFX.hit();}
  if(d.hp<=0){d.hp=0;koFighter(d,a);}
  return true;
 }
 applyHit(a,d,dmg,a.wep.kb,crit);
 return true;
}
function resolveAttack(a){
 let any=false;
 if(a.p.w===12)burst(a.x+Math.sin(a.face)*1.8,.2,a.z+Math.cos(a.face)*1.8,0x9fe8ff,6,5,.1);
 for(const d of FIGHTERS){if(d===a||d.dead)continue;if(hitOne(a,d))any=true;if(a.dead)break;}
 a.whiff=!any;

}
function stepFighter(f,I,dt){
 const o=f.opp||f;
 if(f.dead){f.koT+=dt;f.vx=f.vz=0;return;}
 f.dashCd-=dt;f.blockT+=dt;f.stun-=dt;f.slow-=dt;f.hurt-=dt;f.poise-=dt;f.stamD-=dt;if(f.stamD<=0)f.stam=Math.min(100,f.stam+(f.blocking?12:34)*dt);

 const stunned=f.stun>0;
 if(stunned&&f.atk>=0)f.atk=-1;
 const wantBlock=I.block&&!stunned&&f.atk<0&&f.dash<=0&&f.guard>5;
 if(wantBlock&&!f.blocking){f.blocking=true;f.blockT=0;}
 if(!wantBlock)f.blocking=false;
 if(f.blocking){f.guard-=22*dt;if(f.guard<=0){f.guard=0;f.blocking=false;f.stun=.9;ftext(f,'GUARD BREAK!','brk');}}
 else f.guard=Math.min(100,f.guard+(f.atk<0?22:10)*dt);
 // dash
 if(I.dash&&f.dashCd<=0&&!stunned&&f.dash<=0&&f.stam>=22){
  let dx=I.mx,dz=I.mz,l=Math.hypot(dx,dz);
  if(l<.2){dx=f.x-o.x;dz=f.z-o.z;l=Math.hypot(dx,dz)||1;}
  dx/=l;dz/=l;f.dash=.2;f.dashCd=.85;f.stam-=22;f.stamD=.5;f.dvx=dx*15;f.dvz=dz*15;f.atk=-1;f.blocking=false;
  SFX.dash();burst(f.x,.4,f.z,0xffffff,8,3,.1,0);
 }
 // attack start
 const acost=10+f.wep.dmg*.55;
 if(I.attack&&f.atk<0&&!stunned&&f.dash<=0&&!f.blocking&&f.stam>=acost){f.atk=0;f.atkT=f.wep.wind;f.stam-=acost;f.stamD=.55;SFX.swing();}
 if(f.atk>=0){
  f.atkT-=dt;
  if(f.atk===0&&f.atkT<=0){resolveAttack(f);if(!f.dead&&f.atk===0){f.atk=1;f.atkT=.14;}}
  else if(f.atk===1){
   if(f.model.wep&&Math.random()<.9){const tp=f.model.wep.localToWorld(_v.set(0,f.wep.len,0));burst(tp.x,tp.y,tp.z,f.p.w===12?0x9fe8ff:(f.p.w===10?0xff8a1a:0xffffff),1,.5,.09,0);}
   if(f.atkT<=0){f.atk=2;f.rec=f.wep.cd*(f.whiff?1.7:1);f.atkT=f.rec;}}
  else if(f.atk===2&&f.atkT<=0)f.atk=-1;
 }
 // movement
 let tx=I.mx,tz=I.mz;const tl=Math.hypot(tx,tz);if(tl>1){tx/=tl;tz/=tl;}
 const sp=f.spd*(f.slow>0?.55:1)*(f.atk>=0?.4:1)*(f.blocking?.5:1);
 if(stunned){tx=0;tz=0;}
 if(f.dash>0){f.vx=f.dvx;f.vz=f.dvz;f.dash-=dt;}
 else{const k=1-Math.exp(-ENV.grip*dt);f.vx+=(tx*sp-f.vx)*k;f.vz+=(tz*sp-f.vz)*k;}
 if(ENV.cur){const r=Math.hypot(f.x,f.z)||1;f.kx+=(f.z/r)*ENV.cur*dt;f.kz+=(-f.x/r)*ENV.cur*dt;}
 if(ENV.gStr){f.kx+=ENV.gx*ENV.gStr*dt;f.kz+=ENV.gz*ENV.gStr*dt;}
 const kd=Math.exp(-ENV.kd*dt);f.kx*=kd;f.kz*=kd;
 f.x+=(f.vx+f.kx)*dt;f.z+=(f.vz+f.kz)*dt;
 for(const p of POOLS){if(Math.hypot(f.x-p.x,f.z-p.z)<p.r){dot(f,7*dt);if(Math.random()<.35)burst(f.x,.3,f.z,0xff6a1a,1,3,.1,-2);}}
 for(const r of ROCKS){const dx=f.x-r.x,dz=f.z-r.z,d=Math.hypot(dx,dz),m=r.r+.5*f.scale;if(d<m&&d>0){f.x=r.x+dx/d*m;f.z=r.z+dz/d*m;}}

 if(rr>lim){const nx=f.x/rr,nz=f.z/rr;f.x=nx*lim;f.z=nz*lim;
  const vo=f.kx*nx+f.kz*nz;if(vo>0){f.kx-=nx*vo*1.3;f.kz-=nz*vo*1.3;}
  const wo=f.vx*nx+f.vz*nz;if(wo>0){f.vx-=nx*wo;f.vz-=nz*wo;}}
 // face opponent
 const ang=Math.atan2(o.x-f.x,o.z-f.z);let da=ang-f.face;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;

}

function animFighter(f,dt,t){

  m.armR.rotation.x=.4;m.armL.rotation.x=.4;m.shield.visible=false;m.legR.rotation.x=0;m.legL.rotation.x=0;return;}
 m.legR.rotation.x=Math.sin(f.ph)*.7*mv;m.legL.rotation.x=-Math.sin(f.ph)*.7*mv;
 m.body.position.y=Math.abs(Math.sin(f.ph))*.07*mv+idle*.015;
 let ar=-.75+idle*.04,al=Math.sin(f.ph+Math.PI)*.5*mv,lean=0,yoff=0;
 if(f.victory){ar=-3;al=-3;yoff=Math.abs(Math.sin(t*7))*.35;}
 else if(f.blocking){ar=-1.9;al=-1.9;}
 else if(f.atk===0){const k=1-clamp(f.atkT/f.wep.wind,0,1);ar=lerp(-.75,-2.8,k);lean=-.15*k;}
 else if(f.atk===1){const k=1-clamp(f.atkT/.14,0,1);ar=lerp(-2.8,-.15,k*k*(3-2*k));lean=.35*k;}
 else if(f.atk===2){const k=1-clamp(f.atkT/(f.rec||f.wep.cd),0,1);ar=lerp(-.15,-.75,k);lean=.2*(1-k);}
 if(f.dash>0)lean=.5;

const ZERO={mx:0,mz:0,attack:false,block:false,dash:false};
function pickTarget(f){
 let best=null,bs=1e9;
 if(!f.isPlayer&&P&&!P.dead&&FIGHTERS.length>2){
  // each bot sometimes hunts the player, sometimes picks on another bot
  const close=Math.hypot(P.x-f.x,P.z-f.z)<4.5;
  if(Math.random()<(close?.7:.45)||f.lastHitBy===P&&Math.random()<.7){f.opp=P;return;}
  for(const x of FIGHTERS){if(x===f||x.dead||x.isPlayer)continue;
   let sc=Math.hypot(x.x-f.x,x.z-f.z)+x.hp*.015+rnd(0,2);
   if(x===f.lastHitBy)sc-=2.5;
   if(sc<bs){bs=sc;best=x;}}
  f.opp=best||P;return;
 }
 for(const x of FIGHTERS){if(x===f||x.dead)continue;
  let sc=Math.hypot(x.x-f.x,x.z-f.z);
  if(x===f.opp)sc-=.8;
  if(sc<bs){bs=sc;best=x;}}
 f.opp=best||f;
}
function retarget(f,dt){f.rtT-=dt;if(!f.opp||f.opp===f||f.opp.dead||f.rtT<=0){pickTarget(f);f.rtT=f.isPlayer?.12:rnd(1,2);}}
function aiIntent(f,o,dt){
 const A=f.ai,I={mx:0,mz:0,attack:false,block:false,dash:false};
 if(f.stun>0||f.dead||!o||o===f||o.dead)return I;
 const dx=o.x-f.x,dz=o.z-f.z,d=Math.hypot(dx,dz)||1,nx=dx/d,nz=dz/d;
 const reach=f.wep.reach*f.scale,want=reach*.82;
 A.flipT-=dt;if(A.flipT<=0){A.strafe=Math.random()<.5?1:-1;A.flipT=rnd(.8,2.4);}
 let mx=0,mz=0;
 if(d>want+.35){mx=nx;mz=nz;}else if(d<want-.6){mx=-nx*.7;mz=-nz*.7;}
 mx+=-nz*A.strafe*.55;mz+=nx*A.strafe*.55;
 for(const x of FIGHTERS){if(x===f||x===o||x.dead)continue;const qx=f.x-x.x,qz=f.z-x.z,qd=Math.hypot(qx,qz)||1;if(qd<2.2){mx+=qx/qd*.8;mz+=qz/qd*.8;}}
 for(const p of POOLS){const px=f.x-p.x,pz=f.z-p.z,pd=Math.hypot(px,pz)||1;if(pd<p.r+1.4){mx+=px/pd*2.6;mz+=pz/pd*2.6;}}
 for(const r of ROCKS){const px=f.x-r.x,pz=f.z-r.z,pd=Math.hypot(px,pz)||1;if(pd<r.r+1.1){mx+=px/pd*1.2;mz+=pz/pd*1.2;}}
 const rr=Math.hypot(f.x,f.z);if(rr>ARENA_R-1.6){mx-=f.x/rr*1.6;mz-=f.z/rr*1.6;}
 const l=Math.hypot(mx,mz);if(l>1){mx/=l;mz/=l;}
 I.mx=mx;I.mz=mz;
 A.atkT-=dt;
 const rage=(f.p.boss&&f.hp<40)?.7:1,acost=10+f.wep.dmg*.55;
 if(d<reach+.4*f.scale&&f.atk<0&&A.atkT<=0&&A.blockT<=0&&f.stam>=acost){I.attack=true;A.atkT=A.gap*rage*rnd(.6,1.4);}
 if(o.atk===2&&o.whiff&&d<reach+.6&&f.atk<0&&A.diff>.25&&f.stam>=acost&&A.blockT<=0){I.attack=true;A.atkT=A.gap*rnd(.6,1);}
 let th=null;
 for(const x of FIGHTERS){if(x===f||x.dead||x.atk!==0)continue;const dd=Math.hypot(x.x-f.x,x.z-f.z);if(dd<x.wep.reach*x.scale+1.3&&x.opp===f){th=x;break;}}
 if(th){
  if(!A.seen){A.seen=true;A.reactT=A.rt*rnd(.6,1.3);const r=Math.random(),hb=f.hp<30?.2:0;A.kind=r<A.blockP+hb?1:(r<A.blockP+hb+A.dashP?2:0);}
 }else A.seen=false;
 if(A.reactT>0){A.reactT-=dt;if(A.reactT<=0){if(A.kind===1)A.blockT=.45;else if(A.kind===2)A.dashNow=true;}}
 if(A.blockT<=0&&d<reach+1.5&&Math.random()<dt*.25*A.diff)A.blockT=.5;
 if(A.blockT>0){I.block=true;A.blockT-=dt;I.mx*=.2;I.mz*=.2;I.attack=false;}
 if(A.dashNow){A.dashNow=false;if(f.dashCd<=0&&f.stam>=22){I.dash=true;I.mx=-nz*A.strafe-nx*.6;I.mz=nx*A.strafe-nz*.6;}}
 if(f.p.boss&&d>5&&f.dashCd<=0&&f.stam>=40&&Math.random()<dt*.7){I.dash=true;I.mx=nx;I.mz=nz;}
 return I;
}

/* ===================================================== PACKS ===================================================== */
function weights(boost,minR){let tot=0;const ws=RAR.map((r,i)=>{if(i<minR)return 0;const w=r.w*(1+boost*i*1.6);tot+=w;return w;});return{ws,tot};}
function rollRarity(boost,minR){const{ws,tot}=weights(boost,minR||0);let x=Math.random()*tot;for(let i=0;i<ws.length;i++){x-=ws[i];if(x<=0&&ws[i]>0)return i;}return minR||0;}
function oddsPct(boost,minR){const{ws,tot}=weights(boost,minR||0);return ws.map(w=>w/tot*100);}
function give(p){const had=S.owned[p.key]|0;S.owned[p.key]=had+1;if(had){const d=RAR[p.r].dust;S.coins+=d;return{p,isNew:false,dust:d};}return{p,isNew:true,dust:0};}
const PACKS={
 single:{cost:150,n:1},
 skill:{cost:1200,n:10},
 legend:{cost:2500,n:1}
};
function buyPack(kind){
 const k=PACKS[kind];if(S.coins<k.cost){toast('Not enough coins 🪙');return;}
 S.coins-=k.cost;const boost=skill()/100,res=[];
 if(kind==='single'){res.push(give(pick(ROSTER.filter(p=>p.r===rollRarity(0,0)))));}
 else if(kind==='skill'){
  const rs=[];for(let i=0;i<10;i++)rs.push(rollRarity(boost,0));
  if(!rs.some(r=>r>=2))rs[9]=rollRarity(boost,2);
  rs.sort((a,b)=>a-b);rs.forEach(r=>res.push(give(pick(ROSTER.filter(p=>p.r===r)))));
 }else{res.push(give(pick(ROSTER.filter(p=>p.r===rollRarity(boost,4)))));}
 save();revealScreen(res);
}

/* ===================================================== UI ===================================================== */
function ui(html,cls){const u=$('ui');u.innerHTML='<div class="scr '+(cls||'')+'">'+html+'</div>';}
function hideUI(){$('ui').innerHTML='';}
function topbar(title,back){return `<div class="top">${back?`<button class="btn sm alt" data-act="${back}">◀ Back</button>`:'<span style="width:70px"></span>'}<div class="ttl">${title}</div><div class="coins">🪙 ${S.coins.toLocaleString()}</div></div>`;}
let toastT=0;
function toast(t){let e=document.querySelector('.toast');if(e)e.remove();e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);clearTimeout(toastT);toastT=setTimeout(()=>e.remove(),1800);}
function cardHTML(p,o){o=o||{};const rc=RAR[p.r],owned=S.owned[p.key]|0,show=owned>0||o.show;
 return `<div class="card r${p.r}${o.back?' back':''}${o.sel?' selc':''}" data-act="${o.act||''}" data-v="${o.v!==undefined?o.v:p.key}" style="--rc:${rc.c}">
  <div class="rn ${p.r===7?'rb':''}">${rc.n}</div>
  <img src="${thumb(p)}" class="${show?'':'sil'}" alt="">
  <div class="cn">${show?p.name:'???'}</div>
  <div class="cw">${WEP[p.w].ico} ${show?WEP[p.w].n:'?'}</div>
  ${owned>1?`<div class="cnt">x${owned}</div>`:''}${(o.eq&&S.sel===p.key)?'<div class="eqd">EQUIPPED</div>':''}</div>`;}

function mainMenu(){
 state='menu';paused=false;hudShow(false);hideUI();
 setMenuScene();
 const p=ROSTER[S.sel],rc=RAR[p.r];
 ui(`<div class="menu"><div><div class="logo">🐼 PANDA FIGHT <span>3D</span></div><div class="tag">Collect · Equip · Smash</div></div>
  <div></div>
  <div class="menuBot">
   <div class="eqname"><span style="color:${rc.c}">${rc.n}</span> · ${p.name} · ${WEP[p.w].ico} ${WEP[p.w].n}</div>
   <button class="btn big" data-act="worlds">⚔️ FIGHT</button>
   <button class="btn alt" data-act="freeplay">\u{1F465} FREEPLAY \u00B7 5-Panda Brawl</button>
   <div class="row"><button class="btn alt" data-act="collection">🐼 Pandas ${ownedCount()}/50</button><button class="btn alt" data-act="shop">🎁 Shop</button></div>
   <div class="row"><button class="btn sm alt" data-act="help">❓ How to play</button><button class="btn sm alt" data-act="settings">⚙️ Settings</button></div>
   <div class="stats">🪙 ${S.coins.toLocaleString()} · 🏆 ${S.wins} wins · 🎯 Skill ${skill()}</div>
  </div></div>`);
}
function freeplayScreen(){
 state='menu';hudShow(false);
 const sel=ROSTER[S.sel],rc=RAR[sel.r];
 ui(topbar('Freeplay','menu')+`<div class="eqbar"><img src="${thumb(sel)}" alt=""><div><b style="color:${rc.c}">${sel.name}</b><br><small>${rc.n} \u00B7 ${WEP[sel.w].ico} ${WEP[sel.w].n}</small></div><button class="btn sm alt" data-act="collection">Change</button></div>
 <div class="panel" style="text-align:center;margin-top:0"><b>\u{1F465} 1v1v1v1v1 free-for-all</b><br><small>You and 4 rivals in one arena. Everyone attacks everyone. Last panda standing wins! Coins for wins and knockouts \u2014 no campaign progress.</small></div>
 <div class="wgrid">${WORLDS.map((w,i)=>`<div class="wc" data-act="ffa" data-v="${i}" style="background:linear-gradient(135deg,${w.col},${w.col2})"><div class="big">${w.ico}</div><h3>${w.n}</h3><div class="el">${w.el}</div><div style="font-size:12px;opacity:.9;margin-top:8px">${w.tip}</div></div>`).join('')}</div>`,'solid');
}
function setMenuScene(){
 clearFighters();buildArena(clamp(S.unlocked-1,0,4));
 menuF=mkFighter(ROSTER[S.sel],true,0);menuF.opp=menuF;
}
function worldsScreen(){
 state='menu';hudShow(false);
 const sel=ROSTER[S.sel],rc=RAR[sel.r];
 ui(topbar('Choose World','menu')+`<div class="eqbar"><img src="${thumb(sel)}" alt=""><div><b style="color:${rc.c}">${sel.name}</b><br><small>${rc.n} · ${WEP[sel.w].ico} ${WEP[sel.w].n}</small></div><button class="btn sm alt" data-act="collection">Change</button></div>
 <div class="wgrid">${WORLDS.map((w,i)=>{
  const lock=i>=S.unlocked,pr=S.prog[i],n=pr%5;
  let pips='';for(let j=0;j<5;j++)pips+=`<div class="pip ${j<n?'on':''} ${j===4?'boss':''}">${j===4?'💀':(j<n?'✔':'')}</div>`;
  return `<div class="wc ${lock?'lock':''}" ${lock?'':`data-act="play" data-v="${i}"`} style="background:linear-gradient(135deg,${w.col},${w.col2})">
   <div class="big">${lock?'🔒':w.ico}</div><h3>World ${i+1}: ${w.n}</h3><div class="el">${w.el} · Difficulty ${'⭐'.repeat(i+1)}</div>
   <div class="pips">${pips}</div><div class="st">${lock?'Beat the boss of World '+i+' to unlock':(n===4?'💀 BOSS FIGHT next!':'Next: Fight '+(n+1)+' of 5')}${S.claimed[i]?' · ✅ Cleared':''}</div>
   <div style="font-size:12px;opacity:.9;margin-top:4px">${w.tip}</div></div>`;}).join('')}</div>`,'solid');
}
let colSel=null;
function collectionScreen(){
 state='menu';hudShow(false);
 const list=ROSTER.slice().sort((a,b)=>a.r-b.r||a.key-b.key);
 colSel=S.sel;
 ui(topbar(`Pandas ${ownedCount()}/50`,'menu')+`<div class="cgrid">${list.map(p=>cardHTML(p,{act:'sel',eq:true,sel:p.key===colSel})).join('')}</div><div class="detail" id="detail"></div>`,'solid');
 detailPanel();
}
function statBar(l,v,max){return `<div style="font-size:12px;font-weight:800">${l} <span style="float:right">${v}</span></div><div class="sbar"><i style="width:${clamp(v/max*100,4,100)}%"></i></div>`;}
function detailPanel(){
 const p=ROSTER[colSel],rc=RAR[p.r],w=WEP[p.w],own=(S.owned[p.key]|0)>0;
 $('detail').innerHTML=`<div class="dr"><img src="${thumb(p)}" class="${own?'':'sil'}" style="${own?'':'filter:brightness(0) opacity(.5)'}" alt="">
  <div style="flex:1"><div class="${p.r===7?'rb':''}" style="font-weight:900;font-size:13px;color:${rc.c}">${rc.n.toUpperCase()}</div>
  <div style="font-size:20px;font-weight:900">${own?p.name:'???'}</div>
  <div style="font-size:13px;opacity:.9;margin-bottom:6px">${w.ico} ${w.n}${p.w===12?' — the ultimate weapon!':''}</div>
  ${statBar('Damage / hit',Math.round(w.dmg*rc.mul),50)}${statBar('Reach',w.reach.toFixed(1),3.2)}${statBar('Defense',Math.round(p.r*1.8)+'%',13)}</div></div>
  <div style="margin-top:8px;text-align:center">${own?(S.sel===p.key?'<button class="btn dim sm">Equipped ✔</button>':'<button class="btn grn" data-act="equip" data-v="'+p.key+'">Equip</button>'):'<div style="font-weight:800;opacity:.85">Not unlocked yet — find it in the Shop!</div>'}</div>`;
 document.querySelectorAll('.cgrid .card').forEach(c=>c.classList.toggle('selc',+c.dataset.v===colSel));
}
function shopScreen(){
 state='menu';hudShow(false);
 const sk=skill(),oS=oddsPct(sk/100,0),oB=oddsPct(0,0),oL=oddsPct(sk/100,4);
 const rows=(o,from)=>RAR.map((r,i)=>i<from?'':`<div style="color:${r.c}"><span>${r.n}</span><span>${o[i]<1?o[i].toFixed(2):o[i].toFixed(1)}%</span></div>`).join('');
 const bt=(k,c)=>`<button class="btn ${S.coins<c?'dim':''}" data-act="buy" data-v="${k}">🪙 ${c.toLocaleString()}</button>`;
 ui(topbar('Shop','menu')+`<div class="panel" style="text-align:center;margin-top:0"><b>🎯 Your Skill: ${sk}/100</b><div class="skillbar"><i style="width:${sk}%"></i></div>
 <small style="opacity:.85">Win with lots of health left and clear bosses to raise your skill. Higher skill = better Skill Pack odds!</small></div>
 <div class="packs">
  <div class="pack"><div class="pi">🎁</div><h3>Bamboo Pack</h3><p>1 random panda</p><div class="odds">${rows(oB,0)}</div>${bt('single',150)}</div>
  <div class="pack skillp"><div class="pi">🔥🎁</div><h3>Skill Pack ×10</h3><p>10 random pandas · odds boosted by your skill · at least 1 Rare+</p><div class="odds">${rows(oS,0)}</div>${bt('skill',1200)}</div>
  <div class="pack legend"><div class="pi">👑🎁</div><h3>Legend Pack</h3><p>1 panda — Legendary or better!</p><div class="odds">${rows(oL,4)}</div>${bt('legend',2500)}</div>
 </div><p style="text-align:center;opacity:.85;font-size:13px">Duplicates turn into coins. Beat each world's first boss for a free panda!</p>`,'solid');
}
let revealList=[];
function revealScreen(res){
 revealList=res;state='menu';
 ui(topbar('Pack Opened!','')+`<div style="text-align:center;margin-bottom:10px;opacity:.9;font-weight:800">Tap a card to reveal it</div>
 <div class="cgrid" style="max-width:${res.length===1?'160px':'980px'}">${res.map((g,i)=>`<div style="position:relative">${cardHTML(g.p,{back:true,show:true,act:'rev',v:i})}${g.isNew?'<div class="nw">NEW!</div>':`<div class="dust">DUPLICATE +${g.dust}🪙</div>`}</div>`).join('')}</div>
 <div class="row" style="margin-top:16px"><button class="btn alt" data-act="revall">Reveal All</button><button class="btn grn" data-act="shop">Done</button></div>`,'solid');
 SFX.beep();
}
function revealOne(i){
 const c=document.querySelector(`.card[data-act="rev"][data-v="${i}"]`);if(!c||!c.classList.contains('back'))return;
 c.classList.remove('back');c.classList.add('pop');SFX.reveal(revealList[i].p.r);
 if(revealList[i].p.r>=5)flash('#ffffff',.3);
}
function helpScreen(){
 ui(topbar('How to Play','menu')+`<div class="panel"><h3>🎮 Controls</h3>
 <p><b>Phone:</b> drag on the left side to move · ⚔️ attack · 🛡️ block (hold) · 💨 dash<br><b>Keyboard:</b> WASD move · SPACE attack · K block · L dash</p>
 <h3>⚔️ Fighting</h3><ul><li>Everyone has <b>100 health</b>. First to zero loses.</li><li>Attacks and dashes cost <b>stamina</b> (yellow bar). Mash and you run dry.</li><li>A <b>missed swing leaves you wide open</b> and smart rivals will punish it.</li><li><b>FREEPLAY</b> is a 5-panda free-for-all: last panda standing wins. Rivals fight each other too!</li>
 <li><b>Tap block just before a hit lands = PARRY</b> — the attacker gets stunned!</li>
 <li>Dash dodges through attacks. Holding block too long breaks your guard.</li>
 <li>The <b>less damage you take, the more coins you win</b> (flawless = bonus!).</li>
 <li>Every <b>5th fight is a BOSS</b> 💀 (triple coins + a free panda the first time).</li></ul>
 <h3>🐼 Pandas</h3><p>50 pandas from Common to Ultimate. Each carries a weapon — the <b>⚡ Thunder Hammer</b> is the strongest of all, and only ONE panda in the whole game owns it: the Ultimate Red Panda!</p>
 <h3>🌍 Worlds</h3><p>5 elemental arenas: Earth, Water, Ice, Air and Lava. Each world is harder than the last and has its own hazards.</p></div>
 <div class="row"><button class="btn grn" data-act="menu">Got it!</button></div>`,'solid');
}
function settingsScreen(){
 ui(topbar('Settings','menu')+`<div class="panel"><div class="row"><button class="btn alt" data-act="mute">${S.mute?'🔇 Sound: OFF':'🔊 Sound: ON'}</button></div>
 <p style="text-align:center;opacity:.8">Wins: ${S.wins} · Losses: ${S.losses} · Pandas: ${ownedCount()}/50</p>
 <div class="row"><button class="btn sm dim" data-act="reset">Reset all progress</button></div></div>`,'solid');
}
function pauseScreen(){ui(`<div class="panel res" style="text-align:center;margin-top:20vh"><h1>⏸ Paused</h1><div class="row"><button class="btn grn" data-act="resume">Resume</button><button class="btn alt" data-act="quit">Quit to Menu</button></div></div>`,'dark');}

const ACT={
 menu:()=>mainMenu(),freeplay:()=>freeplayScreen(),ffa:v=>startFight(+v,true),worlds:()=>worldsScreen(),collection:()=>collectionScreen(),shop:()=>shopScreen(),help:()=>helpScreen(),settings:()=>settingsScreen(),
 play:v=>startFight(+v,false),
 sel:v=>{colSel=+v;detailPanel();},
 equip:v=>{S.sel=+v;save();detailPanel();document.querySelectorAll('.cgrid .card').forEach(c=>{const old=c.querySelector('.eqd');if(old)old.remove();if(+c.dataset.v===S.sel){const d=document.createElement('div');d.className='eqd';d.textContent='EQUIPPED';c.appendChild(d);}});},
 buy:v=>buyPack(v),rev:v=>revealOne(+v),
 revall:()=>{revealList.forEach((g,i)=>setTimeout(()=>revealOne(i),i*140));},
 mute:()=>{S.mute=!S.mute;save();settingsScreen();},
 reset:()=>{if(confirm('Really erase ALL progress?')){S=defSave();save();mainMenu();}},
 resume:()=>{paused=false;hideUI();},
 quit:()=>{paused=false;mainMenu();}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;if(!a)return;au();if(ACT[a])ACT[a](el.dataset.v,el);});
$('pauseBtn').addEventListener('click',()=>{if(state==='fight'||state==='countdown'){paused=true;pauseScreen();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(state==='fight'||state==='countdown')&&!paused){paused=true;pauseScreen();}});
addEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){if(paused){paused=false;hideUI();}else if(state==='fight'||state==='countdown'){paused=true;pauseScreen();}}});

/* ===================================================== MAIN LOOP ===================================================== */
let last=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 const rdt=Math.min(.05,(now-last)/1000);last=now;
 if(!paused){
  T+=rdt;
  if(state==='menu'){menuUpdate(rdt);}
  else if(P){fightUpdate(rdt);}
  const sd=rdt*(state==='ko'?timeScale:1);
  arenaUpd(T,rdt);updFX(sd,rdt);
 }
 renderer.render(scene,camera);
}
mainMenu();
if(!S.seenHelp){S.seenHelp=true;save();helpScreen();}
requestAnimationFrame(loop);
</script>
