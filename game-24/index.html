<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#9fd8ff;font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.box{background:rgba(18,26,46,.84);border:2px solid rgba(255,255,255,.18);border-radius:14px;backdrop-filter:blur(6px);box-shadow:0 6px 22px rgba(0,0,0,.35)}
#hudL{position:fixed;top:10px;left:10px;padding:10px 14px;width:260px;z-index:5}
#coName{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvlTxt{font-size:13px;color:#ffd54f;font-weight:700;margin-top:2px}
.bar{height:10px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#69f0ae,#00e5ff);transition:width .25s}
.sm{font-size:11px;opacity:.75;margin-top:3px}
#hudC{position:fixed;top:10px;left:calc((100% - 450px)/2);transform:translateX(-50%);padding:8px 22px;text-align:center;z-index:5;min-width:330px}
body.noside #hudC{left:50%}
#cash{font-size:32px;font-weight:900;color:#a5ff9e;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.stats{display:flex;gap:14px;justify-content:center;font-size:13px;margin-top:2px}
.stats b{font-weight:800}
#side{position:fixed;top:10px;right:10px;bottom:10px;width:430px;display:flex;flex-direction:column;z-index:6;transition:transform .25s}
body.noside #side{transform:translateX(120%)}
#tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px 8px 4px}
#tabs button{flex:1 1 22%;background:rgba(255,255,255,.08);border:0;color:#fff;border-radius:9px;padding:6px 2px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700}
#tabs button.on{background:#2979ff}
#tabs button:hover{background:rgba(255,255,255,.2)}
#tabs button.on:hover{background:#448aff}
#panel{flex:1;overflow-y:auto;padding:8px 10px 14px}

h3{font-size:15px;margin:8px 0 6px;color:#ffd54f}
.note{font-size:12px;opacity:.8;margin-bottom:6px;line-height:1.35}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:8px 10px;margin-bottom:7px}
.card.locked{opacity:.65}
.ct{display:flex;align-items:center;gap:8px;font-size:14px}.ic{font-size:20px}
.cb{font-size:12px;opacity:.9;margin:3px 0 4px;line-height:1.4}
.cbtn{display:flex;flex-wrap:wrap;gap:5px}
.btn{background:linear-gradient(#43a047,#2e7d32);border:0;color:#fff;border-radius:8px;padding:5px 9px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn small{font-size:11px;opacity:.95;font-weight:600}
.btn em{font-style:normal;opacity:.8}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:translateY(1px)}
.btn.dis{background:linear-gradient(#78808c,#59606b)}
.btn.alt{background:linear-gradient(#7e57c2,#5e35b1)}
.btn.gold{background:linear-gradient(#ffb300,#ef6c00)}
.btn.red{background:linear-gradient(#e53935,#b71c1c)}
.lock{font-size:12px;color:#ff8a80;font-weight:700}
.maxed{font-size:12px;color:#ffd54f;font-weight:800;padding:4px 6px}
.g{color:#a5ff9e}.r{color:#ff8a80}.y{color:#ffd54f}
.chips{margin:4px 0;font-size:11px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip{padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.12);cursor:pointer;font-weight:700}
.chip.on{background:#2979ff}.chip.off{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.ach{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:6px;font-size:11px;opacity:.5}
.ach.got{opacity:1;background:rgba(255,193,7,.18);border-color:#ffc107}

.day.cur{background:#2979ff}.day.done{background:#2e7d32}
.rnode{opacity:.55}.rnode.can{opacity:1}.rnode.done{opacity:1;border-color:#69f0ae;background:rgba(105,240,174,.12)}

#cityNav{display:none;gap:6px}
.pill{background:rgba(18,26,46,.88);border:2px solid rgba(255,255,255,.25);color:#fff;border-radius:22px;padding:8px 14px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer}
.pill:hover{background:#2979ff}
#sideToggle{position:fixed;top:10px;right:10px;z-index:7;display:none;padding:8px 12px}

#deal{position:fixed;left:calc((100% - 450px)/2);transform:translateX(-50%);bottom:18px;z-index:5;background:linear-gradient(#ffca28,#fb8c00);border:3px solid #fff;border-radius:30px;padding:12px 26px;color:#3e2723;font-weight:900;font-size:17px;font-family:inherit;cursor:pointer;box-shadow:0 6px 0 #c25e00,0 10px 20px rgba(0,0,0,.35)}
body.noside #deal{left:50%}
#deal:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #c25e00}
#toasts{position:fixed;top:112px;left:calc((100% - 450px)/2);transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
body.noside #toasts{left:50%}
.toast{background:rgba(18,26,46,.94);border:2px solid #69f0ae;border-radius:12px;padding:7px 16px;font-size:13px;font-weight:700;animation:tin .25s;max-width:440px;text-align:center}
.toast.bad{border-color:#ff5252}.toast.gold{border-color:#ffc107;background:rgba(60,40,0,.95)}
.toast.out{opacity:0;transition:opacity .5s}
@keyframes tin{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.float{position:fixed;z-index:30;pointer-events:none;font-weight:900;font-size:20px;color:#a5ff9e;text-shadow:0 2px 3px #000;animation:fl 1s forwards}
@keyframes fl{to{transform:translateY(-60px);opacity:0}}
#popup{position:fixed;z-index:15;padding:10px 12px;width:250px;font-size:12px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px}
.x{cursor:pointer;padding:0 5px;opacity:.8}
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}
#modal .mb{max-width:520px;padding:22px 26px;font-size:14px;line-height:1.5}
#modal h2{color:#ffd54f;margin-bottom:8px}
#modal li{margin-left:18px}
textarea,input[type=text]{width:100%;background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px;font-family:inherit;font-size:12px;user-select:text;-webkit-user-select:text}
textarea{height:70px;resize:vertical}

function merge(d,s){if(s===undefined||s===null)return d;if(Array.isArray(d))return Array.isArray(s)?s:d;
 if(typeof d==='object'&&d){if(typeof s!=='object')return d;const keys=Object.keys(d);if(!keys.length)return s;const o={};keys.forEach(k=>o[k]=merge(d[k],s[k]));Object.keys(s).forEach(k=>{if(!(k in o))o[k]=s[k];});return o;}
 return (typeof s===typeof d)?s:d;}

const achCount=()=>Object.keys(S.ach).length;
const locs=id=>S.placed.filter(p=>p.t===id).length;
const execCap=()=>2+S.officeSize*2;
const freeCount=d=>DIST[d].cols*DIST[d].rows-S.placed.filter(p=>p.d===d).length;
function freeIdx(d){const t=DIST[d].cols*DIST[d].rows;for(let i=0;i<t;i++){if(!S.placed.some(p=>p.d===d&&p.i===i))return i;}return -1;}
function resFx(){const r={inc:1,exp:0,hire:0,xp:1,rp:1,click:1,offline:0,biz:1,loc:0};RES.forEach(n=>{if(!S.research[n.id])return;for(const k in n.fx){if(ADD_FX.has(k))r[k]+=n.fx[k];else r[k]*=n.fx[k];}});return r;}
const hireDisc=()=>Math.min(0.7,resFx().hire+0.05*(S.prestige.shop.hr||0));
const hireCost=k=>EMP[k].cost*Math.pow(EMP[k].growth,S.emp[k])*(1-hireDisc());
const trainCost=k=>EMP[k].cost*8*Math.pow(3,S.train[k]);
const deskCost=()=>250*Math.pow(1.2,S.desks);
const staffCap=(b,n)=>8+4*n;
const staffCost=b=>b.staff.cost*Math.pow(1.13,S.biz[b.id].staff);
const upCost=(b,l)=>b.loc*3*Math.pow(3.2,l);
const locCostFor=(b,d)=>b.loc*Math.pow(b.g,locs(b.id))*DIST[d].costMul*(1-Math.min(0.5,resFx().loc));
const xpMult=()=>resFx().xp*(1+0.1*(S.prestige.shop.xp||0))*(1+0.03*S.emp.executive);
const lpGain=()=>Math.floor(Math.sqrt(S.runEarned/250000));
const lpAvail=()=>S.prestige.lp-S.prestige.spent;

function calc(){
 const r=resFx(),tr=t=>1+0.25*S.train[t],sz=SIZES[S.officeSize];
 const mgr=S.emp.manager*0.04*tr('manager');
 const work=S.emp.worker*4*tr('worker')*COMP[S.compTier].mult*(1+mgr);
 const officeBase=(2*(S.officeSize+1)+work)*EQUIP[S.equipTier].mult;
 let add=1+S.emp.marketer*0.025*tr('marketer')+S.emp.executive*0.06*tr('executive')+S.emp.engineer*0.01*tr('engineer')+S.meeting*ROOMS.meeting.bonus+S.marketing*ROOMS.marketing.bonus;
 DECOR.forEach(d=>{if(S.decor[d.id])add+=d.bonus;});
 LAND.forEach(l=>{if(S.landmarks[l.id])add+=l.bonus;});
 EXCL.forEach(e=>{if(e.ok())add+=e.bonus;});
 const gm=add*r.inc*(1+0.01*achCount())*(1+0.1*S.prestige.lp)*Math.pow(1.15,S.prestige.shop.golden||0)*(1+0.01*(S.level-1));
 const out={gm,add,biz:{},officeInc:officeBase*gm};
 let gross=out.officeInc,exp=sz.rent;
 EMP_ORDER.forEach(k=>{exp+=S.emp[k]*EMP[k].wage;});
 const cnt={},sum={};
 S.placed.forEach(p=>{cnt[p.t]=(cnt[p.t]||0)+1;sum[p.t]=(sum[p.t]||0)+BIZMAP[p.t].base*DIST[p.d].income;});
 BIZ.forEach(b=>{const st=S.biz[b.id];if(!st.unlocked)return;const n=cnt[b.id]||0;
  const upM=Math.pow(1.25,st.ups[0])*Math.pow(1.2,st.ups[1]),stM=1+0.03*st.staff;
  const inc=(sum[b.id]||0)*upM*stM*gm*r.biz;
  const ox=n*b.opex*Math.pow(0.88,st.ups[2])+st.staff*b.staff.cost*0.0006;
  out.biz[b.id]={inc,exp:ox,n};gross+=inc;exp+=ox;});
 const cut=Math.min(0.75,Math.min(0.4,S.emp.accountant*0.015*tr('accountant'))+r.exp);
 out.cut=cut;out.gross=gross;out.exp=exp*(1-cut);out.net=out.gross-out.exp;
 out.rp=S.lab>=1?(LAB_RP[S.lab]+S.emp.engineer*0.08*tr('engineer'))*r.rp*(1+0.25*(S.prestige.shop.brain||0)):0;
 return out;}

 if(p){const b=BIZMAP[p.t],bi=C.biz[p.t]||{inc:0,exp:0,n:1},n=Math.max(1,bi.n);h+='<div style="font-size:13px"><b>'+b.icon+' '+b.name.replace(/s$/,'')+'</b></div><div class="cb">District bonus ×'+DIST[d].income+'<br>Chain income: <b class="g">'+money(bi.inc)+'/s</b> ('+bi.n+' locations)<br>Avg per location: <b class="g">'+money(bi.inc/n)+'/s</b></div>';}
 else{h+='<div class="cb">Empty plot. Build a business here:</div>';let any=false;BIZ.forEach(b=>{if(!S.biz[b.id].unlocked)return;any=true;h+='<div style="margin-bottom:4px">'+cb('plotBuild',b.id,locCostFor(b,d),b.icon+' '+b.name.replace(/s$/,''),'data-d="'+d+'" data-i="'+idx+'"')+'</div>';});if(!any)h+='<div class="lock">Unlock a business in the Business tab first.</div>';}
 $('#popup').innerHTML=h;}

/* ============================ UI ============================ */
let curTab='office',lastHtml='',lastTabsKey='';
const TABS=[['office','🏢','Office'],['staff','👥','Staff'],['biz','🏭','Business'],['city','🌆','City'],['res','🔬','Research'],['goals','🏆','Goals'],['reb','♻️','Rebirth'],['set','⚙️','More']];
function renderTabs(){$('#tabs').innerHTML=TABS.map(t=>'<button data-a="tab" data-k="'+t[0]+'" class="'+(curTab===t[0]?'on':'')+'">'+t[1]+' '+t[2]+'</button>').join('');lastHtml='';}
const card=(icon,title,body,btns,cls)=>'<div class="card '+(cls||'')+'"><div class="ct"><span class="ic">'+icon+'</span><b>'+title+'</b></div><div class="cb">'+body+'</div><div class="cbtn">'+(btns||'')+'</div></div>';
const cb=(a,k,cost,label,extra)=>'<button class="btn '+(S.cash>=cost?'':'dis')+'" data-a="'+a+'" data-k="'+k+'" '+(extra||'')+'>'+label+'<small>'+(cost===0?'FREE':money(cost))+'</small></button>';
const lockTxt=t=>'<div class="lock">🔒 '+t+'</div>';
function rOffice(){const sz=SIZES[S.officeSize],nx=SIZES[S.officeSize+1];let h='<h3>🏢 Office Space</h3>';
 h+=card('🏠',sz.name,'Capacity '+sz.cap+' desks • Rent <b class="r">'+money(sz.rent)+'/s</b>',nx?(S.level>=nx.lvl?cb('size','',nx.cost,'Expand to '+nx.name):lockTxt('Level '+nx.lvl+' for '+nx.name)):'<span class="maxed">MAX SIZE</span>');
 h+=card('🪑','Desks','Owned '+S.desks+'/'+sz.cap+' • Employees '+empCount()+'/'+S.desks,S.desks<sz.cap?cb('desk','',deskCost(),'Buy Desk'):'<span class="note">Expand the office for more desks.</span>');
 const nc=COMP[S.compTier+1];h+=card('💻',COMP[S.compTier].name,'Worker output ×'+COMP[S.compTier].mult,nc?cb('comp','',nc.cost,'Upgrade: '+nc.name+' (×'+nc.mult+')'):'<span class="maxed">MAX</span>');
 const ne=EQUIP[S.equipTier+1];h+=card('🛠️',EQUIP[S.equipTier].name,'Office income ×'+EQUIP[S.equipTier].mult,ne?cb('equip','',ne.cost,'Upgrade: '+ne.name+' (×'+ne.mult+')'):'<span class="maxed">MAX</span>');
 h+='<h3>🚪 Rooms</h3>';
 Object.keys(ROOMS).forEach(k=>{const R=ROOMS[k],L=S[k],maxed=L>=R.costs.length;let b;if(maxed)b='<span class="maxed">MAX LEVEL</span>';else if(S.level<R.lvl)b=lockTxt('Level '+R.lvl);else if(S.officeSize<R.minSize)b=lockTxt('Needs '+SIZES[R.minSize].name);else b=cb('room',k,R.costs[L],L?'Upgrade to L'+(L+1):'Build');
  h+=card(R.icon,R.name+' <span class="y">L'+L+'/'+R.costs.length+'</span>',R.desc,b);});
 h+='<h3>🎨 Decorations</h3><div class="note">Each decoration adds permanent income and appears in your office.</div>';
 DECOR.forEach(d=>{h+=card(d.icon,d.name,'+'+(d.bonus*100).toFixed(1)+'% all income',S.decor[d.id]?'<span class="maxed">OWNED ✓</span>':cb('decor',d.id,d.cost,'Buy'));});return h;}
function rStaff(){let h='<h3>👥 Staff</h3><div class="note">Employees: <b>'+empCount()+'/'+S.desks+'</b> desks • Wages are paid every second. Train each type up to level 5.</div>';
 EMP_ORDER.forEach(k=>{const e=EMP[k],t=S.train[k];let b;if(S.level<e.lvl)b=lockTxt('Level '+e.lvl);else{b=cb('hire',k,hireCost(k),'Hire');b+=t>=5?'<span class="maxed">TRAINED MAX</span>':cb('train',k,trainCost(k),'Train <em>L'+t+'→'+(t+1)+'</em>');}
  h+=card(e.icon,e.name+' <span class="y">×'+S.emp[k]+'</span>',e.desc+'<br>Wage '+money(e.wage)+'/s each • Training L'+t+' (effect ×'+(1+0.25*t).toFixed(2)+')'+(k==='executive'?'<br>Seats: '+S.emp.executive+'/'+execCap():''),b,S.level<e.lvl?'locked':'');});return h;}
function rBiz(){let h='<h3>🏭 Businesses</h3><div class="note">Each location is built on a plot in your city. Higher districts pay more but cost more.</div>';
 BIZ.forEach(b=>{const st=S.biz[b.id];
  if(!st.unlocked){h+=card(b.icon,b.name,'Base income '+money(b.base)+'/s per location • Operating cost '+money(b.opex)+'/s',S.level>=b.lvl?cb('bizUnlock',b.id,b.unlock,'Unlock'):lockTxt('Level '+b.lvl+' • '+money(b.unlock)),'locked');return;}
  const n=locs(b.id),bi=C.biz[b.id]||{inc:0,exp:0};
  let body='Locations <b>'+n+'</b> • '+b.staff.name+' <b>'+st.staff+'/'+staffCap(b,n)+'</b> (+3% each)<br>Income <b class="g">'+money(bi.inc)+'/s</b> • Costs <b class="r">'+money(bi.exp)+'/s</b> • Net <b class="'+(bi.inc-bi.exp>=0?'g':'r')+'">'+money(bi.inc-bi.exp)+'/s</b>';
  body+='<div class="chips">Build in: ';DIST.forEach(D=>{const f=freeCount(D.id),off=!S.districts[D.id]||f===0;body+='<span class="chip '+(st.district===D.id?'on':'')+' '+(off?'off':'')+'" data-a="bizDist" data-k="'+b.id+'" data-d="'+D.id+'">'+D.short+' ('+f+')</span>';});body+='</div>';
  let btns=cb('bizLoc',b.id,locCostFor(b,S.districts[st.district]?st.district:0),'Open Location')+cb('bizStaff',b.id,staffCost(b),'Hire '+b.staff.name.replace(/s$/,''));
  b.ups.forEach((u,i)=>{const lv=st.ups[i];btns+=lv>=5?'<span class="maxed">'+u+' MAX</span>':cb('bizUp',b.id,upCost(b,lv),u+' <em>L'+lv+'</em>','data-d="'+i+'" title="'+UPDESC[i]+'"');});
  h+=card(b.icon,b.name,body,btns);});return h;}
function rCity(){let h='<h3>🌆 The City</h3><div class="note">Click any plot in City view to build. Drag to rotate, right-drag or WASD to pan, wheel to zoom.</div>';
 DIST.forEach(D=>{const un=S.districts[D.id],used=D.cols*D.rows-freeCount(D.id);
  if(un)h+=card('🌆',D.name,'Income bonus <b class="g">×'+D.income+'</b> • Build cost ×'+D.costMul+' • Plots '+used+'/'+D.cols*D.rows,'<button class="btn alt" data-a="focus" data-k="'+D.id+'">View</button>');
  else{const ok=S.level>=D.lvl&&S.districts[D.id-1];h+=card('🔒',D.name,'Income bonus ×'+D.income+' • '+(D.cols*D.rows)+' plots',ok?cb('distUnlock',D.id,D.cost,'Unlock'):lockTxt('Level '+D.lvl+(S.districts[D.id-1]?'':' & previous district')+' • '+money(D.cost)),'locked');}
  if(un)LAND.filter(l=>l.d===D.id).forEach(l=>{h+=card(l.icon,l.name,'Landmark • +'+(l.bonus*100).toFixed(0)+'% all income',S.landmarks[l.id]?'<span class="maxed">BUILT ✓</span>':cb('landmark',l.id,l.cost,'Build'));});});
 h+='<h3>✨ Exclusive city rewards</h3>';EXCL.filter(e=>e.id==='tower'||e.id==='rocket').forEach(e=>{h+=card(e.icon,e.name,e.desc+'<br><span class="y">'+(e.ok()?'UNLOCKED':'Requires: '+e.req)+'</span>','',e.ok()?'':'locked');});return h;}
function rRes(){const rp=S.rp;let h='<h3>🔬 Research</h3><div class="note">Points: <b class="y">'+fmt(rp)+' RP</b> (+'+C.rp.toFixed(2)+'/s). '+(S.lab<1?'<span class="r">Build a Research Lab in the Office tab to start earning RP.</span>':'Engineers and lab levels increase RP/s.')+'</div>';
 ['Efficiency','Finance','Growth','Technology'].forEach(br=>{h+='<h3>'+br+'</h3>';RES.filter(n=>n.br===br).forEach(n=>{const done=S.research[n.id],can=!done&&n.req.every(r=>S.research[r]);
  h+='<div class="card rnode '+(done?'done':can?'can':'')+'"><div class="ct"><b>'+n.name+'</b></div><div class="cb">'+n.desc+(n.req.length&&!can&&!done?'<br><span class="r">Needs: '+n.req.map(r=>RES.find(x=>x.id===r).name).join(', ')+'</span>':'')+'</div><div class="cbtn">'+(done?'<span class="maxed">DONE ✓</span>':'<button class="btn '+(can&&S.rp>=n.cost?'alt':'dis')+'" data-a="research" data-k="'+n.id+'">Research<small>'+fmt(n.cost)+' RP</small></button>')+'</div></div>';});});return h;}
function rGoals(){const today=ymd(new Date()),claimed=S.daily.last===today,yest=ymd(new Date(Date.now()-864e5));
 let nextStreak=claimed?S.daily.streak:(S.daily.last===yest?S.daily.streak+1:1);const day=((nextStreak-1)%7)+1,shownDay=claimed?((S.daily.streak-1)%7)+1:day;
 let h='<h3>🎁 Daily Reward</h3><div class="card"><div class="cb">Streak: <b class="y">'+S.daily.streak+'</b> days • Completed cycles: '+S.daily.cycles+'</div><div class="days">';
 for(let i=1;i<=7;i++){const rw=dailyReward(i);h+='<div class="day '+(claimed&&i<=shownDay?'done':(!claimed&&i===day?'cur':''))+'">Day '+i+'<br>'+money(rw.cash)+(rw.rp?'<br>'+rw.rp+'RP':'')+'</div>';}
 h+='</div><div class="cbtn">'+(claimed?'<span class="maxed">Come back tomorrow!</span>':'<button class="btn gold" data-a="daily">Claim Day '+day+'<small>'+money(dailyReward(day).cash)+'</small></button>')+'</div><div class="cb">Day 7 completes a cycle and unlocks the Lucky Cat exclusive.</div></div>';
 h+='<h3>⭐ Level '+S.level+'</h3><div class="note">'+(S.level>=MAXLVL?'Max level!':'XP: '+fmt(S.xp)+' / '+fmt(need(S.level))+'. Spending, closing deals and profit earn XP. Level-ups pay cash.')+'</div>';
 const nxt=[];BIZ.forEach(b=>{if(b.lvl>S.level)nxt.push(b.icon+' '+b.name+' (Lv '+b.lvl+')');});DIST.forEach(D=>{if(D.id&&D.lvl>S.level)nxt.push('🌆 '+D.name+' (Lv '+D.lvl+')');});if(nxt.length)h+='<div class="note">Coming up: '+nxt.slice(0,4).join(' • ')+'</div>';
 h+='<h3>🏆 Achievements '+achCount()+'/'+ACH.length+'</h3><div class="note">Each achievement gives +1% permanent income.</div><div class="grid">';
 ACH.forEach(a=>{h+='<div class="ach '+(S.ach[a[0]]?'got':'')+'"><b>'+(S.ach[a[0]]?'🏆 ':'🔒 ')+a[1]+'</b>'+a[2]+'</div>';});h+='</div>';return h;}
function rReb(){const g=lpGain();let h='<h3>♻️ Rebirth</h3><div class="card"><div class="cb">Rebirths: <b class="y">'+S.prestige.count+'</b> • Legacy Points: <b class="y">'+lpAvail()+'</b> available ('+S.prestige.lp+' total = <b class="g">+'+(S.prestige.lp*10)+'% income</b>)<br>Earned this run: '+money(S.runEarned)+'<br>Rebirth now for <b class="y">+'+g+' LP</b>. LP formula grows with the square root of this run\'s earnings, so waiting longer pays more.</div><div class="cbtn"><button class="btn '+(g>=1?'red':'dis')+'" data-a="prestige">♻️ Rebirth<small>+'+g+' LP</small></button></div></div>';
 h+='<h3>🛍️ Permanent Upgrades</h3>';SHOP.forEach(it=>{const l=S.prestige.shop[it.id]||0,c=it.cost(l);h+=card(it.icon,it.name+' <span class="y">L'+l+'/'+it.max+'</span>',typeof it.desc==='function'?it.desc(l):it.desc,l>=it.max?'<span class="maxed">MAX</span>':'<button class="btn '+(lpAvail()>=c?'alt':'dis')+'" data-a="shop" data-k="'+it.id+'">Buy<small>'+c+' LP</small></button>');});
 h+='<h3>✨ Exclusive Rewards</h3>';EXCL.forEach(e=>{h+=card(e.icon,e.name,e.desc+'<br><span class="'+(e.ok()?'g':'y')+'">'+(e.ok()?'UNLOCKED ✓':'Requires: '+e.req)+'</span>','',e.ok()?'':'locked');});return h;}
function rSet(){return '<h3>⚙️ Settings</h3>'+card('🏢','Company name','<input type="text" id="nameBox" maxlength="24" value="'+S.name.replace(/"/g,'&quot;')+'">','<button class="btn" data-a="rename">Rename</button>')
 +card('💾','Save','Autosaves every 10 seconds in this browser.','<button class="btn" data-a="save">Save now</button><button class="btn alt" data-a="mute">'+(S.muted?'🔇 Sound off':'🔊 Sound on')+'</button>')
 +card('📦','Export / Import','Copy the code to back up your game, or paste one and press Import.<textarea id="expBox" spellcheck="false"></textarea>','<button class="btn alt" data-a="export">Export</button><button class="btn" data-a="import">Import</button>')
 +card('🎮','Controls','Left-drag: rotate • Right-drag / Shift-drag / WASD: pan • Wheel: zoom • Space: Close a Deal • 1/2: Office/City view • Click a plot in City view to build.')
 +card('🗑️','Hard reset','Deletes everything.','<button class="btn red" data-a="reset">Reset game</button>');}
function renderPanel(force){if(curTab==='set'&&!force&&lastHtml)return;const fn={office:rOffice,staff:rStaff,biz:rBiz,city:rCity,res:rRes,goals:rGoals,reb:rReb,set:rSet}[curTab];const h=fn();if(h===lastHtml)return;const p=$('#panel'),st=p.scrollTop;p.innerHTML=h;p.scrollTop=st;lastHtml=h;}
function hud(){$('#cash').textContent=money(S.cash);$('#sInc').textContent=money(C.gross);$('#sExp').textContent=money(C.exp);const n=$('#sNet');n.textContent=money(C.net);n.style.color=C.net>=0?'#a5ff9e':'#ff8a80';$('#sRp').textContent=fmt(S.rp);
 $('#lvlTxt').textContent='Level '+S.level+(S.prestige.count?' • ♻️'+S.prestige.count:'');$('#coName').textContent='🏢 '+S.name;
 if(S.level>=MAXLVL){$('#xpBar').style.width='100%';$('#xpTxt').textContent='MAX LEVEL';}else{$('#xpBar').style.width=Math.min(100,S.xp/need(S.level)*100)+'%';$('#xpTxt').textContent='XP '+fmt(S.xp)+' / '+fmt(need(S.level));}
 $('#deal').textContent='💼 Close a Deal +'+money(dealValue());}
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('[data-a]');if(!b||e.button!==0)return;const fn=ACT[b.dataset.a];if(!fn)return;e.preventDefault();fn(b.dataset,e);});

/* ============================ MAIN LOOP ============================ */
let last=performance.now(),acc=0,uiT=0,saveT=0,secT=0,time=0,lastExcl='',rpWarn=0;
function offlineCredit(secs,silent){const cap=(2+resFx().offline+2*(S.prestige.shop.time||0))*3600,t=Math.min(secs,cap);C=calc();const g=C.net*t;if(g>0){S.cash+=g;S.totalEarned+=g;S.runEarned+=g;S.rp+=C.rp*t;if(!silent&&secs>60)toast('😴 Welcome back! You earned <b>'+money(g)+'</b> while away ('+Math.round(t/60)+' min)','gold');}}
function tick(dt){C=calc();const earn=C.net*dt;S.cash=Math.max(0,S.cash+earn);if(earn>0){S.totalEarned+=earn;S.runEarned+=earn;}S.rp+=C.rp*dt;addXP(Math.sqrt(Math.max(0,C.net))*0.1*dt);}
function frame(now){requestAnimationFrame(frame);let dt=(now-last)/1000;last=now;
 if(dt>3){offlineCredit(dt);dt=0.016;}dt=Math.min(dt,0.25);time+=dt;
 acc+=dt*S.speed;let guard=0;while(acc>=0.1&&guard++<20){tick(0.1);acc-=0.1;}
 secT+=dt;if(secT>=1){secT=0;checkAch();const ek=EXCL.map(e=>e.ok()?1:0).join('');if(ek!==lastExcl){if(lastExcl!==''){EXCL.forEach((e,i)=>{if(ek[i]==='1'&&lastExcl[i]!=='1')toast('✨ Exclusive unlocked: '+e.icon+' '+e.name,'gold');});}lastExcl=ek;dirty.office=dirty.city=true;}
  if(C.net<0&&S.cash<=0&&time-rpWarn>30){rpWarn=time;toast('⚠️ Expenses exceed income and you are out of cash!','bad');}}
 saveT+=dt;if(saveT>=10){saveT=0;save();}
 if(dirty.office){buildOffice();dirty.office=false;}if(dirty.city){syncCity();dirty.city=false;if(popupPlot)renderPopup();}
 uiT+=dt;if(uiT>0.35||dirty.ui){uiT=0;dirty.ui=false;hud();renderPanel(false);if(popupPlot)renderPopup();}else hud();
 // camera
 const kk=1-Math.exp(-dt*6),pk=dt*goal.r*0.9;let mx=0,mz=0;const s=Math.sin(goal.th),c=Math.cos(goal.th);
 if(keys['w']||keys['arrowup']){mx-=s;mz-=c;}if(keys['s']||keys['arrowdown']){mx+=s;mz+=c;}if(keys['a']||keys['arrowleft']){mx-=c;mz+=s;}if(keys['d']||keys['arrowright']){mx+=c;mz-=s;}
 goal.tx+=mx*pk;goal.tz+=mz*pk;
 if(mode==='city'){goal.tx=Math.min(300,Math.max(-150,goal.tx));goal.tz=Math.min(140,Math.max(-240,goal.tz));}else{const W=SIZES[S.officeSize].W/2;goal.tx=Math.min(OX+W,Math.max(OX-W,goal.tx));goal.tz=Math.min(OZ+12,Math.max(OZ-12,goal.tz));}
 for(const k of ['tx','ty','tz','r','th','ph'])cur[k]+=(goal[k]-cur[k])*kk;
 const sp=Math.sin(cur.ph),cp=Math.cos(cur.ph);camera.position.set(cur.tx+cur.r*sp*Math.sin(cur.th),Math.max(1.2,cur.ty+cur.r*cp),cur.tz+cur.r*sp*Math.cos(cur.th));camera.lookAt(cur.tx,cur.ty,cur.tz);
 sun.position.set(cur.tx+60,95,cur.tz+40);sun.target.position.set(cur.tx,0,cur.tz);
 // animations
 for(const a of anim){if(a.t==='bob')a.o.position.y=Math.sin(time*2+a.p)*0.04;else if(a.t==='spin'){if(a.axis==='z')a.o.rotation.z+=dt*a.s;else a.o.rotation.y+=dt*a.s;}else if(a.t==='swim')a.o.position.z=a.b+Math.sin(time*1.3+a.p)*0.6;}
 for(const a of canim)a.o.rotation.y+=dt*a.s;
 for(const c of cars){if(!c.g.parent||!c.g.parent.visible)continue;c.g.position[c.ax]+=c.sp*c.dir*dt;if(c.g.position[c.ax]>c.max)c.g.position[c.ax]=c.min;else if(c.g.position[c.ax]<c.min)c.g.position[c.ax]=c.max;}
 renderer.render(scene,camera);}

/* ============================ INIT ============================ */
function init(){const l=load();if(l)S=l;resize();C=calc();updateShadowCam();renderTabs();$('#speedBtn').textContent='⏩ x'+S.speed;goal.r=officeR();Object.assign(cur,goal);
 if(l){const secs=(Date.now()-S.lastSave)/1000;if(secs>60)offlineCredit(secs);}
 lastExcl=EXCL.map(e=>e.ok()?1:0).join('');buildOffice();syncCity();dirty.office=dirty.city=false;hud();renderPanel(true);
 if(!S.seenWelcome)showModal('<h2>💼 Welcome to Business Tycoon!</h2><p>You run a tiny office with <b>$10,000</b> and two employees. Build a worldwide empire!</p><ul style="margin:8px 0"><li>Hire staff and buy <b>desks, computers and upgrades</b> to grow income.</li><li>Unlock <b>businesses</b> and place them in your 3D <b>city</b> (click plots in City view).</li><li>Unlock new <b>districts</b>, research upgrades, earn achievements and <b>Rebirth</b> for permanent bonuses.</li><li>Press <b>Space</b> or the gold button to close deals for quick cash.</li></ul><div class="cbtn"><button class="btn gold" data-a="closeWelcome">Start building! 🚀</button></div>');
 window.addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
 requestAnimationFrame(t=>{last=t;frame(t);});}
init();
})();
</script>
