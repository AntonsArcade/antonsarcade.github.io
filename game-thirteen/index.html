<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Rapid Cars</title><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#1a2340;--p:#2a3866;--tx:#eaf0ff;--mu:#8b98b8;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:600 15px system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);max-width:900px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:linear-gradient(#34457a,#26335c);border-bottom:1px solid #26335a}
.logo{font:900 21px/1 system-ui;font-style:italic;background:linear-gradient(90deg,#22d3ee,#a855f7,#f43f5e);-webkit-background-clip:text;background-clip:text;color:transparent}
.bal{display:flex;gap:6px}.chip{background:#18223f;border:1px solid #2b3a66;border-radius:20px;padding:5px 10px;font-weight:800;white-space:nowrap}.chip small{color:var(--mu);font-size:9px}
#view{flex:1;overflow-y:auto;padding:12px;touch-action:pan-y}
nav{display:flex;background:#26335c;border-top:1px solid #26335a;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:9px 0;font:700 12px system-ui}nav .on{color:#22d3ee}
.card{--rc:#444;display:flex;align-items:center;gap:12px;background:var(--p);border:2px solid var(--rc);border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 0 14px color-mix(in srgb,var(--rc) 40%,transparent)}
.card>div{flex:1}.card canvas{background:#18223f;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.gc{--rc:#444;background:var(--p);border:2px solid var(--rc);border-radius:12px;padding:6px;text-align:center;box-shadow:0 0 10px color-mix(in srgb,var(--rc) 35%,transparent)}
.gc canvas{width:100%;height:auto;background:#18223f;border-radius:8px}.gc small{display:block;color:var(--mu)}
.r10{animation:rb 3s linear infinite}
@keyframes rb{0%,100%{--rc:#f00;border-color:#f33}17%{border-color:#ff3}33%{border-color:#3f3}50%{border-color:#3ff}67%{border-color:#33f}83%{border-color:#f3f}}
button.btn{background:linear-gradient(#22d3ee,#0891b2);color:#04121a;border:0;border-radius:10px;padding:10px 14px;font:800 14px system-ui}
button.btn.b2{background:linear-gradient(#a855f7,#7e22ce);color:#fff}button.btn.g{background:#26335a;color:#cfe}button.btn:disabled{opacity:.4}
button.btn:active{transform:scale(.96)}
h3{margin:14px 0 8px}small,.mu{color:var(--mu)}
.bar{height:8px;background:#18223f;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#a855f7)}
#bt{position:fixed;inset:0;z-index:5;background:#1a2340}#c3,#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.dn{position:absolute;color:#fff;font:900 17px system-ui;text-shadow:0 0 4px #000;pointer-events:none;animation:up .9s forwards}@keyframes up{to{transform:translateY(-45px);opacity:0}}#fx{position:absolute;inset:0;pointer-events:none;transition:box-shadow .15s}#dash{position:absolute;left:0;right:0;bottom:0;height:13%;background:linear-gradient(transparent,#0b1226cc 40%,#0b1226);border-top:3px solid #22d3ee55;pointer-events:none}#rad{position:absolute;left:8px;top:calc(62px + env(safe-area-inset-top,0px));width:90px;height:90px;border-radius:50%;background:#0b122699;border:2px solid #22d3ee88;pointer-events:none}.tiers{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;touch-action:pan-x}.tiers button.chip{color:var(--tx);font:700 12px system-ui;flex:none}.chip.sel{border-color:#22d3ee;background:#0e4a5a}
#bt .bal{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:8px}
#hpw{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:8px;width:42%;max-width:260px}
#hpw .bar{height:14px;border:1px solid #fff4}#hpw i{background:linear-gradient(90deg,#ef4444,#22c55e)}
#ab{position:absolute;right:18px;bottom:calc(28px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;border:3px solid #22d3ee;background:#0b1226cc;font-size:30px;color:#fff}
#cdn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 90px system-ui;font-style:italic;pointer-events:none;text-shadow:0 0 30px #22d3ee}
#jb{position:absolute;width:110px;height:110px;margin:-55px;border-radius:50%;border:2px solid #fff5;background:#fff1;pointer-events:none}#jk{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#22d3eecc}
#md,#res{position:fixed;inset:0;z-index:10;background:#000c;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
#res{z-index:8;position:absolute}
.pop{background:var(--p);border:2px solid var(--rc,#2b3a66);border-radius:18px;padding:16px;width:100%;max-width:400px;text-align:center;box-shadow:0 0 40px color-mix(in srgb,var(--rc,#000) 60%,transparent);animation:pp .35s}
@keyframes pp{from{transform:scale(.6);opacity:0}}
.pk{font-size:110px;animation:sh .12s infinite}@keyframes sh{25%{transform:translate(-5px,3px) rotate(-6deg)}75%{transform:translate(5px,-3px) rotate(6deg)}}
.flash{position:fixed;inset:0;background:#fff;animation:fl .7s forwards;pointer-events:none}@keyframes fl{to{opacity:0}}
.cf{position:fixed;top:-10px;width:9px;height:14px;animation:fall 2.4s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.shk{animation:sk .5s}@keyframes sk{20%{transform:translate(8px,-6px)}40%{transform:translate(-8px,6px)}60%{transform:translate(6px,4px)}}
.win{color:#fbbf24;font:900 40px system-ui;margin:4px}.lose{color:#f87171;font:900 40px system-ui;margin:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0;text-align:left}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#f43f5e;color:#fff;padding:9px 16px;border-radius:20px;z-index:30;opacity:0;transition:.25s;pointer-events:none}#toast.on{opacity:1}
</style></head><body>
<div id="app"><header><div><div class="logo">RAPID CARS</div><small id="cc"></small></div><div class="bal"></div></header><main id="view"></main><nav id="nav"></nav></div>
<div id="bt" hidden><canvas id="c3"></canvas><canvas id="cv"></canvas><div id="fx"></div><div id="dash"></div><canvas id="rad" width="90" height="90"></canvas><div id="hpw"><div class="bar"><i id="hpf"></i></div><small id="alive"></small> <button class="btn g" style="padding:3px 8px;font-size:11px" onclick="quit()">✕ Quit</button></div><div class="bal"></div><button id="ab"></button><div id="cdn"></div><div id="jb" hidden><div id="jk"></div></div><div id="res" hidden></div></div>
<div id="md" hidden></div><div id="toast"></div>
<script>
const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1));
// ---------- DATA ----------
const RA=[['Common','#9aa3b2',1,25],['Uncommon','#4ade80',1.25,60],['Rare','#38bdf8',1.6,140],['Epic','#a855f7',2,320],['Legendary','#fbbf24',2.6,700],['Mythic','#f43f5e',3.3,1500],['Crazy','#ff7a00',4.2,3000],['Godly','#fff1a8',5.2,6000],['Exclusive','#14f1d9',6.5,12000],['Master','#ff2d95',8,25000],['Rapid','#ffffff',10,60000]];
const NM='Rusty Runner|Pocket Rocket|City Zip|Dusty Hatch;Street Sprinter|Green Mamba|Cruiser Jr|Dash Wagon;Blue Bolt|Night Racer|Drift King|Road Hawk;Violet Viper|Storm Chaser|Thunder GT|Phantom RS;Golden Falcon|Solar Flare|Blaze Titan|Aurum X;Mythril Wraith|Cosmic Drake|Void Runner|Nebula GT;Mad Hatter|Chaos Cruiser|Jester Jet|Wild Cyclone;Zeus Bolt|Olympus One|Halo Phantom|Divine Comet;Black Label|Vault Seven|Prism Elite|Royal Edition;Grandmaster Z|Sovereign|Apex Overlord|Mastermind;Rapid Prime|Rapid Omega|Rapid Zero|Rapid Infinity'.split(';').map(s=>s.split('|'));
const HUE=[215,130,200,280,45,345,25,50,170,320,0],AB=['boost','shield','repair','shock'],ABI={boost:'🚀',shield:'🛡️',repair:'🔧',shock:'💥'},ABD={boost:'Nitro dash: 1.9x speed and 1.6x ram damage',shield:'Shield: takes 70% less damage for 3s',repair:'Repair: restores 30% health',shock:'Shockwave: blasts and damages nearby cars'},ABC={boost:6,shield:9,repair:12,shock:9};
const MOD=[[1,1,1],[.9,1,1.1],[1.12,.92,.94],[.95,1.12,1]],MAXL=10;
const CARS=[];NM.forEach((a,r)=>a.forEach((n,i)=>CARS.push({id:CARS.length,r,n,sh:i,hue:(HUE[r]+i*14)%360,ab:r?AB[(i+r)%4]:null})));
const base=c=>{const m=RA[c.r][2],o=MOD[c.sh];return{hp:90*m*o[0],dmg:9*m*o[1],spd:(150+c.r*6)*o[2]}};
const st=(c,l)=>{const b=base(c);return{hp:b.hp*(1+.12*l.h),dmg:b.dmg*(1+.1*l.d),spd:b.spd*(1+.04*l.s)}};
const pwr=s=>Math.round(s.hp/6+s.dmg*4+s.spd/5),ucost=(c,lv)=>Math.round(40*RA[c.r][2]*Math.pow(lv+1,1.4));
const PK=[{n:'Street Pack',e:'📦',c:200,p:40,w:[62,28,8,1.8,.2,0,0,0,0,0,0]},{n:'Turbo Pack',e:'🎁',c:900,p:180,w:[18,34,28,14,5,.9,.1,0,0,0,0]},{n:'Elite Pack',e:'💎',c:3500,p:700,w:[0,8,28,32,22,7,2.4,.5,.1,0,0]},{n:'Apex Pack',e:'👑',c:14000,p:2800,w:[0,0,8,24,32,22,9,3.5,1,.4,.1]}];
const TN=['Rookie','Street','Pro','Expert','Veteran','Elite','Champion','Legend','Mythic','Godly','Master','Rapid'];
const DF=[];TN.forEach((n,t)=>[0,1,2].forEach(j=>{const nb=2+j,c=Math.round(55*Math.pow(1.45,t)*(1+j*.35)*(nb+1)/4);DF.push({n:n+' '+(j+1),nb,lo:Math.max(0,t-1),hi:Math.min(10,t+j),lv:Math.min(10,Math.round(t*.6+j*2+1)),c,p:Math.round(c/4),s:Math.min(1.2,.8+t*.03+j*.02)})}));
const rc=(r,t=0)=>r==10?`hsl(${(t*90)%360},100%,60%)`:r==6?((t*6)%2<1?'#ff7a00':'#d6ff00'):RA[r][1];
// ---------- SAVE ----------
let S;try{S=JSON.parse(localStorage.getItem('rapidcars1'))}catch(e){}
S=S||{coins:250,points:0,own:{0:{h:0,d:0,s:0}},sel:0,w:0,l:0};
const save=()=>{try{localStorage.setItem('rapidcars1',JSON.stringify(S))}catch(e){}};
// ---------- DRAW CAR ----------
function drawCar(g,c,t){const k=rc(c.r,t),hue=c.r==10?(t*90)%360:c.hue;g.save();if(c.r>2){g.shadowColor=k;g.shadowBlur=6+c.r*2}
g.fillStyle='#0a0a0a';for(const[x,y]of[[-10,-10],[-10,10],[11,-10],[11,10]])g.fillRect(x-5,y-2.5,10,5);
g.fillStyle=`hsl(${hue} 78% 50%)`;g.beginPath();
if(c.sh==1){g.moveTo(-17,-8);g.lineTo(8,-8);g.lineTo(21,0);g.lineTo(8,8);g.lineTo(-17,8)}else g.roundRect(-17,c.sh==2?-10:-8,34,c.sh==2?20:16,5);
g.closePath();g.fill();g.shadowBlur=0;g.fillStyle=k;g.fillRect(-17,-1.5,30,3);
g.fillStyle='#10192e';g.beginPath();g.roundRect(-5,-5,11,10,3);g.fill();g.fillStyle='#7dd3fc99';g.fillRect(2,-4,3,8);
if(c.r>=2){g.fillStyle=k;g.fillRect(-20,-9,4,18)}
if(c.sh==3){g.fillStyle='#ddd';for(const y of[-6,0,6]){g.beginPath();g.moveTo(17,y-2);g.lineTo(23,y);g.lineTo(17,y+2);g.fill()}}
g.restore()}
function thumbs(){if(B||document.hidden)return;const t=performance.now()/1000;document.querySelectorAll('canvas[data-c]').forEach(cv=>{const g=cv.getContext('2d'),c=CARS[cv.dataset.c];g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);g.translate(cv.width/2,cv.height/2);g.scale(cv.width/60,cv.width/60);drawCar(g,c,t);if(cv.dataset.l){g.globalCompositeOperation='source-atop';g.fillStyle='#0b1226';g.fillRect(-40,-40,80,80)}})}
setInterval(thumbs,100);
// ---------- UI ----------
let T='b';const toast=(m,ok)=>{const e=$('toast');e.style.background=ok?'#16a34a':'#f43f5e';e.textContent=m;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)};
const bal=()=>document.querySelectorAll('.bal').forEach(e=>e.innerHTML=`<span class="chip">⭐ ${S.points} <small>POINTS</small></span><span class="chip">🪙 ${S.coins} <small>MONEY</small></span>`);
const owned=()=>Object.keys(S.own).length;
const V={
b(){const c=CARS[S.sel],s=st(c,S.own[c.id]),pw=pwr(s);
return`<div class="card r${c.r}" style="--rc:${RA[c.r][1]}"><canvas data-c="${c.id}" width="120" height="70"></canvas><div><b>${c.n}</b><div style="color:${RA[c.r][1]}">${RA[c.r][0]}</div><small>Power ${pw} · ${c.ab?ABI[c.ab]+' '+c.ab:'no ability'}</small></div><button class="btn g" onclick="T='g';render()">Change</button></div><h3>⚔️ Choose a battle (you vs 3 bots)</h3>`+DF.map((d,i)=>{const mid=CARS.find(x=>x.r==Math.round((d.lo+d.hi)/2)),bp=pwr(st(mid,{h:d.lv/2,d:d.lv/2,s:d.lv/2})),u=bp>pw;
return`<div class="card"><div><b>${d.n}</b> <small>${RA[d.lo][0]}–${RA[d.hi][0]} bots</small><br><small>Enemy power ≈ ${Math.round(bp)} ${u?'· <span style="color:#fbbf24">Underdog +25%</span>':''}</small><br>🪙 ${d.c} · ⭐ ${d.p} <small>per win</small></div><button class="btn" onclick="startBattle(${i})">FIGHT</button></div>`}).join('')+`<div class="card"><div><b>👥 2 Players — same computer</b><br><small>P1: W A S D + Space · P2: I J K L + Enter<br>P2 car: <select id="p2c">${CARS.filter(c=>S.own[c.id]).map(c=>`<option value="${c.id}">${c.n}</option>`).join('')}</select><br>Friendly match, no rewards</small></div><button class="btn b2" onclick="startBattle(-1,1)">VS</button></div>`},
p(){return`<h3>🎁 Car Packs</h3><small>Pay with money or points. Duplicates are sold for money.</small><div style="margin-top:10px">`+PK.map((k,i)=>{const tot=k.w.reduce((a,b)=>a+b,0);return`<div class="card" style="flex-wrap:wrap"><div style="font-size:48px;flex:0">${k.e}</div><div><b>${k.n}</b><br><small>${k.w.map((w,r)=>w?`<span style="color:${RA[r][1]}">${RA[r][0]} ${(w/tot*100).toFixed(w/tot<.01?2:1)}%</span>`:'').filter(x=>x).join(' · ')}</small></div><div style="display:flex;gap:6px;width:100%"><button class="btn" style="flex:1" onclick="openPack(${i},'coins')">Buy 🪙 ${k.c}</button><button class="btn b2" style="flex:1" onclick="openPack(${i},'points')">Buy ⭐ ${k.p}</button></div></div>`}).join('')+'</div>'},
g(){return`<h3>🚗 Garage — ${owned()}/${CARS.length} collected</h3><div class="grid">`+[...CARS].sort((a,b)=>b.r-a.r||a.id-b.id).map(c=>{const o=S.own[c.id];return`<div class="gc r${c.r}" style="--rc:${RA[c.r][1]}" onclick="${o?`showCar(${c.id})`:`toast('Locked — find it in packs')`}"><canvas data-c="${c.id}" ${o?'':'data-l=1'} width="120" height="70"></canvas><b>${o?c.n:'???'}</b><small style="color:${RA[c.r][1]}">${RA[c.r][0]}${S.sel==c.id?' · ✔':''}</small></div>`}).join('')+'</div>'}};
PK.push({n:'Scrap Pack',e:'🔩',c:80,p:16,w:[88,12,0,0,0,0,0,0,0,0,0]},{n:'Garage Pack',e:'🧰',c:400,p:80,w:[40,38,17,4.5,.5,0,0,0,0,0,0]},{n:'Nitro Pack',e:'⚡',c:1500,p:300,w:[8,28,36,20,6.5,1.3,.2,0,0,0,0]},{n:'Mythic Pack',e:'🔮',c:6000,p:1200,w:[0,0,14,30,32,16,6,1.6,.4,0,0]},{n:'Crazy Pack',e:'🤪',c:9000,p:1800,w:[0,0,0,18,30,28,15,7,1.8,.2,0]},{n:'Godly Pack',e:'✨',c:25000,p:5000,w:[0,0,0,0,18,28,26,18,8,1.8,.2]},{n:'Exclusive Pack',e:'🔑',c:50000,p:10000,w:[0,0,0,0,0,18,28,28,20,5,1]},{n:'Master Pack',e:'🏅',c:120000,p:24000,w:[0,0,0,0,0,0,10,28,34,22,6]},{n:'Rapid Pack',e:'🚀',c:300000,p:60000,w:[0,0,0,0,0,0,0,12,36,40,12]});
let TI=-1;
V.p=function(){return`<h3>🎁 Car Packs <small>(${PK.length})</small></h3><small>Pay with money or points. Duplicates are sold for money.</small><div style="margin-top:10px">`+PK.map((k,i)=>({k,i})).sort((a,b)=>a.k.c-b.k.c).map(({k,i})=>{const tot=k.w.reduce((a,b)=>a+b,0);return`<div class="card" style="flex-wrap:wrap"><div style="font-size:44px;flex:0">${k.e}</div><div><b>${k.n}</b><br><small>${k.w.map((w,r)=>w?`<span style="color:${RA[r][1]}">${RA[r][0]} ${(w/tot*100).toFixed(w/tot<.01?2:1)}%</span>`:'').filter(x=>x).join(' · ')}</small></div><div style="display:flex;gap:6px;width:100%"><button class="btn" style="flex:1" onclick="openPack(${i},'coins')">Buy 🪙 ${k.c}</button><button class="btn b2" style="flex:1" onclick="openPack(${i},'points')">Buy ⭐ ${k.p}</button></div></div>`}).join('')+'</div>'};
V.b=function(){const c=CARS[S.sel],s=st(c,S.own[c.id]),pw=pwr(s),pr=S.prog||0;if(TI<0)TI=Math.min(11,Math.floor(Math.min(pr,DF.length-1)/3));
let h=`<div class="card r${c.r}" style="--rc:${RA[c.r][1]}"><canvas data-c="${c.id}" width="120" height="70"></canvas><div><b>${c.n}</b><div style="color:${RA[c.r][1]}">${RA[c.r][0]}</div><small>Power ${pw} · ${c.ab?ABI[c.ab]+' '+c.ab:'no ability'}</small></div><button class="btn g" onclick="T='g';render()">Change</button></div><h3>⚔️ Campaign — ${pr}/${DF.length} stages cleared</h3><small>Chase camera: stick/W = gas, left/right = steer, down/S = brake</small><div class="tiers" style="margin-top:8px">`+TN.map((n,t)=>`<button class="chip ${t==TI?'sel':''}" style="${t*3>pr?'opacity:.45':''}" onclick="TI=${t};render()">${t*3>pr?'🔒 ':''}${n}</button>`).join('')+'</div>';
for(let j=0;j<3;j++){const i=TI*3+j,d=DF[i],lock=i>pr,mid=CARS.find(x=>x.r==Math.round((d.lo+d.hi)/2)),bp=pwr(st(mid,{h:d.lv/2,d:d.lv/2,s:d.lv/2}));
h+=`<div class="card" style="${lock?'opacity:.5':''}"><div><b>${d.n}</b> ${i<pr?'✅':''}<br><small>${d.nb} bots · ${RA[d.lo][0]}–${RA[d.hi][0]} · power ≈ ${bp}${bp>pw?' · <span style="color:#fbbf24">Underdog +25%</span>':''}</small><br>🪙 ${d.c} · ⭐ ${d.p} <small>per win</small></div><button class="btn" ${lock?'disabled':''} onclick="startBattle(${i})">${lock?'🔒':'FIGHT'}</button></div>`}
return h+`<div class="card"><div><b>👥 2 Players — same computer</b><br><small>P1: W A S D + Space · P2: I J K L + Enter<br>P2 car: <select id="p2c">${CARS.filter(c=>S.own[c.id]).map(c=>`<option value="${c.id}">${c.n}</option>`).join('')}</select><br>Overhead view, friendly match, no rewards</small></div><button class="btn b2" onclick="startBattle(-1,1)">VS</button></div>`};
function render(){bal();$('cc').textContent=`🚗 ${owned()}/${CARS.length} cars`;$('nav').innerHTML=[['b','⚔️','Battle'],['p','🎁','Packs'],['g','🚗','Garage']].map(([k,i,n])=>`<button class="${T==k?'on':''}" onclick="T='${k}';render()">${i}<br>${n}</button>`).join('');$('view').innerHTML=V[T]();thumbs()}
const closeM=()=>{$('md').hidden=true;render()};
function showCar(id){const c=CARS[id],l=S.own[id],s=st(c,l),m=$('md');m.hidden=false;

const as=innerWidth/innerHeight,d=Math.max(620,690/Math.min(as,1.6)),fx=P.x*.2,fz=P.y*.2,sx=rnd(-1,1)*B.shake*.6,sz=rnd(-1,1)*B.shake*.6;
const fp=!B.vs&&P.alive;$('dash').style.display='none';$('rad').style.display=fp?'block':'none';$('fx').style.boxShadow=!fp?'none':P.flash>0?'inset 0 0 120px #ef4444':P.shield>0?'inset 0 0 90px #60a5fa':P.boost>0?'inset 0 0 90px #fb923c':'none';

else{CAM.fov=50;CAM.updateProjectionMatrix();CAM.position.set(fx+sx,d*.79,fz+d*.62+sz);CAM.lookAt(fx,0,fz)}
