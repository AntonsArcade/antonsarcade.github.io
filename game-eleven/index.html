<!doctype html>
<html lang="en">
<head>

<style>

[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', 'Arial Rounded MT Bold', sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }

#touch .pad, #touch .btns { display: flex; gap: 10px; pointer-events: none; }
#touch button { pointer-events: auto; touch-action: none; width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--btn-line); background: var(--btn); color: var(--fg); font: 26px 'Lilita One', sans-serif; padding: 0; }
#touch button.on { background: var(--btn-on); color: #1b1522; }
#touch .btns button { width: 72px; height: 72px; }
@media (max-width: 480px) { #touch button { width: 54px; height: 54px; } #touch .btns button { width: 60px; height: 60px; } }
</style>
</head>
<body>

  <div class="btns"><button id="ta" aria-label="Attack A">A</button><button id="tb" aria-label="Attack B">B</button><button id="tc" aria-label="Attack C">C</button></div>

<script>
// ===== CORE =====
const W = 960, H = 540, GROUND = 440, WALL_L = 70, WALL_R = 890;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const store = {
  get(k, d) { try { const v = localStorage.getItem('tla_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('tla_' + k, JSON.stringify(v)); } catch (e) {} }
};

// ----- Input -----
const keys = {}, keyEdge = {};
const touch = { l: 0, r: 0, d: 0, a: 0, b: 0, c: 0 };
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (!keys[k]) keyEdge[k] = true;
  keys[k] = true;
  Audio_.unlock();
});
addEventListener('keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function edge(...ks) { let r = false; for (const k of ks) if (keyEdge[k]) r = true; return r; }
function clearEdges() { for (const k in keyEdge) delete keyEdge[k]; }
let twoPlayerInput = false;
function readPad(slot) {
  const K = k => !!keys[k];
  let o;
  if (slot === 0) {
    o = { l: K('a'), r: K('d'), d: K('s'), a: K('f'), b: K('g'), c: K('h') };
    if (!twoPlayerInput) {
      o.l = o.l || K('ArrowLeft'); o.r = o.r || K('ArrowRight'); o.d = o.d || K('ArrowDown');
      o.a = o.a || K('j') || K('z'); o.b = o.b || K('k') || K('x'); o.c = o.c || K('l') || K('c');
    }
    o.l = o.l || !!touch.l; o.r = o.r || !!touch.r; o.d = o.d || !!touch.d;
    o.a = o.a || !!touch.a; o.b = o.b || !!touch.b; o.c = o.c || !!touch.c;
  } else {
    o = { l: K('ArrowLeft'), r: K('ArrowRight'), d: K('ArrowDown'), a: K('j'), b: K('k'), c: K('l') };
  }
  return o;
}
// on-screen touch buttons
(function () {
  const map = { tl: 'l', tr: 'r', td: 'd', ta: 'a', tb: 'b', tc: 'c' };
  for (const id in map) {
    const el = document.getElementById(id); if (!el) continue;
    const on = e => { e.preventDefault(); touch[map[id]] = 1; el.classList.add('on'); Audio_.unlock(); };
    const off = e => { e.preventDefault(); touch[map[id]] = 0; el.classList.remove('on'); };
    el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
    el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
  }
})();

// ----- Audio (synth) -----
const Audio_ = {
  ctx: null, vol: store.get('vol', 0.6), music: store.get('music', true), mNode: null,
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  },
  tone(f, d, type = 'square', v = 0.2, slide = 0, delay = 0) {
    const c = this.ctx; if (!c || this.vol <= 0) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v * this.vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.02);
  },
  noise(d, v = 0.2, hp = 800) {
    const c = this.ctx; if (!c || this.vol <= 0) return;
    const n = Math.floor(c.sampleRate * d), b = c.createBuffer(1, n, c.sampleRate), a = b.getChannelData(0);
    for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = hp; s.buffer = b; g.gain.value = v * this.vol;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start();
  },
  sfx(n) {
    switch (n) {
      case 'whiff': this.noise(0.1, 0.12, 2500); break;
      case 'hitL': this.noise(0.08, 0.3, 600); this.tone(220, 0.08, 'square', 0.2, -120); break;
      case 'hitM': this.noise(0.12, 0.4, 400); this.tone(160, 0.12, 'square', 0.25, -100); break;
      case 'hitH': this.noise(0.2, 0.55, 250); this.tone(110, 0.2, 'sawtooth', 0.3, -80); break;
      case 'block': this.tone(520, 0.06, 'triangle', 0.25); this.noise(0.05, 0.15, 3000); break;
      case 'throw': this.tone(300, 0.2, 'square', 0.2, -200); this.noise(0.15, 0.3, 300); break;
      case 'tech': this.tone(700, 0.1, 'triangle', 0.25, 300); break;
      case 'proj': this.tone(500, 0.18, 'sawtooth', 0.12, 300); break;
      case 'ko': this.tone(400, 0.7, 'sawtooth', 0.3, -330); this.noise(0.4, 0.4, 200); break;
      case 'ui': this.tone(660, 0.05, 'square', 0.12); break;
      case 'ok': this.tone(520, 0.06, 'square', 0.15); this.tone(780, 0.1, 'square', 0.15, 0, 0.06); break;
      case 'back': this.tone(330, 0.07, 'square', 0.12); break;
      case 'ready': this.tone(440, 0.15, 'triangle', 0.25); break;
      case 'fight': this.tone(660, 0.12, 'square', 0.25); this.tone(880, 0.25, 'square', 0.25, 0, 0.1); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.2, 'square', 0.2, 0, i * 0.12)); break;
      case 'lose': [392, 330, 262].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.25, 0, i * 0.2)); break;
    }
  },
  // tiny bouncy loop
  startMusic() {
    if (!this.ctx || !this.music || this.mNode) return;
    const notes = [262, 330, 392, 330, 294, 349, 440, 349];
    let i = 0;
    this.mNode = setInterval(() => {
      if (!this.music || document.hidden) return;
      const n = notes[i % notes.length];
      this.tone(n / 2, 0.22, 'triangle', 0.12);
      if (i % 2 === 0) this.tone(n * 2, 0.08, 'square', 0.03);
      i++;
    }, 240);
  },
  setMusic(on) { this.music = on; store.set('music', on); if (on) this.startMusic(); },
  setVol(v) { this.vol = v; store.set('vol', v); }
};

}

// ===== ROSTER =====
// M(name, startup, active, recovery, dmg, hitstun, blockstun, reachFront, yLow, yHigh, opts)

];
const BYID = {}; ROSTER.forEach(r => BYID[r.id] = r);
const PLAYABLE = ROSTER.filter(r => !r.boss);
const LEVELS = [
  { n: 'Rookie',  react: 26, aggr: .35, block: .30, tech: .05, combo: .15, whiff: .05, err: .35, spd: .85 },
  { n: 'Casual',  react: 19, aggr: .45, block: .45, tech: .15, combo: .35, whiff: .15, err: .24, spd: .92 },
  { n: 'Skilled', react: 13, aggr: .55, block: .62, tech: .35, combo: .6,  whiff: .35, err: .14, spd: 1 },

// ===== FIGHT SIM =====
const RANK = { A: 1, B: 2, C: 3, dA: 1, dC: 3 };
class Fighter {
  constructor(def, slot) { this.def = def; this.slot = slot; this.ctrl = null; this.reset(slot ? 620 : 340); }
  reset(x) {
    this.x = x; this.vx = 0; this.face = this.slot ? -1 : 1; this.hp = this.maxhp = this.def.boss ? 1300 : 1000;
    this.st = 'idle'; this.t = 0; this.stun = 0; this.mv = null; this.mvKey = ''; this.hitDone = false; this.connected = false;
    this.crouch = false; this.blocking = false; this.walk = 0; this.combo = 0; this.comboDmg = 0; this.flash = 0; this.inv = 0;
    this.prev = {}; this.buf = { a: 99, b: 99, c: 99 }; this.inp = {}; this.counter = false;
    this.thr = null; this.anim = 0; this.hurtF = 0; this.lastHit = 'M';
  }
  get hh() { return this.crouch ? this.def.h * 0.62 : this.def.h; }
  get hb() { return this.def.w * 0.82; }
  bufferInput(inp) {
    for (const k of ['a', 'b', 'c']) { this.buf[k] = (inp[k] && !this.prev[k]) ? 0 : Math.min(99, this.buf[k] + 1); }
    this.inp = inp; this.prev = { l: inp.l, r: inp.r, d: inp.d, a: inp.a, b: inp.b, c: inp.c };
  }
  get actionable() { return this.st === 'idle'; }
  get dirB() { return this.face === 1 ? this.inp.l : this.inp.r; }
  get dirF() { return this.face === 1 ? this.inp.r : this.inp.l; }
  startMove(key, G) {
    const mv = this.def.moves[key]; this.mv = mv; this.mvKey = key; this.st = 'atk'; this.t = 0; this.hitDone = false; this.connected = false;
    this.buf.a = this.buf.b = this.buf.c = 99; this.atkSeq = (this.atkSeq || 0) + 1; Audio_.sfx('whiff');
  }
  tryThrowInput() { return (this.buf.a <= 2 && this.buf.b <= 2); }
  step(G) {
    const op = this.opp, inp = this.inp; this.t++; this.anim++;
    if (this.flash > 0) this.flash--;
    if (this.inv > 0) this.inv--;
    switch (this.st) {
      case 'idle': {
        if (G.phase !== 'fight' && !G.training) { this.crouch = false; this.walk = 0; this.blocking = false; this.face = op.x >= this.x ? 1 : -1; break; }
        this.crouch = !!inp.d;
        if (!this.crouch) {
          let mvx = 0;
          if (this.dirF && !this.dirB) mvx = this.def.walkF * this.face; else if (this.dirB && !this.dirF) mvx = -this.def.walkB * this.face;
          this.x += mvx; this.walk = mvx === 0 ? 0 : (mvx * this.face > 0 ? 1 : -1);
        } else this.walk = 0;
        this.blocking = !!this.dirB;
        this.face = op.x >= this.x ? 1 : -1;
        if (this.tryThrowInput()) { this.st = 'grab'; this.t = 0; this.atkSeq = (this.atkSeq || 0) + 1; this.buf.a = this.buf.b = this.buf.c = 99; this.thr = null; break; }
        const c = this.crouch;
        if (this.buf.c <= 4) this.startMove(c ? 'dC' : 'C', G);
        else if (this.buf.b <= 4) this.startMove('B', G);
        else if (this.buf.a <= 4) this.startMove(c ? 'dA' : 'A', G);
        break;
      }
      case 'atk': {
        const m = this.mv, total = m.st + m.ac + m.rc;
        this.blocking = false;
        if (this.t > m.st && this.t <= m.st + m.ac) {
          if (m.adv) this.x += this.face * m.adv;
          if (m.proj && !this.hitDone && this.t === m.st + 1) {
            this.hitDone = true; G.spawnProj(this, m.proj);
          } else if (!m.proj && !this.hitDone) G.checkMelee(this, op, m);
        } else if (m.adv && this.t <= m.st) this.x += this.face * m.adv * 0.15;
        // chain cancel on contact
        if (this.connected && this.t > m.st) {
          const cur = RANK[this.mvKey];
          const want = this.buf.c <= 4 ? (this.inp.d ? 'dC' : 'C') : this.buf.b <= 4 ? 'B' : this.buf.a <= 4 ? (this.inp.d ? 'dA' : 'A') : null;
          if (want && RANK[want] > cur) { this.startMove(want, G); break; }
        }
        if (this.t >= total) { this.st = 'idle'; this.mv = null; }
        break;
      }

let S = null;
function startStory() { go(new SelectScene([{ label: 'STORY MODE' }], d => beginStory(d[0]), () => go(new MainMenu()))); }
function beginStory(p) {

}
function storyStep() {
