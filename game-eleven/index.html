<html lang="en">

<style>

[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', 'Arial Rounded MT Bold', sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }

#touch .pad, #touch .btns { display: flex; gap: 10px; pointer-events: none; }
#touch button { pointer-events: auto; touch-action: none; width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--btn-line); background: var(--btn); color: var(--fg); font: 26px 'Lilita One', sans-serif; padding: 0; }

#touch .btns button { width: 72px; height: 72px; }
@media (max-width: 480px) { #touch button { width: 54px; height: 54px; } #touch .btns button { width: 60px; height: 60px; } }

  get(k, d) { try { const v = localStorage.getItem('tla_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },

const keys = {}, keyEdge = {};

addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (!keys[k]) keyEdge[k] = true;
  keys[k] = true;
  Audio_.unlock();
});
addEventListener('keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function edge(...ks) { let r = false; for (const k of ks) if (keyEdge[k]) r = true; return r; }
function clearEdges() { for (const k in keyEdge) delete keyEdge[k]; }
let twoPlayerInput = false;
function readPad(slot) {
  const K = k => !!keys[k];
  let o;
  if (slot === 0) {
    o = { l: K('a'), r: K('d'), d: K('s'), a: K('f'), b: K('g'), c: K('h') };
    if (!twoPlayerInput) {
      o.l = o.l || K('ArrowLeft'); o.r = o.r || K('ArrowRight'); o.d = o.d || K('ArrowDown');
      o.a = o.a || K('j') || K('z'); o.b = o.b || K('k') || K('x'); o.c = o.c || K('l') || K('c');
    }
    o.l = o.l || !!touch.l; o.r = o.r || !!touch.r; o.d = o.d || !!touch.d;
    o.a = o.a || !!touch.a; o.b = o.b || !!touch.b; o.c = o.c || !!touch.c;
  } else {
    o = { l: K('ArrowLeft'), r: K('ArrowRight'), d: K('ArrowDown'), a: K('j'), b: K('k'), c: K('l') };
  }
  return o;
}

(function () {

    const el = document.getElementById(id); if (!el) continue;
    const on = e => { e.preventDefault(); touch[map[id]] = 1; el.classList.add('on'); Audio_.unlock(); };
    const off = e => { e.preventDefault(); touch[map[id]] = 0; el.classList.remove('on'); };
    el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off);
    el.addEventListener('pointerleave', off); el.addEventListener('pointercancel', off);
  }
})();

const Audio_ = {
  ctx: null, vol: store.get('vol', 0.6), music: store.get('music', true), mNode: null,
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}

  tone(f, d, type = 'square', v = 0.2, slide = 0, delay = 0) {
    const c = this.ctx; if (!c || this.vol <= 0) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v * this.vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.02);
  },
  noise(d, v = 0.2, hp = 800) {
    const c = this.ctx; if (!c || this.vol <= 0) return;
    const n = Math.floor(c.sampleRate * d), b = c.createBuffer(1, n, c.sampleRate), a = b.getChannelData(0);
    for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);

    f.type = 'highpass'; f.frequency.value = hp; s.buffer = b; g.gain.value = v * this.vol;

  },

      case 'super': this.tone(180, 0.5, 'sawtooth', 0.3, 700); this.noise(0.5, 0.35, 500); this.tone(900, 0.3, 'square', 0.15, 400, 0.25); break;
      case 'ui': this.tone(660, 0.05, 'square', 0.12); break;
      case 'ok': this.tone(520, 0.06, 'square', 0.15); this.tone(780, 0.1, 'square', 0.15, 0, 0.06); break;
      case 'back': this.tone(330, 0.07, 'square', 0.12); break;
      case 'ready': this.tone(440, 0.15, 'triangle', 0.25); break;
      case 'fight': this.tone(660, 0.12, 'square', 0.25); this.tone(880, 0.25, 'square', 0.25, 0, 0.1); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.2, 'square', 0.2, 0, i * 0.12)); break;
      case 'lose': [392, 330, 262].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.25, 0, i * 0.2)); break;
    }
  },
  // tiny bouncy loop
  startMusic() {
    if (!this.ctx || !this.music || this.mNode) return;

      if (i % 2 === 0) this.tone(n * 2, 0.08, 'square', 0.03);
      i++;

  },
  setMusic(on) { this.music = on; store.set('music', on); if (on) this.startMusic(); },
  setVol(v) { this.vol = v; store.set('vol', v); }
};

class Fighter {
  constructor(def, slot) { this.def = def; this.slot = slot; this.ctrl = null; this.reset(slot ? 620 : 340); }
  reset(x) {
    this.x = x; this.vx = 0; this.face = this.slot ? -1 : 1; this.hp = this.maxhp = this.def.boss ? 1200 : 1000; this.meter = this.def.boss ? 30 : 0;

    this.crouch = false; this.blocking = false; this.walk = 0; this.combo = 0; this.comboDmg = 0; this.flash = 0; this.inv = 0;
    this.prev = {}; this.buf = { a: 99, b: 99, c: 99 }; this.inp = {}; this.counter = false;

  }
  get hh() { return this.crouch ? this.def.h * 0.62 : this.def.h; }
  get hb() { return this.def.w * 0.82; }
  bufferInput(inp) {
    for (const k of ['a', 'b', 'c']) { this.buf[k] = (inp[k] && !this.prev[k]) ? 0 : Math.min(99, this.buf[k] + 1); }
    this.inp = inp; this.prev = { l: inp.l, r: inp.r, d: inp.d, a: inp.a, b: inp.b, c: inp.c };

  const rest = PLAYABLE.filter(c => c.id !== p.id); const idx = Math.max(0, PLAYABLE.findIndex(c => c.id === p.id)) % rest.length;
  const order = rest.slice(idx).concat(rest.slice(0, idx)); const lv = [0, 1, 1, 2, 2, 3];
  const boss = p.boss ? pick(PLAYABLE) : BYID.chef; order.push(boss);
  S = { p, order: order.slice(0, p.boss ? 5 : 6), lv: p.boss ? [1, 1, 2, 3, 4] : lv.concat([3]), i: 0, cont: 0 };
  go(new Dialogue([{ who: 'n', text: LORE[p.id].goal }, { who: 'n', text: S.order.length + ' fights stand between ' + p.name + ' and the title. Hold back to block, and chain A, B, C for combos.' }], p, order[0], () => storyStep(), 'STORY'));
}
function storyStep() {
  const o = S.order[S.i], p = S.p, last = S.i === S.order.length - 1;
  let lines;
  if (o.id === 'chef') lines = [{ who: 'o', text: LORE.chef.taunt }, { who: 'p', text: LORE[p.id].quip }, { who: 'o', text: "Then you're ready for the main course." }];
  else lines = [{ who: 'p', text: LORE[p.id].quip }, { who: 'o', text: LORE[o.id].taunt }];
  go(new Dialogue(lines, p, o, () => storyFight(), 'FIGHT ' + (S.i + 1) + ' OF ' + S.order.length + (last ? '  -  FINAL' : '')));
}
function storyFight() {
  const o = S.order[S.i], p = S.p;
  go(new FightScene({
    defs: [p, o], ctrls: ['pad0', new Brain(S.lv[S.i])], stage: o.id === 'chef' ? 3 : S.i % 3, humans: 1, noRestart: true, label: 'CPU: ' + LEVELS[S.lv[S.i]].n,
    onQuit: () => go(new MainMenu()),
    onEnd: r => {
      if (r.winner === 0) {
        const xp = awardXP(r.G, true, S.lv[S.i]); S.i++; Audio_.sfx('win');
        if (S.i >= S.order.length) storyEnd();
        else go(new ResultScene({ title: 'YOU WIN!', win: true, def: p, sub: 'Next up: ' + S.order[S.i].name, G: r.G, xp }, [{ label: 'NEXT FIGHT', fn: () => storyStep() }, { label: 'QUIT STORY', fn: () => go(new MainMenu()) }]));
      } else {
        S.cont++; Audio_.sfx('lose'); const xp = awardXP(r.G, false, 0);
        go(new ResultScene({ title: 'DEFEATED', win: false, def: p, sub: 'Continues used: ' + S.cont, G: r.G, xp }, [{ label: 'CONTINUE', fn: () => storyFight() }, { label: 'QUIT STORY', fn: () => go(new MainMenu()) }]));
      }
    }
  }));
}
function storyEnd() {
  const p = S.p, newly = !unlockedChef; unlockedChef = true; store.set('chef', true);
  go(new Dialogue([{ who: 'n', text: LORE[p.id].end }, { who: 'n', text: 'THE END.  Continues used: ' + S.cont + (newly ? '.  Head Chef Gran is now unlocked as a playable fighter!' : '.') }], p, p, () => go(new MainMenu()), 'CHAMPION!'));
}
// ---------- Other modes ----------
function startVsCpu() {
  go(new SelectScene([{ label: 'PLAYER 1' }, { label: 'CPU OPPONENT' }], defs => go(new LevelScene(lv => vsCpuFight(defs, lv), () => go(new MainMenu()))), () => go(new MainMenu())));
}
function vsCpuFight(defs, lv) {
  go(new FightScene({ defs, ctrls: ['pad0', new Brain(lv)], humans: 1, label: 'CPU: ' + LEVELS[lv].n,
    onQuit: () => go(new MainMenu()),
    onEnd: r => go(new ResultScene({ title: r.winner === 0 ? 'YOU WIN!' : r.winner === 1 ? 'CPU WINS' : 'DRAW', win: r.winner === 0, def: defs[r.winner === 1 ? 1 : 0], G: r.G, xp: awardXP(r.G, r.winner === 0, lv), streak: recordStreak(r.winner === 0) },
      [{ label: 'REMATCH', fn: () => vsCpuFight(defs, lv) }, { label: 'CHANGE FIGHTERS', fn: () => startVsCpu() }, { label: 'MAIN MENU', fn: () => go(new MainMenu()) }])) }));
}
function startLocal() { go(new SelectScene([{ label: 'PLAYER 1' }, { label: 'PLAYER 2' }], defs => localFight(defs), () => go(new MainMenu()))); }
function localFight(defs) {
  go(new FightScene({ defs, ctrls: ['pad0', 'pad1'], local: true, humans: 1, onQuit: () => go(new MainMenu()),
    onEnd: r => go(new ResultScene({ title: r.winner < 0 ? 'DRAW' : 'PLAYER ' + (r.winner + 1) + ' WINS!', win: true, def: defs[r.winner < 0 ? 0 : r.winner], G: r.G },
      [{ label: 'REMATCH', fn: () => localFight(defs) }, { label: 'CHANGE FIGHTERS', fn: () => startLocal() }, { label: 'MAIN MENU', fn: () => go(new MainMenu()) }])) }));
}
function startTraining() {
  go(new SelectScene([{ label: 'YOU' }, { label: 'TRAINING DUMMY' }], defs => go(new FightScene({ defs, ctrls: ['pad0', 'dummy'], training: true, humans: 1, stage: ri(0, 2), onQuit: () => go(new MainMenu()), onEnd: () => go(new MainMenu()) })), () => go(new MainMenu())));
}
function startWatch() {
  go(new LevelScene(lv => watchFight(lv), () => go(new MainMenu()), 'WATCH CPU - SKILL'));
}
function watchFight(lv) {
  const a = pick(PLAYABLE), b = pick(PLAYABLE);
  go(new FightScene({ defs: [a, b], ctrls: [new Brain(lv), new Brain(lv)], noRestart: true, label: 'CPU vs CPU  (' + LEVELS[lv].n + ')  - Esc for menu', onQuit: () => go(new MainMenu()), onEnd: () => watchFight(lv) }));
}
// ---------- Boot ----------
function loop(now) {
  const dt = Math.min(100, now - (loop.last || now)); loop.last = now; loop.acc = (loop.acc || 0) + dt;
  while (loop.acc >= 1000 / 60) { tick++; sceneT++; scene.update(); clearEdges(); loop.acc -= 1000 / 60; }
  cx.save(); cx.clearRect(0, 0, W, H); scene.render(); cx.restore();
  requestAnimationFrame(loop);
}
function boot() { go(new TitleScene()); requestAnimationFrame(loop); }
if (!window.__TEST) {
  const f = document.fonts && document.fonts.load ? Promise.race([document.fonts.load("40px 'Lilita One'"), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
  f.then(boot, boot);
}
